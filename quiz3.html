<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>助詞クイズ (109 предложений)</title>

  <!-- Отступ под кнопки Telegram -->
  <style>
    body {
      padding-top: calc(100px + env(safe-area-inset-top, 0px)) !important;
    }
  </style>

  <style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f4f1ea;
    color: #2c2c2a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1 { font-size: 22px; font-weight: 600; text-align: center; margin: 0 0 4px; }
  .sub { text-align: center; font-size: 14px; color: #6b6a63; margin: 0 0 18px; }
  .blocks { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .block-btn {
    border: 1px solid #d3d1c7; background: #fff; padding: 8px 12px;
    border-radius: 20px; font-size: 12px; cursor: pointer; color: #2c2c2a;
    text-align: center; line-height: 1.3;
  }
  .block-btn.active { background: #2c2c2a; color: #fff; border-color: #2c2c2a; }
  .block-btn.mistakes-btn { border-color: #d97757; color: #d97757; }
  .block-btn.mistakes-btn.active { background: #d97757; color: #fff; border-color: #d97757; }
  .status-bar { display: flex; justify-content: space-between; font-size: 13px; color: #6b6a63; margin-bottom: 6px; }
  .status-bar b { color: #2c2c2a; }
  .progress-track { height: 6px; background: #e5e2d8; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { height: 100%; background: #d97757; border-radius: 3px; transition: width 0.3s; }

  .sentence-card {
    background: #fff; border: 1px solid #d3d1c7; border-radius: 16px;
    padding: 28px 20px; text-align: center; margin-bottom: 18px;
    position: relative;
  }
  .sentence-jp { font-size: 24px; line-height: 1.6; word-break: break-word; }
  .blank { display: inline-block; min-width: 34px; border-bottom: 2px solid #d97757; color: #d97757; font-weight: 700; }

  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .option-btn {
    border: 1px solid #d3d1c7; background: #fff; border-radius: 12px;
    padding: 16px 8px; font-size: 22px; cursor: pointer; color: #2c2c2a;
  }
  .option-btn:active { transform: scale(0.97); }
  .option-btn.correct { background: #eaf3de; border-color: #97c459; color: #2c5b0e; }
  .option-btn.wrong { background: #fcebeb; border-color: #f09595; color: #8f2c2c; }
  .option-btn.disabled { pointer-events: none; opacity: 0.6; }
  .option-btn.disabled.correct, .option-btn.disabled.wrong { opacity: 1; }

  .feedback-panel {
    background: #eeedfe; border: 1px solid #afa9ec; border-radius: 14px;
    padding: 16px; margin-bottom: 16px; display: none;
  }
  .feedback-panel.show { display: block; }
  .feedback-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .feedback-title { font-size: 14px; font-weight: 700; }
  .feedback-title.ok { color: #2c5b0e; }
  .feedback-title.bad { color: #8f2c2c; }
  .replay-btn {
    flex: 0 0 auto; border: 1px solid #afa9ec; background: #fff; color: #3c3489;
    border-radius: 10px; padding: 6px 10px; font-size: 15px; cursor: pointer; line-height: 1;
  }
  .replay-btn:active { transform: scale(0.95); }
  .feedback-rule { font-size: 14px; color: #3c3489; line-height: 1.5; margin-bottom: 12px; font-weight: 600; }
  
  .fb-kana { font-size: 22px; font-weight: 700; color: #2c2c2a; margin-bottom: 6px; line-height: 1.4; }
  .fb-translation { font-size: 18px; font-weight: 600; color: #3c3489; margin-bottom: 12px; line-height: 1.4; }
  .fb-vocab { font-size: 14px; color: #4a4a45; line-height: 1.6; margin-bottom: 12px; }
  .fb-grammar { font-size: 14px; color: #4a4a45; line-height: 1.6; border-top: 1px dashed #cfc9f0; padding-top: 10px; }

  .next-btn {
    display: none; width: 100%; background: #d97757; color: #fff; border: none;
    padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
  }
  .next-btn.show { display: block; }

  .summary { text-align: center; padding: 30px 10px; }
  .summary h2 { font-size: 20px; margin-bottom: 8px; }
  .summary p { color: #6b6a63; font-size: 14px; margin-bottom: 20px; }
  .restart-btn {
    background: #2c2c2a; color: #fff; border: none; padding: 12px 24px;
    border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    margin: 0 6px 10px;
  }

  .empty-mistakes { text-align: center; padding: 40px 10px; color: #6b6a63; font-size: 14px; line-height: 1.6; }

  /* Кнопка возврата в главное меню */
  .back-to-menu {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: #6b6a63;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    background: #fff;
    border: 1px solid #d3d1c7;
    border-radius: 20px;
    margin-bottom: 14px;
    transition: all 0.2s ease;
  }
  .back-to-menu:hover, .back-to-menu:active {
    background: #2c2c2a;
    color: #fff;
    border-color: #2c2c2a;
  }
</style>
</head>

  <h1>助詞クイズ 3</h1>
  <p class="sub">Выбери правильную частицу на месте пропуска</p>

  <div class="blocks" id="blocks"></div>

  <div class="status-bar">
    <span>Вопрос <b id="qNum">1</b> / <b id="qTotal">1</b></span>
    <span>Верно: <b id="qScore">0</b></span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div id="quizArea"></div>
</div>

<script>
const RAW_QUIZ_DATA = [
  {"front":"私の両親と兄弟は外国に住んでいます。","blanked":"私の両親___兄弟は外国に住んでいます。","particle":"と","explanation":"Частица «と» соединяет однородные члены (полный список: «родители И братья с сестрами»).","back":"わたしの りょうしんと きょうだいは がいこくに すんでいます。\nМои родители, братья и сестры живут за границей.\n• 両親 (りょうしん) — родители\n• 兄弟 (きょうだい) — братья и сестры\n• 外国に (がいこくに) — за границей\nГрамматика: [А] と [Б] = А и Б."},
  {"front":"兄は独身ですが、姉は結婚しています。","blanked":"兄___独身ですが、姉は結婚しています。","particle":"は","explanation":"Частица темы и противопоставления «は» (брат холост, А сестра замужем).","back":"あには どくしんですが、あねは けっこん しています。\nМой старший брат холост, а старшая сестра замужем.\n• 兄 (あに) — мой старший брат\n• 独身 (どくしん) — холост / не замужем\n• 姉 (あね) — моя старшая сестра\nГрамматика: [тема 1] は ... が、[тема 2] は ... = сопоставление/противопоставление."},
  {"front":"お兄さんは高校で教えていて、お姉さんは市役所で働いていますか。","blanked":"お兄さんは高校___教えていて、お姉さんは市役所で働いていますか。","particle":"で","explanation":"Частица «で» указывает на место совершения действия (преподавать в школе).","back":"おにいさんは こうこうで おしえていて、おねえさんは しやくしょで はたらいていますか。\nВаш старший брат преподает в старшей школе, а старшая сестра работает в мэрии?\n• 高校 (こうこう) — старшая школа\n• 教える (おしえる) — преподавать / учить\n• 市役所 (しやくしょ) — мэрия\nГрамматика: [место] で [действие] = действие происходит в [месте]."},
  {"front":"弟は背が高くて、妹は髪が長いです。","blanked":"弟は背___高くて、妹は髪が長いです。","particle":"が","explanation":"Частица «が» выделяет признак при описании внешности/свойств субъекта.","back":"おとうとは せが たかくて、いもうとは かみが ながいです。\nМой младший брат высокий, а у младшей сестры длинные волосы.\n• 弟 (おとうと) — младший брат\n• 背が高い (せがたかい) — высокий (ростом)\n• 妹 (いもうと) — младшая сестра\n• 髪 (かみ) — волосы\nГрамматика: [тема] は [признак] が [прилагательное]."},
  {"front":"田中さんの弟さんと妹さんは、どこで生まれましたか。","blanked":"田中さんの弟さん___妹さんは、どこで生まれましたか。","particle":"と","explanation":"Частица «と» соединяет существительные («младший брат И младшая сестра»).","back":"たなかさんの おとうとさんと いもうとさんは、どこで うまれましたか。\nГде родились младший брат и младшая сестра господина Танаки?\n• 弟さん (おとうとさん) — младший брат (чужой)\n• 妹さん (いもうとさん) — младшая сестра (чужая)\n• 生まれる (うまれる) — родиться\nГрамматика: [А] と [Б] = союз «и»."},
  {"front":"私たち留学生のクラスは、みんなで楽しく勉強しています。","blanked":"私たち留学生___クラスは、みんなで楽しく勉強しています。","particle":"の","explanation":"Частица «の» связывает два существительных («класс иностранных студентов»).","back":"わたしたち りゅうがくせいの クラスは、みんなで たのしく べんきょう しています。\nНаш класс иностранных студентов весело учится всем составом.\n• 留学生 (りゅうがくせい) — иностранные студенты\n• クラス — класс / группа\n• 楽しく (たのしく) — весело\nГрамматика: [сущ.] の [сущ.] = определение существительного."},
  {"front":"僕と君は友達だから、山田君にも紹介したいです。","blanked":"僕___君は友達だから、山田君にも紹介したいです。","particle":"と","explanation":"Частица «と» соединяет равноправные лица («я и ты»).","back":"ぼくと きみは ともだちだから、やまだくんにも しょうかい したいです。\nРаз мы с тобой друзья, я хочу познакомить тебя и с Ямада-куном.\n• 僕 (ぼく) — я\n• 君 (きみ) — ты\n• 友達 (ともだち) — друг\n• 紹介する (しょうかいする) — знакомить / представлять\nГрамматика: [лицо] と [лицо] = лицо и лицо."},
  {"front":"外国に３年間住んでいましたが、日本語は２か月だけ勉強しました。","blanked":"外国___３年間住んでいましたが、日本語は２か月だけ勉強しました。","particle":"に","explanation":"Частица «に» указывает на место жительства с глаголом 住む.","back":"がいこくに さんねんかん すんでいましたが、にほんごは にかげつ だけ べんきょう しました。\nЯ прожил за границей 3 года, но японский учил всего 2 месяца.\n• 外国 (がいこく) — заграница\n• ３年間 (さんねんかん) — в течение 3 лет\n• 住む (すむ) — жить\nГрамматика: [место] に 住む = жить в [месте]."},
  {"front":"ここから空港までどのくらいかかりますか。","blanked":"ここ___空港までどのくらいかかりますか。","particle":"から","explanation":"Частица «から» обозначает отправную точку маршрута («отсюда»).","back":"ここから くうこうまで どのくらい かかりますか。\nСколько примерно времени займет дорога отсюда до аэропорта?\n• ここから — отсюда\n• 空港 (くうこう) — аэропорт\n• かかる — занимать (время)\nГрамматика: [откуда] から [куда] まで = от ... до ..."},
  {"front":"１週間休みを取って、田舎へ帰るつもりです。","blanked":"１週間休みを取って、田舎___帰るつもりです。","particle":"へ","explanation":"Частица «へ» (произносится [э]) указывает направление движения к цели.","back":"いっしゅうかん やすみを とって、いなかへ かえる つもりです。\nЯ собираюсь взять отпуск на одну неделю и вернуться в родную деревню.\n• 休みを取る (やすみをとる) — брать отпуск\n• 田舎 (いなか) — родная деревня\n• 帰る (かえる) — возвращаться\nГрамматика: [место] へ [глагол движения] = направление движения."},
  {"front":"いってきます。いってらっしゃい。","blanked":"いってきます。いって___っしゃい。","particle":"ら","explanation":"Традиционная парная фраза при выходе из дома: いってきます — いってらっしゃい.","back":"いってきます。いってらっしゃい。\nА: Я ушел / пошел! В: Счастливого пути!\n• いってきます — я ушел (и вернусь)\n• いってらっしゃい — счастливого пути / иди и возвращайся\nГрамматика: этикетные формулы приветствия/прощания дома."},
  {"front":"ただいま！お帰りなさい。","blanked":"ただいま！お___りなさい。","particle":"帰","explanation":"Традиционная парная фраза при возвращении: ただいま — おかえりなさい.","back":"ただいま！おかえりなさい。\nА: Я дома! / Я вернулся! В: С возвращением!\n• ただいま — я вернулся\n• お帰りなさい (おかえりなさい) — с возвращением\nГрамматика: домашние этикетные выражения."},
  {"front":"ビールを２つください。","blanked":"ビール___２つください。","particle":"を","explanation":"Частица прямого дополнения «を» обозначает объект заказа.","back":"ビールを ふたつ ください。\nДайте, пожалуйста, два пива.\n• ビール — пиво\n• ２つ (ふたつ) — две штуки\n• ください — дайте пожалуйста\nГрамматика: [объект] を [кол-во] ください = заказ в кафе/магазине."},
  {"front":"日曜日は？ううん、行かない。","blanked":"日曜日___？ううん、行かない。","particle":"は","explanation":"Частица «は» используется для перевода темы / вопроса о конкретном дне («А в воскресенье?»).","back":"にちようびは？ううん、いかない。\n«А в воскресенье?» — «Не-а, не пойду».\n• 日曜日 (にちようび) — воскресенье\n• ううん — нет (разговорное)\n• 行かない (いかない) — не пойду\nГрамматика: [тема] は？ = «А что насчет [темы]?»"},
  {"front":"おかげさまで、元気です。","blanked":"おかげさま___、元気です。","particle":"で","explanation":"Идиоматическое выражение おかげさまで (благодаря вам / вашим молитвам).","back":"おかげさまで、げんきです。\nБлагодаря вашей заботе, всё хорошо.\n• おかげさまで — благодаря вам\n• 元気 (げんき) — бодрый / здоровый\nГрамматика: устойчивое выражение вежливости."},
  {"front":"お誕生日おめでとうございます！","blanked":"お誕生日おめでとう___ざいます！","particle":"ご","explanation":"Стандартная вежливая формула поздравления: おめでとうございます.","back":"おたんじょうび おめでとう ございます！\nПоздравляю с днем рождения!\n• 誕生日 (たんじょうび) — день рождения\n• おめでとうございます — поздравляю\nГрамматика: формула поздравления."},
  {"front":"この問題は簡単ですが、答えを書く時間が短いです。","blanked":"この問題は簡単ですが、答え___書く時間が短いです。","particle":"を","explanation":"Частица «を» обозначает объект действия («писать ответ»).","back":"この もんだいは かんたんですが、こたえを かく じかんが みじかいです。\nЭтот вопрос/задача простой, но времени на запись ответа мало.\n• 問題 (もんだい) — задача / вопрос\n• 答え (こたえ) — ответ\n• 書く (かく) — писать\nГрамматика: [объект] を 書く = писать [объект]."},
  {"front":"駅に近いアパートは家賃が高くて、遠いアパートは安いです。","blanked":"駅___近いアパートは家賃が高くて、遠いアパートは安いです。","particle":"に","explanation":"С прилагательным 近い (близкий к...) используется частица «に».","back":"えきに ちかい アパートは やちんが たかくて、とおい アパートは やすいです。\nКвартира близко к станции дорогая, а далекая — дешевая.\n• 駅 (えき) — станция\n• 近い (ちかい) — близкий к\n• 家賃 (やちん) — арендная плата\nГрамматика: [место] に 近い = близко к [месту]."},
  {"front":"新幹線は速いですが、バスは遅いです。","blanked":"新幹線___速いですが、バスは遅いです。","particle":"は","explanation":"Частица «は» оформляет тему и сопоставление субъектов.","back":"しんかんせんは はやいですが、バスは おそいです。\nСинкансэн быстрый, а автобус медленный.\n• 新幹線 (しんかんせん) — скоростной поезд\n• 速い (はやい) — быстрый\n• 遅い (おそい) — медленный\nГрамматика: [А] は ... が、[Б] は ... = сопоставление."},
  {"front":"東京は人が多くて、緑が少ないです。","blanked":"東京は人___多くて、緑が少ないです。","particle":"が","explanation":"Частица «が» оформляет подлежащее с предикатом 多い (многочисленный).","back":"とうきょうは ひとが おおくて、みどりが すくないです。\nВ Токио людей много, а зелени мало.\n• 人 (ひと) — люди\n• 多い (おおい) — много\n• 緑 (みどり) — зелень\n• 少ない (すくない) — мало\nГрамматика: [сущ.] が 多い / 少ない = много / мало [чего-то]."},
  {"front":"春は暖かくて、秋は涼しいです。","blanked":"春___暖かくて、秋は涼しいです。","particle":"は","explanation":"Частица «は» выделяет тему весенней погоды в сопоставлении с осенью.","back":"はるは あたたかくて、あきは すずしいです。\nВесной тепло, а осенью прохладно.\n• 春 (はる) — весна\n• 暖かい (あたたかい) — теплый\n• 秋 (あき) — осень\n• 涼しい (すずしい) — прохладный\nГрамматика: сопоставление тем через は."},
  {"front":"夏は海で泳ぎます。冬は雪が降りますから、スキーをします。","blanked":"夏は海___泳ぎます。冬は雪が降りますから、スキーをします。","particle":"で","explanation":"Частица «で» обозначает место действия (плавать в море).","back":"なつは うみで およぎます。ふゆは ゆきが ふりますから、スキーを します。\nЛетом я плаваю в море. Зимой идет снег, поэтому я катаюсь на лыжах.\n• 海 (うみ) — море\n• 泳ぐ (およぐ) — плавать\n• 冬 (ふゆ) — зима\n• 雪が降る (ゆきがふる) — идет снег\nГрамматика: [место] で [действие] = действие в месте."},
  {"front":"昨日の天気は曇りでしたが、今日は雨が降っています。","blanked":"昨日の天気は曇りでしたが、今日___雨が降っています。","particle":"は","explanation":"Частица «は» выделяет сегодняшний день как тему предложения.","back":"きのうの てんきは くもりでしたが、きょうは あめが ふっています。\nВчера погода была пасмурной, а сегодня идет дождь.\n• 曇り (くもり) — облачно / пасмурно\n• 今日 (きょう) — сегодня\n• 雨が降る (あめがふる) — идет дождь\nГрамматика: временной ориентир как тема с は."},
  {"front":"この料理は甘いですが、あのスープは辛いです。","blanked":"この料理___甘いですが、あのスープは辛いです。","particle":"は","explanation":"Частица «は» служит для выделения первого блюда в сравнении со вторым.","back":"この りょうりは あまいですが、あの スープは からいです。\nЭто блюдо сладкое, а тот суп острый.\n• 料理 (りょうり) — блюдо / еда\n• 甘い (あまい) — сладкий\n• 辛い (からい) — острый\nГрамматика: противопоставление через は."},
  {"front":"この荷物は重いですが、その鞄は軽いです。","blanked":"この荷物___重いですが、その鞄は軽いです。","particle":"は","explanation":"Частица «は» противопоставляет тяжелый багаж легкой сумке.","back":"この にもつは おもいですが、その かばんは かるいです。\nЭтот багаж тяжелый, а та сумка легкая.\n• 荷物 (にもつ) — багаж\n• 重い (おもい) — тяжелый\n• 鞄 (かばん) — сумка\n• 軽い (かるい) — легкий\nГрамматика: сравнительное сопоставление свойств."},
  {"front":"四季の季節の中で、紅葉が綺麗な秋が一番好きです。","blanked":"四季の季節の中で、紅葉___綺麗な秋が一番好きです。","particle":"が","explanation":"Частица «が» выделяет признак («кленовые листья красивы») внутри определительного оборота.","back":"しきの きせつの なかで、もみじが きれいな あきが いちばん すきです。\nИз всех времен года я больше всего люблю осень, когда красивы кленовые листья.\n• 四季 (しき) — 4 сезона\n• 紅葉 (もみじ) — осенние клены\n• 綺麗 (きれい) — красивый\nГрамматика: определительный оборот с субъектным が."},
  {"front":"初めて日本へ来た時は、言葉が分からなくて大変でした。","blanked":"初めて日本___来た時は、言葉が分からなくて大変でした。","particle":"へ","explanation":"Частица «へ» указывает на направление прибытия («приехал в Японию»).","back":"はじめて にほんへ きた ときは、ことばが わからなくて たいへんでした。\nКогда я впервые приехал в Японию, было тяжело, так как я не понимал языка.\n• 初めて (はじめて) — впервые\n• 言葉 (ことば) — слова / язык\n• 大変 (たいへん) — тяжелый / трудный\nГрамматика: [место] へ 来る = приехать в [место]."},
  {"front":"お腹が空きましたから、豚肉のすき焼きや牛肉の天ぷらを食べたいです。","blanked":"お腹が空きましたから、豚肉のすき焼き___牛肉の天ぷらを食べたいです。","particle":"や","explanation":"Частица неполного перечисления «や» («сукияки, тэмпура и т.д.»).","back":"おなかが すきましたから、ぶたにくの すきやきや ぎゅうにくの てんぷらを たべたいです。\nЯ проголодался, поэтому хочу поесть сукияки со свининой, тэмпуру с говядиной и т.д.\n• 豚肉 (ぶたにく) — свинина\n• すき焼き (すきやき) — сукияки\n• 牛肉 (ぎゅうにく) — говядина\n• 天ぷら (てんぷら) — тэмпура\nГрамматика: [А] や [Б] = перечисление примеров."},
  {"front":"喉が渇きましたから、冷たいお茶を飲んで、お腹いっぱいになりました。","blanked":"喉___渇きましたから、冷たいお茶を飲んで、お腹いっぱいになりました。","particle":"が","explanation":"Устойчивое выражение жажды 喉が渇く требует частицу «が».","back":"のどが かわきましたから、つめたい おちゃを のんで、おなかいっぱいに なりました。\nВ горле пересохло, поэтому я выпил холодного чая и теперь сыт.\n• 喉が渇く (のどがかわく) — испытывать жажду\n• 冷たい (つめたい) — холодный\n• お腹いっぱい — сыт\nГрамматика: физиологические ощущения оформляются через が."},
  {"front":"熱と頭の病気がありますから、今日はお風呂に入らないでください。","blanked":"熱と頭の病気がありますから、今日はお風呂___入らないでください。","particle":"に","explanation":"С выражением お風呂に入る (принимать ванну) используется частица вхождения «に».","back":"ねつと あたまの びょうきが ありますから、きょうは おふろに はいらないで ください。\nТак как у вас температура и болит голова, не принимайте сегодня ванну.\n• 熱 (ねつ) — температура / жар\n• お風呂 (おふろ) — ванна\n• 入る (はいる) — входить / принимать\nГрамматика: お風呂に 入る = принимать ванну."},
  {"front":"どうしましたか。風邪で喉が痛いです。薬を飲まなければなりません。お大事に。","blanked":"どうしましたか。風邪___喉が痛いです。薬を飲まなければなりません。お大事に。","particle":"で","explanation":"Частица причины «で» («из-за простуды болит горло»).","back":"どうしましたか。かぜで のどが いたいです。くすりを のまなければ なりません。おだいじに。\nЧто с вами случилось? — Из-за простуды болит горло. Нужно выпить лекарство. — Выздоравливайте!\n• 風邪 (かぜ) — простуда\n• 痛い (いたい) — болит\n• 薬を飲む (くすりをのむ) — принимать лекарство\n• お大事に (おだいじに) — выздоравливайте\nГрамматика: [причина] で = из-за [причины]."},
  {"front":"歯医者に行く前に、必ず保険証を持って行かなければなりません。","blanked":"歯医者___行く前に、必ず保険証を持って行かなければなりません。","particle":"に","explanation":"Частица «に» указывает на цель визита («идти к зубному врачу»).","back":"はいしゃに いく まえに、かならず ほけんしょうを もって いかなければ なりません。\nПеред походом к зубному врачу нужно обязательно взять страховой полис.\n• 歯医者 (はいしゃ) — зубной врач\n• 保険証 (ほけんしょう) — страховой полис\n• 必ず (かならず) — непременно\nГрамматика: [цель/место] に 行く = идти к/в..."},
  {"front":"体全体の調子が弱くても、無理をして会社へ行ってはいけません。","blanked":"体全体の調子が弱くても、無理をして会社___行ってはいけません。","particle":"へ","explanation":"Частица «へ» указывает направление следования («идти в компанию»).","back":"からだ ぜんたいの ちょうしが よわくても、むりを して かいしゃへ いっては いけません。\nДаже если общее самочувствие ослабло, нельзя перенапрягаться и идти на работу.\n• 体全体 (からだぜんたい) — все тело целиком\n• 調子 (ちょうし) — состояние / самочувствие\n• 会社 (かいしゃ) — фирма / офис\nГрамматика: [место] へ 行く = идти по направлению к [месту]."},
  {"front":"顔、目、耳、鼻、口、足を洗ってから、下着と上着を着ます。","blanked":"顔、目、耳、鼻、口、足___洗ってから、下着と上着を着ます。","particle":"を","explanation":"Частица «を» обозначает объект умывания («мыть ноги/лицо»).","back":"かお、め、みみ、はな、くち、あしを あらってから、したぎと うわぎを きます。\nПомыв лицо, глаза, уши, нос, рот и ноги, я надеваю белье и одежду.\n• 足 (あし) — ноги / ступни\n• 洗う (あらう) — мыть\n• 下着 (したぎ) — нижнее белье\n• 上着 (うわぎ) — верхняя одежда\nГрамматика: [объект] を 洗う = мыть [объект]."},
  {"front":"部屋が暗いですから、電気とエアコンを点けて、窓を閉めてください。","blanked":"部屋___暗いですから、電気とエアコンを点けて、窓を閉めてください。","particle":"が","explanation":"Частица «が» выделяет подлежащее в придаточном предложении причины («в комнате темно»).","back":"へやが くらいですから、でんきと エアコンを つけて、まどを しめて ください。\nВ комнате темно, поэтому включите свет и кондиционер, и закройте окно.\n• 暗い (くらい) — темный\n• 電気 (でんき) — электричество / свет\n• 点ける (つける) — включать\n• 閉める (しめる) — закрывать\nГрамматика: [субъект] が [прилагательное] から = так как [субъект]..."},
  {"front":"出かける前に、テレビを消して、ドアの鍵を閉めます。","blanked":"出かける前に、テレビを消して、ドア___鍵を閉めます。","particle":"の","explanation":"Частица «の» связывает определяемое и определение («ключ от двери»).","back":"でかける まえに、テレビを けして、ドアの かぎを しめます。\nПеред выходом из дома я выключаю телевизор и запираю дверь.\n• 出かける (でかける) — выходить из дома\n• 消す (けす) — выключать\n• 鍵 (かぎ) — ключ / замок\nГрамматика: [сущ.] の [сущ.] = принадлежность/связь."},
  {"front":"暑いですから、窓を開けて、少し涼しい風を入れましょう。","blanked":"暑いですから、窓___開けて、少し涼しい風を入れましょう。","particle":"を","explanation":"Частица прямого объекта «を» («открыть окно»).","back":"あついですから、まどを あけて、すこし すずしい かぜを いれましょう。\nЖарко, поэтому давайте откроем окно и впустим прохладный ветерок.\n• 窓 (まど) — окно\n• 開ける (あける) — открывать\n• 涼しい (すずしい) — прохладный\n• 風 (かぜ) — ветер\nГрамматика: [объект] を 開ける = открывать [что-либо]."},
  {"front":"塩と砂糖を取ってください。それから、使い方を教えてください。","blanked":"塩___砂糖を取ってください。それから、使い方を教えてください。","particle":"と","explanation":"Частица «と» соединяет соль и сахар в единый закрытый список.","back":"しおと さとうを とって ください。それから、つかいかたを おしえて ください。\nПередайте, пожалуйста, соль и сахар. А также объясните, как этим пользоваться.\n• 塩 (しお) — соль\n• 砂糖 (さとう) — сахар\n• 取る (とる) — передать / взять\n• 使い方 (つかいかた) — способ использования\nГрамматика: [А] と [Б] = А и Б."},
  {"front":"この機械で資料をコピーすることができます。","blanked":"この機械___資料をコピーすることができます。","particle":"で","explanation":"Частица инструмента/средства «で» («на этом аппарате»).","back":"この きかいで しりょうを コピーする ことが できます。\nНа этом аппарате можно делать копии документов.\n• 機械 (きかい) — аппарат / механизм\n• 資料 (しりょう) — материалы / документы\n• ことができる — иметь возможность\nГрамматика: [инструмент] で [действие] = выполнять действие при помощи [инструмента]."},
  {"front":"和室の押し入れから布団を出して、畳の上に置きます。","blanked":"和室の押し入れ___布団を出して、畳の上に置きます。","particle":"から","explanation":"Частица «から» обозначает исходный пункт («из стенного шкафа»).","back":"わしつの おしいれから ふとんを だして、たたみの うえに おきます。\nЯ достаю футон из шкафа японской комнаты и кладу его на татами.\n• 和室 (わしつ) — комната в японском стиле\n• 押し入れ (おしいれ) — встроенный шкаф\n• 布団 (ふとん) — футон\n• 畳 (たたみ) — татами\nГрамматика: [место] から 出す = извлекать из [места]."},
  {"front":"信号の交差点をまっすぐ行って、次の角を右へ曲がると、橋があります。","blanked":"信号の交差点をまっすぐ行って、次の角___右へ曲がると、橋があります。","particle":"を","explanation":"Частица «を» обозначает место поворота с глаголом 曲がる.","back":"しんごうの こうさてんを まっすぐ いって、つぎの かどを みぎへ まがると、はしが あります。\nЕсли пойти прямо через перекресток со светофором и повернуть на следующем углу направо, будет мост.\n• 信号 (しんごう) — светофор\n• 交差点 (こうさてん) — перекресток\n• 角 (かど) — угол\n• 曲がる (まがる) — поворачивать\nГрамматика: [место] を 曲がる = повернуть на [месте]."},
  {"front":"道を渡ってから、あの高い建物の前でタクシーを呼びます。","blanked":"道___渡ってから、あの高い建物の前でタクシーを呼びます。","particle":"を","explanation":"Частица «を» с глаголом 渡る обозначает проходимое/пересекаемое пространство («перейти улицу»).","back":"みちを わたってから、あの たかい たてものの まえで タクシーを よびます。\nПерейдя дорогу, я вызову такси перед тем высоким зданием.\n• 道 (みち) — дорога / улица\n• 渡る (わたる) — переходить через\n• 建物 (たてもの) — здание\nГрамматика: [пространство] を 渡る = переходить [дорогу/мост]."},
  {"front":"危ないですから、駐車場の前に車を止めないでください。","blanked":"危ないですから、駐車場の前___車を止めないでください。","particle":"に","explanation":"Частица фиксации результата «に» с глаголом 止める (остановить/припарковать перед стоянкой).","back":"あぶないですから、ちゅうしゃじょうの まえに くるまを とめないで ください。\nТак как это опасно, не останавливайте машину перед парковкой.\n• 危ない (あぶない) — опасный\n• 駐車場 (ちゅうしゃじょう) — парковка\n• 車を止める (くるまをとめる) — останавливать машину\nГрамматика: [место] に 止める = парковать в [месте]."},
  {"front":"電車に乗って、次の駅で地下鉄に乗り換えて、市役所の前で降ります。","blanked":"電車___乗って、次の駅で地下鉄に乗り換えて、市役所の前で降ります。","particle":"に","explanation":"С глаголом посадки в транспорт 乗る используется частица «に».","back":"でんしゃに のって、つぎの えきで ちかてつに のりかえて、しやくしょの まえで おります。\nСев на поезд, я сделаю пересадку на метро на следующей станции и сойду перед мэрией.\n• 電車 (でんしゃ) — поезд\n• 乗り換える (のりかえる) — делать пересадку\n• 降りる (おりる) — выходить из транспорта\nГрамматика: [транспорт] に 乗る = садиться в транспорт."},
  {"front":"どうやって駅まで行きますか。地図を見せて、歩き方を説明します。","blanked":"どうやって駅___行きますか。地図を見せて、歩き方を説明します。","particle":"まで","explanation":"Частица предельного пункта «まで» («до станции»).","back":"どうやって えきまで いきますか。ちずを みせて、あるきかたを せつめいします。\nКак добраться до станции? — Я покажу карту и объясню маршрут пешком.\n• どうやって — каким образом\n• 地図 (ちず) — карта\n• 歩き方 (あるきかた) — способ дойти пешком\n• 説明する (せつめいする) — объяснять\nГрамматика: [цель] まで 行く = добираться до [цели]."},
  {"front":"時刻表の１番のバスに乗れば、すぐ着きます。","blanked":"時刻表___１番のバスに乗れば、すぐ着きます。","particle":"の","explanation":"Частица «の» связывает определение расписания с автобусом.","back":"じこくひょうの いちばんの バスに のれば、すぐ つきます。\nЕсли сесть на автобус номер 1 из расписания, прибудете сразу же.\n• 時刻表 (じこくひょう) — расписание\n• バスに乗る — садиться на автобус\n• 着く (つく) — прибывать\nГрамматика: [сущ.] の [сущ.] = определение."},
  {"front":"このボタンを回すと、お湯が出ます。引くと、水が止まります。","blanked":"このボタン___回すと、お湯が出ます。引くと、水が止まります。","particle":"を","explanation":"Частица «を» обозначает объект вращения/управления кнопкой.","back":"この ボタンを まわすと、おゆが でます。ひくと、みずが とまります。\nЕсли повернуть эту ручку, потечет горячая вода; если потянуть — остановится.\n• ボタン — кнопка / регулятор\n• 回す (まわす) — поворачивать / крутить\n• お湯 (おゆ) — горячая вода\n• 出る (でる) — выходить / течь\nГрамматика: [объект] を 回す = поворачивать [объект]."},
  {"front":"故障の音がしますから、触らないでください。","blanked":"故障の音___しますから、触らないでください。","particle":"が","explanation":"Конструкция восприятия звука/запаха 音がする требует частицу «が».","back":"こしょうの おとが しますから、さわらないで ください。\nСлышен звук неисправности, поэтому не прикасайтесь.\n• 故障 (こしょう) — неисправность / поломка\n• 音 (おと) — звук\n• 触る (さわる) — трогать / касаться\nГрамматика: 音 / 声 / 匂い が する = слышится звук/голос/запах."},
  {"front":"銀行でお金を下ろしてから、新しいスーツとコートを買いました。","blanked":"銀行でお金___下ろしてから、新しいスーツとコートを買いました。","particle":"を","explanation":"Частица «を» обозначает снимаемые со счета деньги.","back":"ぎんこうで おかねを おろしてから、あたらしい スーツと コートを かいました。\nСняв деньги в банке, я купил новый деловой костюм и пальто.\n• 銀行 (ぎんこう) — банк\n• お金を下ろす (おかねをおろす) — снимать деньги\n• コート — пальто\nГрамматика: [объект] を 下ろす = снимать [деньги]."},
  {"front":"現金が足りない時は、カードで払ってもいいです。","blanked":"現金が足りない時は、カード___払ってもいいです。","particle":"で","explanation":"Частица «で» указывает на платежное средство (банковскую карту).","back":"げんきんが たりない ときは、カードで はらっても いいです。\nКогда наличных денег не хватает, можно расплатиться картой.\n• 現金 (げんきん) — наличные\n• 足りない (たりない) — не хватает\n• 払う (はらう) — платить\nГрамматика: [платежное средство] で 払う = платить [чем-то]."},
  {"front":"この店はサービスが良くて、服のサイズを無料で変えることができます。","blanked":"この店はサービス___良くて、服のサイズを無料で変えることができます。","particle":"が","explanation":"Частица «が» оформляет признак (сервис хороший) в структуре [тема] は [признак] が [прил.].","back":"この みせは サービスが よくて、ふくの サイズを むりょうで かえる ことが できます。\nВ этом магазине отличный сервис, и можно бесплатно поменять размер одежды.\n• サービス — сервис / обслуживание\n• 良い (よい) — хороший\n• 無料 (むりょう) — бесплатно\n• 変える (かえる) — менять\nГрамматика: [тема] は [параметр] が 良い = иметь хороший [параметр]."},
  {"front":"黒いセーターを着て、帽子をかぶって、眼鏡をかけている人は誰ですか。","blanked":"黒いセーターを着て、帽子___かぶって、眼鏡をかけている人は誰ですか。","particle":"を","explanation":"Частица прямого объекта «を» с глаголом надевания головного убора かぶる.","back":"くろい セーターを きて、ぼうしを かぶって、めがねを かけている ひとは だれですか。\nКто тот человек, который одет в черный свитер, носит шляпу и очки?\n• 帽子 (ぼうし) — шляпа / кепка\n• かぶる — надевать на голову\n• 眼鏡をかける (めがねをかける) — носить очки\nГрамматика: 帽子 を かぶる = надевать шляпу."},
  {"front":"新しいズボンをはいたことがありますか。","blanked":"新しいズボン___はいたことがありますか。","particle":"を","explanation":"Частица «を» с глаголом надевания на ноги 履く (はく).","back":"あたらしい ズボンを はいた ことが ありますか。\nВы уже надевали (примеряли) новые брюки?\n• ズボン — брюки / штаны\n• 履く (はく) — надевать на нижнюю часть тела\n• 〜たことがある — иметь опыт\nГрамматика: [одежда] を はく = надевать брюки/обувь."},
  {"front":"明日は休みですから、残業しなくてもいいです。","blanked":"明日___休みですから、残業しなくてもいいです。","particle":"は","explanation":"Частица «は» выделяет завтрашний день в качестве темы.","back":"あしたは やすみですから、ざんぎょう しなくても いいです。\nЗавтра выходной, поэтому можно не работать сверхурочно.\n• 休み (やすみ) — выходной\n• 残業する (ざんぎょうする) — работать сверхурочно\n• 〜なくてもいい — можно не делать\nГрамматика: временной ориентир как тема с は."},
  {"front":"私の趣味はピアノを弾くことと、歌を歌うことです。","blanked":"私の趣味はピアノ___弾くことと、歌を歌うことです。","particle":"を","explanation":"Частица «を» с глаголом 弾く (играть на клавишных/струнных инструментах).","back":"わたしの しゅみは ピアノを ひく ことと、うたを うたう ことです。\nМое хобби — играть на пианино и петь песни.\n• 趣味 (しゅみ) — хобби\n• ピアノを弾く (ひく) — играть на пианино\n• 歌を歌う (うたをうたう) — петь песню\nГрамматика: [инструмент] を 弾く = играть на [инструменте]."},
  {"front":"日本の伝統的な生け花や着物に興味があります。","blanked":"日本の伝統的な生け花___着物に興味があります。","particle":"や","explanation":"Частица «や» используется для перечисления традиций («икебана, кимоно и т.п.»).","back":"にほんの でんとうてきな いけばなや きものに きょうみが あります。\nЯ интересуюсь традиционной японской икебаной и кимоно.\n• 伝統的 (でんとうてき) — традиционный\n• 生け花 (いけばな) — икебана\n• 興味がある (きょうみがある) — иметь интерес\nГрамматика: [А] や [Б] に 興味がある = интересоваться А, Б и т.д."},
  {"front":"週末はお寺や神社を見学したり、川で釣りをしたりします。","blanked":"週末はお寺や神社を見学したり、川___釣りをしたりします。","particle":"で","explanation":"Частица «で» указывает место рыбной ловли («рыбачить на реке»).","back":"しゅうまつは おてらや じんじゃを けんがく したり、かわで つりを したり します。\nНа выходных я то осматриваю буддийские и синтоистские храмы, то рыбачу на реке.\n• お寺 (おてら) — буддийский храм\n• 神社 (じんじゃ) — синтоистский храм\n• 川 (かわ) — река\n• 釣りをする (つりをする) — рыбачить\nГрамматика: [место] で 釣りをする = рыбачить в [месте]."},
  {"front":"お祭りで相撲を見たり、みんなで美味しいお菓子を食べたりしました。","blanked":"お祭り___相撲を見たり、みんなで美味しいお菓子を食べたりしました。","particle":"で","explanation":"Частица «で» обозначает место/событие проведения («на фестивале»).","back":"おまつりで すもうを みたり、みんなで おいしい おかしを たべたり しました。\nНа фестивале мы то смотрели сумо, то вместе ели сладости.\n• お祭り (おまつり) — праздник / фестиваль\n• 相撲 (すもう) — сумо\n• お菓子 (おかし) — сладости\nГрамматика: [событие] で [действие] = совершать действие на мероприятии."},
  {"front":"一度もゴルフをしたことがありませんが、ぜひ練習したいです。","blanked":"一度___ゴルフをしたことがありませんが、ぜひ練習したいです。","particle":"も","explanation":"Частица «も» усиливает отрицание в связке 一度も (ни разу не...).","back":"いちども ゴルフを した ことが ありませんが、ぜひ れんしゅう したいです。\nЯ ни разу не играл в гольф, но непременно хочу потренироваться.\n• 一度も (いちども) — ни разу (с отриц.)\n• ゴルフ — гольф\n• ぜひ — непременно / обязательно\n• 練習する (れんしゅうする) — тренироваться\nГрамматика: 一度も [отрицание] = ни единого раза не..."},
  {"front":"朝早く起きてジョギングをすると、体がだんだん強くなります。","blanked":"朝早く起きてジョギングをすると、体___だんだん強くなります。","particle":"が","explanation":"Частица «が» оформляет субъект изменения состояния («тело крепнет»).","back":"あさ はやく おきて ジョギングを すると、からだが だんだん つよく なります。\nЕсли вставать рано утром и бегать трусцой, тело постепенно становится крепче.\n• 早く起きる (はやくおきる) — рано вставать\n• 体 (からだ) — тело\n• だんだん — постепенно\n• 強い (つよい) — сильный / крепкий\nГрамматика: [сущ.] が [прил.] + くなる = становиться каким-то."},
  {"front":"毎晩、日記を書いてから、神様にお祈りをします。","blanked":"毎晩、日記を書いてから、神様___お祈りをします。","particle":"に","explanation":"Частица адресата «に» («молиться Богу»).","back":"まいばん、にっきを かいてから、かみさまに おいのりを します。\nКаждый вечер, написав дневник, я молюсь Богу.\n• 日記 (にっき) — дневник\n• 神様 (かみさま) — Бог / божество\n• お祈り (おいのり) — молитва\nГрамматика: [адресат] に お祈りをする = молиться [кому-то]."},
  {"front":"古い切手を集めるのをやめて、ゴミを捨てました。","blanked":"古い切手を集める___をやめて、ゴミを捨てました。","particle":"の","explanation":"Частица-субстантиватор «の» опредмечивает глагол 集める («собирание»).","back":"ふるい きってを あつめるのを やめて、ゴミを すてました。\nЯ перестал собирать старые марки и выбросил мусор.\n• 切手 (きって) — почтовая марка\n• 集める (あつめる) — собирать\n• 捨てる (すてる) — выбрасывать\nГрамматика: [гл. словарная форма] + の を やめる = прекратить делать что-то."},
  {"front":"社長、部長、課長は会議室で経済の資料を調べています。","blanked":"社長、部長、課長は会議室___経済の資料を調べています。","particle":"で","explanation":"Частица места действия «で» («изучать в зале заседаний»).","back":"しゃちょう、ぶちょう、かちょうは かいぎしつで けいざいの しりょうを しらべています。\nПрезидент, директор департамента и начальник отдела изучают материалы по экономике в конференц-зале.\n• 社長 (しゃちょう) — президент компании\n• 会議室 (かいぎしつ) — конференц-зал\n• 経済 (けいざい) — экономика\n• 調べる (しらべる) — проверять / изучать\nГрамматика: [место] で [действие] = действие в месте."},
  {"front":"日本の物価は高くて不便だと思いますが、交通はとても安全です。","blanked":"日本の物価は高くて不便だ___思いますが、交通はとても安全です。","particle":"と","explanation":"Цитатная частица «と» перед глаголом 思う (думать/считать).","back":"にほんの ぶっかは たかくて ふべんだと おもいますが、こうつうは とても あんぜんです。\nЯ думаю, что цены в Японии высокие и это неудобно, но транспорт очень безопасный.\n• 物価 (ぶっか) — цены\n• 不便 (ふべん) — неудобно\n• 交通 (こうつう) — транспорт\n• 安全 (あんぜん) — безопасный\nГрамматика: [мысль/высказывание] と 思う = думать, что..."},
  {"front":"ニュースの放送によると、明日の試合で勝つチームは強いそうです。","blanked":"ニュースの放送___よると、明日の試合で勝つチームは強いそうです。","particle":"に","explanation":"Составная грамматическая конструкция 〜によると (согласно / судя по...).","back":"ニュースの ほうそうに よると、あしたの しあいで かつ チームは つよいそうです。\nСогласно выпуску новостей, команда, которая победит в завтрашнем матче, очень сильна.\n• 放送 (ほうそう) — трансляция / передача\n• 試合 (しあい) — матч / игра\n• 勝つ (かつ) — побеждать\nГрамматика: [источник] によると = согласно источнику."},
  {"front":"負けても心配しないで、次のチャンスのために準備しましょう。","blanked":"負けても心配しないで、次のチャンスの___に準備しましょう。","particle":"ため","explanation":"Конструкция ために указывает на цель/причину («ради следующего шанса»).","back":"まけても しんぱい しないで、つぎの チャンスの ために じゅんび しましょう。\nДаже если проиграем, не волнуйтесь: давайте готовиться к следующему шансу.\n• 負ける (まける) — проигрывать\n• 心配する (しんぱいする) — беспокоиться\n• チャンス — шанс\n• 準備する (じゅんびする) — готовиться\nГрамматика: [сущ.] の ために = ради / для [чего-то]."},
  {"front":"このロボットのデザインは本当にすごいし、仕事の役に立ちます。","blanked":"このロボットのデザインは本当にすごいし、仕事の役___立ちます。","particle":"に","explanation":"Устойчивое выражение 役に立つ (быть полезным / пригождаться) пишется с «に».","back":"この ロボットの デザインは ほんとうに すごいし、しごとの やくに たちます。\nДизайн этого робота действительно потрясающий, и он приносит пользу в работе.\n• ロボット — робот\n• 本当に (ほんとうに) — действительно\n• 役に立つ (やくにたつ) — быть полезным\nГрамматика: [сфера] の 役に立つ = быть полезным в [сфере]."},
  {"front":"田中さんは「アニメとマンガについての意見を話します」と言いました。","blanked":"田中さんは「アニメとマンガについての意見を話します」___言いました。","particle":"と","explanation":"Цитатная частица «と» оформляет прямую речь с глаголом 言う.","back":"たなかさんは 「アニメと マンガについての いけんを はなします」と いいました。\nТанака-сан сказал: «Я выскажу свое мнение об аниме и манге».\n• 意見 (いけん) — мнение\n• 〜について — о / касательно\n• 言う (いう) — говорить\nГрамматика: 「...」 と 言う = говорить «...»."},
  {"front":"もし１億円があったら、世界中を旅行して、広い家に住みたいです。","blanked":"もし１億円___あったら、世界中を旅行して、広い家に住みたいです。","particle":"が","explanation":"Частица «が» выделяет предмет обладания/наличия с ある.","back":"もし いちおくえんが あったら、せかいじゅうを りょこう して、ひろい いえに すみたいです。\nЕсли бы у меня было 100 миллионов иен, я бы хотел объехать весь мир и жить в просторном доме.\n• １億円 (いちおくえん) — 100 млн иен\n• 世界中 (せかいじゅう) — по всему миру\n• 広い (ひろい) — просторный\nГрамматика: [субъект] が ある = имеется / есть."},
  {"front":"壊れた自動車を自分で直して修理するのは無駄ではありません。","blanked":"壊れた自動車___自分で直して修理するのは無駄ではありません。","particle":"を","explanation":"Частица «を» указывает на объект ремонта (машину).","back":"こわれた じどうしゃを じぶんで なおして しゅうりするのは むだでは ありません。\nСамостоятельно чинить и ремонтировать сломанную машину — не напрасный труд.\n• 壊れた (こわれた) — сломанный\n• 自動車 (じどうしゃ) — автомобиль\n• 直す (なおす) — чинить\n• 修理する (しゅうりする) — ремонтировать\n• 無駄 (むだ) — напрасный / пустой\nГрамматика: [объект] を 直す = чинить [объект]."},
  {"front":"こっち、そっち、あっち、どっちの道が近いですか。どれも同じです。","blanked":"こっち、そっち、あっち、どっちの道___近いですか。どれも同じです。","particle":"が","explanation":"Частица «が» маркирует вопросительное слово при выборе из нескольких вариантов.","back":"こっち、そっち、あっち、どっちの みちが ちかいですか。どれも おなじです。\nКакая из дорог ближе? — Любая одинакова.\n• どっち — который из двух\n• 近い (ちかい) — близкий\n• どれも — любой / каждый\n• 同じ (おなじ) — одинаковый\nГрамматика: [вопрос] が [прилагательное] = фокус на вопросе выбора."},
  {"front":"どのケーキが一番甘いですか。このケーキです。","blanked":"どのケーキ___一番甘いですか。このケーキです。","particle":"が","explanation":"Частица «が» ставится после вопросительного слова в подлежащем.","back":"どの ケーキが いちばん あまいですか。この ケーキです。\nКоторый из тортов самый сладкий? — Вот этот торт.\n• どの — который из\n• 一番 (いちばん) — самый\n• 甘い (あまい) — сладкий\nГрамматика: どの [сущ.] が 一番... = который [предмет] самый..."},
  {"front":"おじいさんとおばあちゃんは年を取りましたが、とても元気です。","blanked":"おじいさん___おばあちゃんは年を取りましたが、とても元気です。","particle":"と","explanation":"Частица «と» соединяет дедушку и бабушку («дедушка И бабушка»).","back":"おじいさんと おばあちゃんは としを とりましたが、とても げんきです。\nДедушка и бабушка постарели, но они очень бодры.\n• おじいさん — дедушка\n• おばあちゃん — бабушка\n• 年を取る (としをとる) — стареть\n• 元気 (げんき) — бодрый\nГрамматика: [лицо] と [лицо] = лицо и лицо."},
  {"front":"おじいちゃんは私においしいお弁当とお菓子をくれました。","blanked":"おじいちゃんは私___おいしいお弁当とお菓子をくれました。","particle":"に","explanation":"Частица адресата «に» в сочетании с くれる («дал МНЕ»).","back":"おじいちゃんは わたしに おいしい おべんとうと おかしを くれました。\nДедуля дал мне вкусный бэнто и сладости.\n• お弁当 (おべんとう) — бэнто (ланч-бокс)\n• お菓子 (おかし) — сладости\n• くれる — давать мне\nГрамматика: [субъект] は 私に [объект] を くれる."},
  {"front":"引っ越しの時、友達が車で荷物を送って手伝ってくれました。","blanked":"引っ越しの時、友達が車___荷物を送って手伝ってくれました。","particle":"で","explanation":"Частица «で» указывает на средство перевозки («на машине»).","back":"ひっこしの とき、ともだちが くるまで にもつを おくって てつだって くれました。\nВо время переезда друг помог мне, подбросив вещи на машине.\n• 引っ越し (ひっこし) — переезд\n• 車 (くるま) — машина\n• 荷物 (にもつ) — багаж\n• 手伝う (てつだう) — помогать\nГрамматика: [транспорт] で = на [транспорте]."},

  {"front":"毎朝シャワーを浴びて、歯を磨きます。","blanked":"毎朝シャワー___浴びて、歯を磨きます。","particle":"を","explanation":"Устойчивое выражение シャワーを浴びる (принимать душ) пишется с «を».","back":"まいあさ シャワーを あびて、はを みがきます。\nКаждое утро я принимаю душ и чищу зубы.\n• 毎朝 (まいあさ) — каждое утро\n• シャワーを浴びる (あびる) — принимать душ\n• 歯を磨く (はをみがく) — чистить зубы\nГрамматика: シャワー を 浴びる = принимать душ."},
  {"front":"ボタンを押すと、ドルを円に換えることができます。","blanked":"ボタンを押すと、ドル___円に換えることができます。","particle":"を","explanation":"Частица «を» указывает на исходную обмениваемую валюту (доллары).","back":"ボタンを おすと、ドルを えんに かえる ことが できます。\nЕсли нажать кнопку, можно обменять доллары на иены.\n• ドル — доллар\n• 円 (えん) — иена\n• 換える (かえる) — менять / обменивать\nГрамматика: [А] を [Б] に 換える = менять валюту А на Б."},
  {"front":"若い時は山に登ったり、自分で服を洗濯したりしました。","blanked":"若い時は山___登ったり、自分で服を洗濯したりしました。","particle":"に","explanation":"С глаголом 登る (подниматься на гору) используется частица «に».","back":"わかい ときは やまに のぼったり、じぶんで ふくを せんたくしたり しました。\nВ молодости я взбирался на горы и сам стирал себе одежду.\n• 若い (わかい) — молодой\n• 山 (やま) — гора\n• 登る (のぼる) — взбираться\n• 洗濯する (せんたくする) — стирать\nГрамматика: 山 に 登る = подниматься на гору."},
  {"front":"ここで靴を脱がなくても大丈夫です。","blanked":"ここで靴___脱がなくても大丈夫です。","particle":"を","explanation":"Частица прямого дополнения «を» с глаголом 脱ぐ (снимать обувь).","back":"ここで くつを ぬがなくても だいじょうぶです。でも、きんえんですから タバコを すっては いけません。\nЗдесь можно не снимать обувь. Но здесь нельзя курить.\n• 靴 (くつ) — обувь\n• 脱ぐ (ぬぐ) — снимать (одежду/обувь)\n• 大丈夫 (だいじょうぶ) — в порядке / разрешено\nГрамматика: [обувь] を 脱ぐ = снимать обувь."},
  {"front":"明日までに宿題を持って来てください。","blanked":"明日___に宿題を持って来てください。","particle":"まで","explanation":"Составная частица «までに» указывает предельный срок (дедлайн).","back":"あしたまでに しゅくだいを もって きて ください。\nПринесите, пожалуйста, домашнее задание к завтрашнему дню.\n• 明日 (あした) — завтра\n• までに — к / до (срок)\n• 宿題 (しゅくだい) — домашнее задание\n• 持って来る (もってくる) — приносить\nГрамматика: [срок] までに = не позднее [срока]."},
  {"front":"来週大阪へ出張しますから、新幹線の切符を予約します。","blanked":"来週大阪___出張しますから、新幹線の切符を予約します。","particle":"へ","explanation":"Частица направления «へ» («в Осаку»).","back":"らいしゅう おおさかへ しゅっちょう しますから、しんかんせんの きっぷを よやくします。\nНа следующей неделе я уезжаю в командировку в Осаку, поэтому бронирую билеты.\n• 大阪 (おおさか) — Осака\n• 出張する (しゅっちょうする) — ехать в командировку\n• 切符 (きっぷ) — билет\n• 予約する (よやくする) — бронировать\nГрамматика: [место] へ 出張する = командировка в [место]."},
  {"front":"一度富士山に行きましたけど、最近は何回も京都へ行っています。","blanked":"一度富士山___行きましたけど、最近は何回も京都へ行っています。","particle":"に","explanation":"Частица пункта назначения «に» с глаголом движения 行く.","back":"いちど ふじさんに いきましたけど、さいきんは なんかいも きょうとへ いっています。もちろん もみじを みる ためです。\nЯ однажды ездил на Фудзи, но в последнее время много раз бывал в Киото.\n• 富士山 (ふじさん) — гора Фудзи\n• 最近 (さいきん) — в последнее время\n• 何回も (なんかいも) — много раз\nГрамматика: [место] に 行く = ехать в [место]."},
  {"front":"日本で色々な経験ができて、とても楽しかったです。","blanked":"日本で色々な経験___できて、とても楽しかったです。","particle":"が","explanation":"С глаголом потенциала できる (удаваться, мочь) объект маркируется частицей «が».","back":"にほんで いろいろな けいけんが できて、とても たのしかったです。\nЯ смог получить разнообразный опыт в Японии, и это было очень здорово.\n• 経験 (けいけん) — опыт\n• できる — получаться / удаваться\n• 楽しい (たのしい) — радостный\nГрамматика: [сущ.] が できる = удаваться сделать что-либо."}
];

// Добавляем уникальный ID каждому вопросу
const QUIZ_DATA = RAW_QUIZ_DATA.map((item, index) => ({ id: 'q_' + index, ...item }));

const MISTAKES_KEY = 'particleQuiz3_all109_mistakes';

function loadMistakes(){
  try{
    const raw = localStorage.getItem(MISTAKES_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveMistakes(ids){
  try{ localStorage.setItem(MISTAKES_KEY, JSON.stringify(ids)); }catch(e){}
}
let mistakeIds = loadMistakes();
function addMistake(id){
  if(!mistakeIds.includes(id)){
    mistakeIds.push(id);
    saveMistakes(mistakeIds);
  }
}
function removeMistake(id){
  const idx = mistakeIds.indexOf(id);
  if(idx !== -1){
    mistakeIds.splice(idx,1);
    saveMistakes(mistakeIds);
  }
}

const BLOCKS = [
  { id: 'b1', label: 'Блок 1\nは・が・を・の・も', particles: ['は','が','を','の','も'] },
  { id: 'b2', label: 'Блок 2\nに・で・へ・から・まで', particles: ['に','で','へ','から','まで'] },
  { id: 'b3', label: 'Блок 3\nと・や', particles: ['と','や'] },
  { id: 'b4', label: 'Блок 4\nВсе вместе (109)', particles: ['は','が','を','の','も','に','で','へ','から','まで','と','や','ら','帰','ご','ため'] },
  { id: 'b5', label: 'Блок 5\nОшибки', mistakes: true }
];
const ALL_PARTICLES = ['は','が','を','の','も','に','で','へ','から','まで','と','や'];

let currentBlock = BLOCKS[0];
let questions = [];
let qIndex = 0;
let score = 0;
let answered = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let cachedVoices = [];
function loadVoices(){
  cachedVoices = window.speechSynthesis.getVoices();
}
loadVoices();
if(typeof window.speechSynthesis.onvoiceschanged !== 'undefined'){
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.85;
    const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
    const kyoko = voices.find(v => v.name.toLowerCase().includes('kyoko'));
    if(kyoko){
      u.voice = kyoko;
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function buildOptions(item, blockParticles){
  const correct = item.particle;
  const pool = blockParticles.filter(p=>p!==correct);
  let distractors;
  if(pool.length >= 3){
    distractors = shuffle(pool).slice(0,3);
  } else {
    distractors = shuffle(pool);
    const extra = shuffle(ALL_PARTICLES.filter(p=>p!==correct && !distractors.includes(p)));
    while(distractors.length < 3 && extra.length){
      distractors.push(extra.pop());
    }
  }
  return shuffle([correct, ...distractors]);
}

function renderBlockTabs(){
  const container = document.getElementById('blocks');
  container.innerHTML = '';
  BLOCKS.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'block-btn' + (b.id===currentBlock.id ? ' active' : '') + (b.mistakes ? ' mistakes-btn' : '');
    let label = b.label;
    if(b.mistakes){ label = label + ' (' + mistakeIds.length + ')'; }
    btn.innerHTML = label.split('\n').join('<br>');
    btn.addEventListener('click', ()=>{
      currentBlock = b;
      startBlock();
    });
    container.appendChild(btn);
  });
}

function startBlock(){
  renderBlockTabs();
  let pool;
  if(currentBlock.mistakes){
    pool = QUIZ_DATA.filter(d => mistakeIds.includes(d.id));
  } else if (currentBlock.id === 'b4') {
    pool = QUIZ_DATA;
  } else {
    pool = QUIZ_DATA.filter(d => currentBlock.particles.includes(d.particle));
  }
  questions = shuffle(pool);
  qIndex = 0;
  score = 0;
  document.getElementById('qTotal').textContent = questions.length;
  document.getElementById('qScore').textContent = '0';
  renderQuestion();
}

function parseBack(raw) {
  if (!raw) return { kana: '', translation: '', vocab: [], grammar: '' };
  const lines = raw.split('\n');
  const kana = (lines[0] || '').trim();
  const translation = (lines[1] || '').trim();
  const rest = lines.slice(2).join('\n');
  
  let vocabText = rest;
  let grammarText = '';
  const gIdx = rest.indexOf('Грамматика');
  if (gIdx !== -1) {
    vocabText = rest.slice(0, gIdx);
    grammarText = rest.slice(gIdx).trim();
  }
  
  const vocab = vocabText
    .split('\n')
    .map(s => s.trim())
    .filter(s => s.length > 0);
    
  return { kana, translation, vocab, grammar: grammarText };
}

function renderExplanationHtml(item) {
  const parsed = parseBack(item.back);
  let html = '';
  if (parsed.kana) {
    html += '<div class="fb-kana">' + escapeHtml(parsed.kana) + '</div>';
  }
  if (parsed.translation) {
    html += '<div class="fb-translation">' + escapeHtml(parsed.translation) + '</div>';
  }
  if (parsed.vocab && parsed.vocab.length > 0) {
    html += '<div class="fb-vocab">' + parsed.vocab.map(escapeHtml).join('<br>') + '</div>';
  }
  if (parsed.grammar) {
    html += '<div class="fb-grammar">' + escapeHtml(parsed.grammar) + '</div>';
  }
  return html;
}

function renderQuestion(){
  answered = false;
  document.getElementById('qNum').textContent = Math.min(qIndex+1, questions.length || 1);
  document.getElementById('progressFill').style.width = (questions.length ? Math.round((qIndex)/questions.length*100) : 0) + '%';

  const area = document.getElementById('quizArea');

  if(questions.length === 0 && currentBlock.mistakes){
    area.innerHTML = '<div class="empty-mistakes">Пока нет ошибок 🎉<br>Проходите блоки 1–4, и сюда будут попадать вопросы, где вы ошиблись — для отдельной тренировки.</div>';
    document.getElementById('qTotal').textContent = 0;
    document.getElementById('qNum').textContent = 0;
    return;
  }

  if(qIndex >= questions.length){
    renderSummary();
    return;
  }

  const item = questions[qIndex];
  const blockParticles = currentBlock.mistakes ? ALL_PARTICLES : currentBlock.particles;
  const options = buildOptions(item, blockParticles);

  area.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'sentence-card';
  card.innerHTML = '<div class="sentence-jp">' + escapeHtml(item.blanked).replace('___', '<span class="blank">___</span>') + '</div>';
  area.appendChild(card);

  const optionsWrap = document.createElement('div');
  optionsWrap.className = 'options';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.addEventListener('click', ()=> onAnswer(opt, item, optionsWrap));
    optionsWrap.appendChild(btn);
  });
  area.appendChild(optionsWrap);

  const feedback = document.createElement('div');
  feedback.className = 'feedback-panel';
  feedback.id = 'feedbackPanel';
  area.appendChild(feedback);

  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.id = 'nextBtn';
  nextBtn.textContent = 'Дальше →';
  nextBtn.addEventListener('click', ()=>{
    qIndex++;
    renderQuestion();
  });
  area.appendChild(nextBtn);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function onAnswer(chosen, item, optionsWrap){
  if(answered) return;
  answered = true;

  const isCorrect = chosen === item.particle;
  if(isCorrect){
    score++;
    removeMistake(item.id);
  } else {
    addMistake(item.id);
  }
  document.getElementById('qScore').textContent = score;
  renderBlockTabs();

  Array.from(optionsWrap.children).forEach(btn=>{
    btn.classList.add('disabled');
    if(btn.textContent === item.particle) btn.classList.add('correct');
    else if(btn.textContent === chosen) btn.classList.add('wrong');
  });

  const feedback = document.getElementById('feedbackPanel');
  feedback.classList.add('show');

  feedback.innerHTML =
    '<div class="feedback-head">' +
      '<div class="feedback-title ' + (isCorrect ? 'ok' : 'bad') + '">' + (isCorrect ? 'Верно!' : 'Неверно') + ' Правильная частица — «' + item.particle + '»</div>' +
      '<button class="replay-btn" id="replayBtn" title="Прослушать ещё раз">🔊</button>' +
    '</div>' +
    (item.explanation ? '<div class="feedback-rule">' + escapeHtml(item.explanation) + '</div>' : '') +
    renderExplanationHtml(item);

  document.getElementById('replayBtn').addEventListener('click', ()=> speak(item.front));
  document.getElementById('nextBtn').classList.add('show');
  speak(item.front);
}

function renderSummary(){
  document.getElementById('progressFill').style.width = '100%';
  const area = document.getElementById('quizArea');
  const pct = questions.length ? Math.round(score/questions.length*100) : 0;
  area.innerHTML =
    '<div class="summary">' +
      '<h2>Блок пройден!</h2>' +
      '<p>Правильных ответов: ' + score + ' из ' + questions.length + ' (' + pct + '%)</p>' +
      '<button class="restart-btn" id="restartBtn">Пройти ещё раз</button>' +
    '</div>';
  document.getElementById('restartBtn').addEventListener('click', startBlock);
}

startBlock();
</script>
