<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Проверка доступа и Авто-раскрытие -->
  <script>
    const ALLOWED_USERS = [370567050, 669192721]; // Ваши Telegram ID

    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();

      const userId = tg.initDataUnsafe?.user?.id;

      if (!ALLOWED_USERS.includes(userId)) {
        document.addEventListener("DOMContentLoaded", () => {
          document.body.style.cssText = "display:flex; justify-content:center; align-items:center; height:100vh; flex-direction:column; font-family:sans-serif; background:#121212; color:#fff; margin:0; padding:20px; text-align:center;";
          document.body.innerHTML = `
            <h1 style="color: #ff4d4d; font-size: 22px; margin-bottom: 8px;">🚫 Доступ закрыт</h1>
            <p style="color: #aaa; font-size: 14px;">Приложение находится в закрытой разработке.</p>
          `;
        });
      } else {
        tg.expand();
        if (tg.requestFullscreen) tg.requestFullscreen();
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
      }
    }
  </script>
<style>
    :root {
      --bg: #f4f1ea;
      --card-bg: #ffffff;
      --text: #2c2c2a;
      --sub-text: #6b6a63;
      --kana: #858379;
      --border: #d3d1c7;
      --border-light: #e5e2d8;
      
      --accent: #d97757;
      --accent-hover: #c46445;
      --accent-soft: #faede8;
      
      --ink: #3c3489;
      --ink-soft: #eeecf6;
      
      --success-bg: #eaf5e1;
      --success-border: #8bc34a;
      --success-text: #2c5914;

      --star-color: #d97706;
      --star-bg: #fef3c7;
      --star-border: #fcd34d;

      --danger-bg: #fdeeee;
      --danger-border: #f4b6b6;
      --danger-text: #b83a3a;

      --shadow-sm: 0 2px 6px rgba(44, 44, 42, 0.04);
      --shadow-md: 0 4px 14px rgba(44, 44, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }

    #app {
      width: 100%;
      height: 100%;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      background-color: var(--bg);
      background-image: radial-gradient(rgba(44, 44, 42, 0.04) 1px, transparent 0);
      background-size: 16px 16px;
    }

    body.desktop-device #app {
      max-width: 100% !important;
      width: 100% !important;
    }

/* ШАПКА */
    .session-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      /* ИДЕАЛЬНЫЙ ОТСТУП ДЛЯ IPHONE ПОД DYNAMIC ISLAND */
      padding: calc(44px + env(safe-area-inset-top, 0px)) 16px 8px;
      flex-shrink: 0;
      width: 100%;
    }

    /* НА ANDROID ПРИНУДИТЕЛЬНО ОПУСКАЕМ НА 75px НИЖЕ ПЛАШКИ */
    body.is-android .session-header {
      padding: 75px 16px 8px !important;
    }

    body.desktop-device .session-header {
      padding: calc(48px + env(safe-area-inset-top, 0px)) 36px 12px;
      max-width: 100%;
    }

    .back-btn-pill {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      color: var(--sub-text);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      z-index: 10;
    }
    .back-btn-pill:active { background: var(--text); color: #fff; }

    body.desktop-device .back-btn-pill {
      font-size: 1.1rem;
      padding: 10px 22px;
      border-radius: 16px;
    }

    .session-progress-wrap {
      flex: 1;
      height: 6px;
      background: var(--border-light);
      border-radius: 10px;
      margin: 0 12px;
      overflow: hidden;
    }

    body.desktop-device .session-progress-wrap {
      height: 10px;
      margin: 0 24px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 10px;
      transition: width 0.25s ease;
    }

    .session-counter-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--sub-text);
      min-width: 45px;
      text-align: right;
    }

    body.desktop-device .session-counter-text {
      font-size: 1.2rem;
      min-width: 65px;
    }

    .view {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      animation: fadeIn 0.18s ease-out;
    }
    .view.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.99); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ==========================================================================
       ЭКРАН 1: КАРТА (ИСПРАВЛЕНА ПРОКРУТКА + РАЗДЕЛЬНЫЕ ОТСТУПЫ)
       ========================================================================== */
    #viewMap {
      flex: 1 1 auto !important;
      height: 100% !important;
      min-height: 0 !important;
      overflow-y: scroll !important;
      overflow-x: hidden !important;
      -webkit-overflow-scrolling: touch;
      padding: calc(44px + env(safe-area-inset-top, 0px)) 12px calc(60px + env(safe-area-inset-bottom, 0px));
      position: relative;
    }

    body.is-android #viewMap {
      padding: 75px 12px calc(60px + env(safe-area-inset-bottom, 0px)) !important;
    }

    body.desktop-device #viewMap {
      padding: calc(52px + env(safe-area-inset-top, 0px)) 24px 80px;
    }
    .snake-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      padding: 10px 0 80px;
      position: relative;
      min-height: 100%;
    }

    body.desktop-device .snake-container {
      gap: 38px;
      padding: 20px 0 100px;
    }

    #snakeSvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .level-node-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 2;
    }

    .level-node {
      width: 74px;
      height: 74px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: transform 0.12s ease;
      position: relative;
    }
    .level-node:active { transform: scale(0.92); }

    body.desktop-device .level-node {
      width: 96px;
      height: 96px;
      border-radius: 30px;
      border-width: 2px;
    }

    .level-node.review-node {
      background: var(--star-bg);
      border-color: var(--star-border);
      color: var(--star-color);
      width: 78px;
      height: 78px;
      border-radius: 26px;
    }
    body.desktop-device .level-node.review-node {
      width: 104px;
      height: 104px;
      border-radius: 32px;
    }

    .level-node.active-unlocked {
      background: var(--success-bg);
      border: 2px solid var(--success-border);
      color: var(--success-text);
      box-shadow: 0 6px 20px rgba(139, 195, 74, 0.28);
      transform: scale(1.06);
    }
    .level-node.active-unlocked:active { transform: scale(0.95); }
    .level-node.active-unlocked .node-num { color: var(--success-text); }

    .level-node.locked {
      background: var(--danger-bg);
      border: 1.5px solid var(--danger-border);
      color: var(--danger-text);
      cursor: not-allowed;
      opacity: 0.9;
      box-shadow: none;
    }
    .level-node.locked .node-num {
      color: var(--danger-text);
      opacity: 0.85;
    }
    .level-node.locked::after {
      content: '🔒';
      font-size: 11px;
      position: absolute;
      top: 5px;
      right: 6px;
      opacity: 0.6;
    }
    body.desktop-device .level-node.locked::after {
      font-size: 14px;
      top: 8px;
      right: 8px;
    }

    .node-num {
      font-size: 1.3rem;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
    }
    body.desktop-device .node-num { font-size: 1.7rem; }

    .node-progress {
      font-size: 0.68rem;
      font-weight: 800;
      margin-top: 3px;
      padding: 1px 7px;
      border-radius: 8px;
      background: #ffffff;
    }
    body.desktop-device .node-progress {
      font-size: 0.85rem;
      padding: 2px 10px;
      border-radius: 10px;
      margin-top: 5px;
    }

    .active-unlocked .node-progress {
      color: var(--success-text);
      border: 1px solid var(--success-border);
    }
    .review-node .node-progress {
      color: var(--star-color);
      background: rgba(255, 255, 255, 0.8);
    }

    .pos-0 { transform: translateX(0); }
    .pos-1 { transform: translateX(50px); }
    .pos-2 { transform: translateX(0); }
    .pos-3 { transform: translateX(-50px); }

    body.desktop-device .pos-1 { transform: translateX(180px); }
    body.desktop-device .pos-3 { transform: translateX(-180px); }

    /* ==========================================================================
       ЭКРАН 2: ANKI (ЛИЦЕВАЯ СТОРОНА ГИГАНТСКАЯ, ПЕРЕВОД АККУРАТНЫЙ)
       ========================================================================== */
    #viewAnki {
      padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
      justify-content: space-between;
      width: 100%;
      height: 100%;
    }

    body.desktop-device #viewAnki {
      padding: 0 40px calc(24px + env(safe-area-inset-bottom, 0px));
      max-width: 100% !important;
      margin: 0 auto;
    }

    .anki-toggle-mode {
      display: flex;
      background: #e7e3da;
      padding: 3px;
      border-radius: 14px;
      margin: 0 auto 8px;
      width: 120px;
      gap: 3px;
      flex-shrink: 0;
    }

    body.desktop-device .anki-toggle-mode {
      width: 160px;
      padding: 5px;
      border-radius: 18px;
      margin-bottom: 12px;
    }

    .anki-toggle-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 5px 0;
      font-size: 1rem;
      border-radius: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .anki-toggle-btn.active {
      background: var(--card-bg);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }
    body.desktop-device .anki-toggle-btn {
      padding: 8px 0;
      font-size: 1.3rem;
    }

    .presentation-card-anki {
      flex: 1;
      min-height: 0;
      width: 100%;
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 26px;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow-md);
      position: relative;
      margin-bottom: 14px;
    }

    body.desktop-device .presentation-card-anki {
      border-radius: 36px;
      padding: 30px 40px;
      margin-bottom: 20px;
    }

    .card-badge {
      position: absolute;
      top: 14px;
      right: 16px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 10px;
      background: var(--bg);
      color: var(--sub-text);
      border: 1px solid var(--border-light);
    }

    body.desktop-device .card-badge {
      top: 20px;
      right: 24px;
      font-size: 1.05rem;
      padding: 6px 16px;
      border-radius: 14px;
    }

    /* ЛИЦЕВАЯ СТОРОНА КАРТОЧКИ (ВОПРОС) ВСЕГДА КРУПНЫЙ */
    .card-question {
      font-weight: 700;
      color: var(--text);
      line-height: 1.1;
      margin: auto 0;
      width: 100%;
      word-break: break-word;
      overflow-wrap: break-word;
      transition: font-size 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ОБОРОТНАЯ СТОРОНА (ОТВЕТ) — АККУРАТНЫЙ И КОМПАКТНЫЙ РАЗМЕР */
    .card-answer-block {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-light);
      width: 100%;
      position: relative;
    }
    .card-answer-block.revealed { display: flex; }

    body.desktop-device .card-answer-block {
      margin-top: 16px;
      padding-top: 16px;
    }

    .card-reading-row {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      min-height: 38px;
    }

    .card-reading {
      font-size: clamp(1.3rem, 4vw, 1.8rem);
      color: var(--kana);
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
      padding: 0 40px;
    }

    body.desktop-device .card-reading {
      font-size: 2.2rem;
      padding: 0 60px;
    }

    .action-circle-voice-btn {
      position: absolute;
      right: 8px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }
    .action-circle-voice-btn:active {
      transform: scale(0.92);
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    body.desktop-device .action-circle-voice-btn {
      right: 20px;
      width: 50px;
      height: 50px;
      font-size: 1.35rem;
    }

    .card-translation {
      font-size: clamp(1.1rem, 3.2vw, 1.45rem);
      font-weight: 750;
      color: var(--ink);
    }

    body.desktop-device .card-translation {
      font-size: 1.9rem;
      margin-top: 4px;
    }

    .anki-actions-bottom {
      flex-shrink: 0;
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .btn-show-answer {
      width: 100%;
      height: 54px;
      border-radius: 16px;
      background: var(--accent);
      color: #fff;
      font-size: 1.05rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(217, 119, 87, 0.25);
      transition: all 0.15s ease;
    }
    .btn-show-answer:active { transform: scale(0.97); }

    body.desktop-device .btn-show-answer {
      height: 70px;
      font-size: 1.35rem;
      border-radius: 22px;
    }

    .anki-grade-group {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    body.desktop-device .anki-grade-group {
      gap: 16px;
    }

    .btn-grade {
      height: 54px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0 4px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.1s ease;
    }
    .btn-grade:active { transform: scale(0.94); }
    .btn-grade .grade-label {
      font-size: 0.95rem;
      font-weight: 800;
    }

    body.desktop-device .btn-grade {
      height: 70px;
      border-radius: 22px;
    }
    body.desktop-device .btn-grade .grade-label {
      font-size: 1.25rem;
    }

    .btn-grade.again { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }
    .btn-grade.hard  { background: var(--star-bg); border-color: var(--star-border); color: var(--star-color); }
    .btn-grade.good  { background: var(--success-bg); border-color: var(--success-border); color: var(--success-text); }
    .btn-grade.easy  { background: var(--ink-soft); border-color: #c9c3e6; color: var(--ink); }

    /* ==========================================================================
       ЭКРАН 3: СТОПКА (КАНДЗИ ОГРОМНЫЕ, РУССКИЙ АККУРАТНЫЙ)
       ========================================================================== */
    #viewStack {
      padding: 0 12px calc(14px + env(safe-area-inset-bottom, 0px));
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    body.desktop-device #viewStack {
      padding: 0 36px calc(24px + env(safe-area-inset-bottom, 0px));
      max-width: 100% !important;
    }

    .stack-sub-hint {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--sub-text);
      text-align: center;
      margin: 2px 0 10px;
      flex-shrink: 0;
    }

    body.desktop-device .stack-sub-hint {
      font-size: 1.15rem;
      margin-bottom: 14px;
    }

    .stack-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 8px;
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
    }

    body.desktop-device .stack-grid {
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 16px;
    }

    .stack-tile {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      height: 100% !important;
      width: 100% !important;
      min-height: 0;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .stack-tile:active { transform: scale(0.94); }

    body.desktop-device .stack-tile {
      border-radius: 24px;
      border-width: 2px;
      padding: 16px;
    }

    .stack-tile.selected {
      background: var(--ink-soft);
      border-color: var(--ink);
      color: var(--ink);
      box-shadow: 0 0 0 2px rgba(60, 52, 137, 0.25);
    }

    .stack-tile.empty-slot {
      visibility: hidden;
      pointer-events: none;
    }

    .stack-tile.merge-pulse {
      animation: pulseGreen 0.28s ease;
    }
    @keyframes pulseGreen {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); background: var(--success-bg); border-color: var(--success-border); }
    }

    .stack-tile.completed-burst {
      animation: burstOut 0.3s forwards;
    }
    @keyframes burstOut {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); background: var(--success-bg); }
      100% { transform: scale(0.2); opacity: 0; }
    }

    .stack-tile.error {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
      animation: shake 0.3s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    .tile-counter-badge {
      position: absolute;
      top: 4px;
      right: 5px;
      font-size: 0.62rem;
      font-weight: 800;
      background: var(--bg);
      border: 1px solid var(--border-light);
      color: var(--sub-text);
      padding: 1px 5px;
      border-radius: 6px;
    }

    body.desktop-device .tile-counter-badge {
      top: 10px;
      right: 12px;
      font-size: 0.95rem;
      padding: 4px 10px;
      border-radius: 10px;
    }

   /* ==========================================================================
       СТИЛИ ТЕКСТА КАРТОЧЕК В СТОПКЕ (СТАБИЛЬНЫЕ И КРУПНЫЕ)
       ========================================================================== */
    .tile-main-text {
      font-weight: 850;
      line-height: 1.15;
      color: var(--text);
      word-break: break-word;
      overflow-wrap: break-word;
      hyphens: auto;
      padding: 0 6px;
      width: 100%;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

/* ЕЩЕ БОЛЕЕ МОЩНЫЕ И КРУПНЫЕ КАНДЗИ */
    .tile-main-text.type-kanji {
      font-size: clamp(2.4rem, 9.5vw, 3.2rem) !important;
      font-weight: 700;
      letter-spacing: -1.5px;
    }
    body.desktop-device .tile-main-text.type-kanji {
      font-size: 5.4rem !important;
      letter-spacing: -2px;
    }

    /* 2. ХИРАГАНА / КАНА (КРУПНАЯ, ЧЕТКАЯ, РАВНОМЕРНАЯ) */
    .tile-main-text.type-reading {
      font-size: clamp(1.6rem, 6.8vw, 2.2rem);
      letter-spacing: -0.5px;
    }
    body.desktop-device .tile-main-text.type-reading {
      font-size: 3.8rem;
    }

 /* 2. УВЕЛИЧЕННЫЙ РУССКИЙ ПЕРЕВОД */
    .tile-main-text.type-translation {
      font-weight: 800;
      line-height: 1.18;

    // --- ОБЛАЧНОЕ СОХРАНЕНИЕ ---
    const TG_KEYS = ['tg_p1', 'tg_p2', 'tg_p3'];

    function packChunk(minId, maxId) {
      const list = [];
      for (let id = minId; id <= maxId; id++) {
        const p = userProgress[id];
        if (p) {
          const s = p.stacked ? 1 : 0;
          const a = p.ankiMastered ? 1 : 0;
          const r = p.reps || 0;
          const i = p.interval || 0;
          if (s || a || r || i) {
            list.push(`${id}:${r}:${i}:${s}:${a}`);
          }
        }
      }
      return list.join(';');
    }

    function unpackChunk(rawStr) {
      if (!rawStr || typeof rawStr !== 'string') return;
      const items = rawStr.split(';');
      items.forEach(item => {
        if (!item) return;
        const [id, r, i, s, a] = item.split(':').map(Number);
        if (id) {
          if (!userProgress[id]) {
            userProgress[id] = { reps: 0, interval: 0, easeFactor: 2.5, dueDate: 0, lapses: 0, stacked: false };
          }
          userProgress[id].reps = Math.max(userProgress[id].reps || 0, r || 0);
          userProgress[id].interval = Math.max(userProgress[id].interval || 0, i || 0);
          if (s === 1) userProgress[id].stacked = true;
          if (a === 1) userProgress[id].ankiMastered = true;
        }
      });
    }

    function saveState() {
      try {
        localStorage.setItem('japandi_backup_data', JSON.stringify(userProgress));
      } catch(e) {}

      if (window.Telegram?.WebApp?.CloudStorage) {
        const p1 = packChunk(1, 300);
        const p2 = packChunk(301, 600);
        const p3 = packChunk(601, 830);

        if (p1) window.Telegram.WebApp.CloudStorage.setItem('tg_p1', p1);
        if (p2) window.Telegram.WebApp.CloudStorage.setItem('tg_p2', p2);
        if (p3) window.Telegram.WebApp.CloudStorage.setItem('tg_p3', p3);
      }
    }

   function loadState(callback) {
      try {
        const local = localStorage.getItem('japandi_backup_data');
        if (local) userProgress = JSON.parse(local);
      } catch(e) {
        userProgress = {};
      }

      // 1. СРАЗУ рисуем экран, чтобы не было белого/пустого экрана
      renderMap();
      if (callback) callback();

      // 2. В фоновом режиме подтягиваем данные из облака Telegram
      if (window.Telegram?.WebApp?.CloudStorage) {
        window.Telegram.WebApp.CloudStorage.getItems(TG_KEYS, (err, res) => {
          if (!err && res) {
            if (res.tg_p1) unpackChunk(res.tg_p1);
            if (res.tg_p2) unpackChunk(res.tg_p2);
            if (res.tg_p3) unpackChunk(res.tg_p3);
            
            try {
              localStorage.setItem('japandi_backup_data', JSON.stringify(userProgress));
            } catch(e) {}
            // Обновляем экран, если из облака пришли свежие данные
            renderMap();
          }
        });
      }
    }

    function getWordData(wordId) {
      if (!userProgress[wordId]) {
        userProgress[wordId] = {
          reps: 0, interval: 0, easeFactor: 2.5, dueDate: 0, lapses: 0, stacked: false
        };
      }
      return userProgress[wordId];
    }
    
    function isWordMastered(wId) {
      const p = userProgress[wId];
      if (!p) return false;
      const ankiDone = Boolean(p.ankiMastered || (p.reps && p.reps >= 1) || (p.interval && p.interval >= 1));
      const stackDone = Boolean(p.stacked);
      return ankiDone || stackDone;
    }

    function getLevelWords(lvl) {
      return allWords.filter(w => w.level_id === lvl);
    }

    function getLevelMasteredCount(lvl) {
      return getLevelWords(lvl).filter(w => isWordMastered(w.id)).length;
    }

    function getCurrentUnlockedLevel() {
      for (let lvl = 1; lvl <= TOTAL_LEVELS; lvl++) {
        if (getLevelMasteredCount(lvl) < 20) return lvl;
      }
      return TOTAL_LEVELS;
    }

   // =========================================================================
    // --- ПЛЕЕР С МГНОВЕННОЙ ПРЕДЗАГРУЗКОЙ (0ms РЕАКЦИЯ НА КЛИК) ---
    // =========================================================================
    const activeAudio = new Audio();
    activeAudio.preload = 'auto';

    // Функция мгновенного воспроизведения
    function speakKyoko(wordId) {
      if (!wordId) return;

      try {
        const expectedSrc = `audio/${wordId}.mp3`;

        // Если файл УЖЕ предзагружен в память — просто запускаем с 0 секунды
        if (activeAudio.src.includes(expectedSrc)) {
          activeAudio.currentTime = 0;
          activeAudio.play().catch(() => {});
          return;
        }

        // Если не был предзагружен (например, при клике в стопке) — загружаем и играем
        activeAudio.src = expectedSrc;
        activeAudio.currentTime = 0;
        activeAudio.play().catch(() => {});
      } catch (e) {
        console.error('Audio error:', e);
      }
    }

    // Предзагрузка аудиофайла в память заранее
    function preloadCurrentAudio(wordId) {
      if (!wordId) return;
      activeAudio.src = `audio/${wordId}.mp3`;
      activeAudio.load(); // Телефон сразу скачивает файл в оперативку
    }
    // --- РЕНДЕР КАРТЫ ---
    function renderMap() {
      const tree = document.getElementById('snakeTree');
      tree.innerHTML = '<svg id="snakeSvg"></svg>';

      const currentLvl = getCurrentUnlockedLevel();

      if (currentLvl > 1) {
        const masteredTotal = allWords.filter(w => isWordMastered(w.id)).length;
        const wrapRev = document.createElement('div');
        wrapRev.className = `level-node-wrapper pos-0`;
        wrapRev.innerHTML = `
          <div class="level-node review-node" onclick="openReviewMenu()">
            <span style="font-size: 11px; font-weight: 800; margin-top:2px;">Повтор</span>
            <span class="node-progress">${masteredTotal}</span>
          </div>
        `;
        tree.appendChild(wrapRev);
      }

      const currentDone = getLevelMasteredCount(currentLvl);
      const wrapCur = document.createElement('div');
      wrapCur.className = `level-node-wrapper pos-${(currentLvl - 1) % 4}`;
      wrapCur.innerHTML = `
        <div class="level-node active-unlocked" onclick="openLevelModal(${currentLvl})">
          <span class="node-num">${currentLvl}</span>
          <span class="node-progress">${currentDone}</span>
        </div>
      `;
      tree.appendChild(wrapCur);

      for (let lvl = currentLvl + 1; lvl <= TOTAL_LEVELS; lvl++) {
        const wrapLock = document.createElement('div');
        wrapLock.className = `level-node-wrapper pos-${(lvl - 1) % 4}`;
        wrapLock.innerHTML = `
          <div class="level-node locked">
            <span class="node-num">${lvl}</span>
          </div>
        `;
        tree.appendChild(wrapLock);
      }

      requestAnimationFrame(() => {
        drawSnakePath();
      });
    }

    function drawSnakePath() {
      const svg = document.getElementById('snakeSvg');
      if (!svg) return;
      const nodes = document.querySelectorAll('.snake-container .level-node');
      if (nodes.length < 2) return;

      const container = document.getElementById('snakeTree');
      const cRect = container.getBoundingClientRect();

      let pathD = '';
      const points = [];

      nodes.forEach(node => {
        const r = node.getBoundingClientRect();
        const x = r.left + r.width / 2 - cRect.left;
        const y = r.top + r.height / 2 - cRect.top;
        points.push({ x, y });
      });

      for (let i = 0; i < points.length; i++) {
        if (i === 0) {
          pathD += `M ${points[i].x} ${points[i].y}`;
        } else {
          const p0 = points[i - 1];
          const p1 = points[i];
          const cy = (p0.y + p1.y) / 2;
          pathD += ` C ${p0.x} ${cy}, ${p1.x} ${cy}, ${p1.x} ${p1.y}`;
        }
      }

      svg.innerHTML = `
        <path d="${pathD}" fill="none" stroke="var(--border)" stroke-width="3" stroke-dasharray="6,6" opacity="0.8" />
      `;
    }

    let activeLevel = 1;
    let isReviewMode = false;

    function openLevelModal(lvl) {
      activeLevel = lvl;
      isReviewMode = false;
      document.getElementById('modalTitle').innerText = `Уровень ${lvl}`;
      document.getElementById('modeModal').classList.add('open');
    }

    function openReviewMenu() {
      activeLevel = 1;
      isReviewMode = true;
      document.getElementById('modalTitle').innerText = `Повторение`;
      document.getElementById('modeModal').classList.add('open');
    }

    function closeModal(e) {
      if (e.target.id === 'modeModal') {
        document.getElementById('modeModal').classList.remove('open');
      }
    }

    function switchView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function showMap() {
      switchView('viewMap');
      renderMap();
    }

    function launchMode(mode) {
      document.getElementById('modeModal').classList.remove('open');
      
      let pool = [];
      if (isReviewMode) {
        pool = allWords.filter(w => isWordMastered(w.id));
      } else {
        const unlearned = getLevelWords(activeLevel).filter(w => !isWordMastered(w.id));
        pool = unlearned.length > 0 ? unlearned : getLevelWords(activeLevel);
      }

      if (pool.length === 0) {
        alert('Пока нет слов для тренировки!');
        return;
      }

      if (mode === 'anki') startAnki(pool);
      else startStackGame(pool);
    }

    // =========================================================================
    // --- 2. ANKI (УВЕЛИЧЕННЫЙ В 3 РАЗА ШРИФТ + АВТО-МАСШТАБ) ---
    // =========================================================================
    const ANKI_CONFIG = {
      learningSteps: [1, 10],
      graduatingInterval: 1,
      easyInterval: 4,
      startingEase: 2.50,
      minEase: 1.30,
      easyBonus: 1.30,
      hardIntervalFactor: 1.20
    };

    const CARD_STATE = { NEW: 0, LEARNING: 1, REVIEW: 2, RELEARNING: 3 };

    let ankiQueue = [];
    let currentAnkiCard = null;
    let ankiMode = 'ja';
    let ankiTotalBatchSize = 0;
    let ankiGraduatedIds = new Set();

    function setAnkiMode(m) {
      ankiMode = m;
      document.getElementById('btnModeJa').classList.toggle('active', m === 'ja');
      document.getElementById('btnModeRu').classList.toggle('active', m === 'ru');
      if (currentAnkiCard) renderAnkiCard();
    }

    function initCardSRS(wId) {
      const card = getWordData(wId);
      if (card.state === undefined) {
        card.state = card.stacked ? CARD_STATE.REVIEW : CARD_STATE.NEW;
        card.step = 0;
        card.easeFactor = card.easeFactor || ANKI_CONFIG.startingEase;
        card.interval = card.interval || 0;
        card.reps = card.reps || 0;
        card.lapses = card.lapses || 0;
      }
      return card;
    }

    function startAnki(words) {
      ankiGraduatedIds.clear();
      ankiTotalBatchSize = words.length;
      const now = Date.now();

      words.forEach(w => {
        const srs = initCardSRS(w.id);
        if (srs.state === CARD_STATE.REVIEW && srs.interval >= 1) {
          ankiGraduatedIds.add(w.id);
        }
      });

      if (isReviewMode) {
        ankiQueue = [...words].sort((a, b) => {
          const srsA = initCardSRS(a.id);
          const srsB = initCardSRS(b.id);
          return (srsA.interval || 0) - (srsB.interval || 0);
        });
      } else {
        ankiQueue = [...words].sort(() => Math.random() - 0.5);
      }

      switchView('viewAnki');
      nextAnkiCard();
    }

    function nextAnkiCard() {
      if (ankiQueue.length === 0) {
        saveState();
        setTimeout(() => {
          alert('🎉 Сессия Anki успешно завершена!');
          showMap();
        }, 200);
        return;
      }

      currentAnkiCard = ankiQueue.shift();
      renderAnkiCard();
    }

    function renderAnkiCard() {
  const w = currentAnkiCard;
  const srs = initCardSRS(w.id);

  document.getElementById('ankiAnswerBlock').classList.remove('revealed');
  document.getElementById('btnShowAnswer').style.display = 'block';
  document.getElementById('ankiGradeGroup').style.display = 'none';

  const badge = document.getElementById('ankiCardBadge');
  if (srs.state === CARD_STATE.NEW) {
    badge.innerText = 'Новое';
    badge.style.background = 'var(--success-bg)';
    badge.style.color = 'var(--success-text)';
  } else if (srs.state === CARD_STATE.LEARNING) {
    badge.innerText = `Шаг ${srs.step + 1}/${ANKI_CONFIG.learningSteps.length}`;
    badge.style.background = 'var(--star-bg)';
    badge.style.color = 'var(--star-color)';
  } else if (srs.state === CARD_STATE.RELEARNING) {
    badge.innerText = 'Повтор';
    badge.style.background = 'var(--danger-bg)';
    badge.style.color = 'var(--danger-text)';
  } else {
    badge.innerText = `Интервал: ${srs.interval}д`;
    badge.style.background = 'var(--ink-soft)';
    badge.style.color = 'var(--ink)';
  }

  const qEl = document.getElementById('ankiQuestion');
  let qText = '';

  if (ankiMode === 'ja') {
    qText = w.kanji !== '—' ? w.kanji : w.reading;
    document.getElementById('ankiReading').innerText = (w.kanji !== '—' ? w.reading : '');
    document.getElementById('ankiTranslation').innerText = w.translation;
  } else {
    qText = w.translation;
    document.getElementById('ankiReading').innerText = (w.kanji !== '—' ? `${w.kanji} (${w.reading})` : w.reading);
    document.getElementById('ankiTranslation').innerText = '';
  }

  qEl.innerText = qText;

  // Динамический расчет шрифта
  const len = qText.length;
  if (len <= 2) {
    qEl.style.fontSize = 'clamp(4.8rem, 20vw, 7.5rem)';
  } else if (len <= 4) {
    qEl.style.fontSize = 'clamp(3.6rem, 14vw, 5.4rem)';
  } else if (len <= 7) {
    qEl.style.fontSize = 'clamp(2.6rem, 10vw, 4.0rem)';
  } else if (len <= 11) {
    qEl.style.fontSize = 'clamp(2.0rem, 7.5vw, 3.0rem)';
  } else {
    qEl.style.fontSize = 'clamp(1.5rem, 5.5vw, 2.2rem)';
  }

  const graduatedCount = ankiGraduatedIds.size;
  const pct = ankiTotalBatchSize > 0 ? (graduatedCount / ankiTotalBatchSize) * 100 : 0;
  document.getElementById('ankiProgress').style.width = `${pct}%`;
  document.getElementById('ankiCounter').innerText = `${graduatedCount}/${ankiTotalBatchSize}`;

  // Мгновенное автовоспроизведение звука при показе карточки
  speakCurrentWord();
}

      // ДИНАМИЧЕСКИЙ РАСЧЕТ ШРИФТА (В 3 РАЗА БОЛЬШЕ ДЛЯ КОРОТКИХ СЛОВ)
      const len = qText.length;
      if (len <= 2) {
        qEl.style.fontSize = 'clamp(4.8rem, 20vw, 7.5rem)';
      } else if (len <= 4) {
        qEl.style.fontSize = 'clamp(3.6rem, 14vw, 5.4rem)';
      } else if (len <= 7) {
        qEl.style.fontSize = 'clamp(2.6rem, 10vw, 4.0rem)';
      } else if (len <= 11) {
        qEl.style.fontSize = 'clamp(2.0rem, 7.5vw, 3.0rem)';
      } else {
        qEl.style.fontSize = 'clamp(1.5rem, 5.5vw, 2.2rem)';
      }

      const graduatedCount = ankiGraduatedIds.size;
      const pct = ankiTotalBatchSize > 0 ? (graduatedCount / ankiTotalBatchSize) * 100 : 0;
      document.getElementById('ankiProgress').style.width = `${pct}%`;
      document.getElementById('ankiCounter').innerText = `${graduatedCount}/${ankiTotalBatchSize}`;
    }

function revealAnkiAnswer() {
  document.getElementById('ankiAnswerBlock').classList.add('revealed');
  document.getElementById('btnShowAnswer').style.display = 'none';
  document.getElementById('ankiGradeGroup').style.display = 'grid';
  speakCurrentWord();
}

  function speakCurrentWord() {
      if (currentAnkiCard) speakKyoko(currentAnkiCard.id);
    }

    function handleAnkiGrade(grade) {
      const w = currentAnkiCard;
      const srs = initCardSRS(w.id);
      const now = Date.now();

      srs.reps = (srs.reps || 0) + 1;

      if (grade === 1) {
        srs.lapses = (srs.lapses || 0) + 1;
        srs.easeFactor = Math.max(ANKI_CONFIG.minEase, srs.easeFactor - 0.20);
        srs.state = CARD_STATE.LEARNING;
        srs.step = 0;
        srs.interval = 0;
        srs.dueDate = now;
        ankiGraduatedIds.delete(w.id);

        const pos = Math.min(ankiQueue.length, 1 + Math.floor(Math.random() * 2));
        ankiQueue.splice(pos, 0, w);
      } else if (grade === 2) {
        srs.easeFactor = Math.max(ANKI_CONFIG.minEase, srs.easeFactor - 0.15);
        if (srs.state === CARD_STATE.REVIEW) {
          srs.interval = Math.max(1, Math.round(srs.interval * ANKI_CONFIG.hardIntervalFactor));
          srs.dueDate = now + (srs.interval * 86400000);
          srs.ankiMastered = true;
          ankiGraduatedIds.add(w.id);
        } else {
          const pos = Math.min(ankiQueue.length, 3 + Math.floor(Math.random() * 2));
          ankiQueue.splice(pos, 0, w);
        }
      } else if (grade === 3) {
        if (srs.state === CARD_STATE.REVIEW) {
          srs.interval = Math.max(srs.interval + 1, Math.round(srs.interval * srs.easeFactor));
          srs.dueDate = now + (srs.interval * 86400000);
          srs.ankiMastered = true;
          ankiGraduatedIds.add(w.id);
        } else {
          const nextStep = (srs.step || 0) + 1;
          if (nextStep >= ANKI_CONFIG.learningSteps.length) {
            srs.state = CARD_STATE.REVIEW;
            srs.step = 0;
            srs.interval = ANKI_CONFIG.graduatingInterval;
            srs.dueDate = now + (srs.interval * 86400000);
            srs.ankiMastered = true;
            ankiGraduatedIds.add(w.id);
          } else {
            srs.state = CARD_STATE.LEARNING;
            srs.step = nextStep;
            const pos = Math.min(ankiQueue.length, 5 + Math.floor(Math.random() * 2));
            ankiQueue.splice(pos, 0, w);
          }
        }
      } else if (grade === 4) {
        srs.easeFactor = srs.easeFactor + 0.15;
        if (srs.state === CARD_STATE.REVIEW) {
          srs.interval = Math.max(srs.interval + 2, Math.round(srs.interval * srs.easeFactor * ANKI_CONFIG.easyBonus));
        } else {
          srs.interval = ANKI_CONFIG.easyInterval;
        }
        srs.state = CARD_STATE.REVIEW;
        srs.step = 0;
        srs.dueDate = now + (srs.interval * 86400000);
        srs.ankiMastered = true;
        ankiGraduatedIds.add(w.id);
      }

      saveState();
      nextAnkiCard();
    }

    /// =========================================================================
    // --- 3. ИГРА «СТОПКА» (ИСПРАВЛЕНА СБОРКА + КРУПНЫЕ КАНДЗИ) ---
    // =========================================================================
    let stackWaves = [];
    let currentWaveIndex = 0;
    let boardSlots = new Array(12).fill(null);
    let selectedSlotIdx = null;
    let stackTotalWords = 0;
    let stackDoneWords = 0;

    function getWordComponents(word) {
      const list = [];
      if (word.kanji && word.kanji !== '—') {
        list.push({ wordId: word.id, type: 'kanji', text: word.kanji });
      }
      list.push({ wordId: word.id, type: 'reading', text: word.reading });
      list.push({ wordId: word.id, type: 'translation', text: word.translation });

      return {
        wordId: word.id,
        totalNeeded: list.length,
        items: list
      };
    }

    function startStackGame(words) {
      stackTotalWords = words.length;
      stackDoneWords = 0;
      stackWaves = [];
      currentWaveIndex = 0;
      selectedSlotIdx = null;

      let currentWavePieces = [];
      const shuffledWords = [...words].sort(() => Math.random() - 0.5);

      shuffledWords.forEach(w => {
        const def = getWordComponents(w);
        const pieces = def.items.map(it => ({
          wordId: def.wordId,
          totalNeeded: def.totalNeeded,
          items: [it]
        }));

        if (currentWavePieces.length + pieces.length > 12) {
          stackWaves.push(currentWavePieces);
          currentWavePieces = [];
        }
        currentWavePieces.push(...pieces);
      });

      if (currentWavePieces.length > 0) {
        stackWaves.push(currentWavePieces);
      }

      switchView('viewStack');
      loadWave(0);
      updateStackProgress();
    }

    function loadWave(waveIdx) {
      currentWaveIndex = waveIdx;
      selectedSlotIdx = null;
      boardSlots = new Array(12).fill(null);

      if (waveIdx < stackWaves.length) {
        const wavePieces = [...stackWaves[waveIdx]].sort(() => Math.random() - 0.5);
        for (let i = 0; i < wavePieces.length; i++) {
          boardSlots[i] = wavePieces[i];
        }
      }

      renderStackBoard();
    }

    function updateStackProgress() {
      const pct = stackTotalWords > 0 ? (stackDoneWords / stackTotalWords) * 100 : 0;
      document.getElementById('stackProgress').style.width = `${pct}%`;
      document.getElementById('stackCounter').innerText = `${stackDoneWords}/${stackTotalWords}`;
    }

    function renderStackBoard() {
      const grid = document.getElementById('stackGrid');
      if (!grid) return;
      grid.innerHTML = '';

      boardSlots.forEach((stack, idx) => {
        const el = document.createElement('div');
        el.className = 'stack-tile';
        el.dataset.slot = idx;

        if (!stack) {
          el.classList.add('empty-slot');
          grid.appendChild(el);
          return;
        }

        if (selectedSlotIdx === idx) el.classList.add('selected');

        const isStack = stack.items.length > 1;
        const mainItem = stack.items[stack.items.length - 1];

        const textLen = mainItem.text.length;
        let sizeClass = '';

        if (mainItem.type === 'translation') {
          if (textLen > 24) sizeClass = 'size-xs';
          else if (textLen > 14) sizeClass = 'size-sm';
        } else if (mainItem.type === 'reading') {
          if (textLen > 10) sizeClass = 'size-xs';
          else if (textLen > 7) sizeClass = 'size-sm';
        } else if (mainItem.type === 'kanji') {
          if (textLen > 6) sizeClass = 'size-sm';
        }

        let chipsHtml = '';
        if (isStack) {
          chipsHtml = `<div class="tile-sub-chips">` + 
            stack.items.slice(0, -1).map(it => `<span class="chip-item">${it.text}</span>`).join('') +
            `</div>`;
        }

        el.innerHTML = `
          <div class="tile-counter-badge">${stack.items.length}/${stack.totalNeeded}</div>
          <div class="tile-main-text type-${mainItem.type} ${sizeClass}">${mainItem.text}</div>
          ${chipsHtml}
        `;

        el.onclick = () => onSlotClick(idx, el);
        grid.appendChild(el);
      });
    }

    function onSlotClick(clickedIdx, el) {
      if (!boardSlots[clickedIdx]) return;

      // 1. ПЕРВЫЙ КЛИК (ВЫБОР КАРТОЧКИ) — ВОТ ЭТО БЫЛО ПРОПУЩЕНО!
      if (selectedSlotIdx === null) {
        selectedSlotIdx = clickedIdx;
        renderStackBoard();
        return;
      }

      // 2. Клик по той же карточке (снятие выделения)
      if (selectedSlotIdx === clickedIdx) {
        selectedSlotIdx = null;
        renderStackBoard();
        return;
      }

      // 3. ВТОРОЙ КЛИК (ПОПЫТКА ОБЪЕДИНЕНИЯ)
      const firstIdx = selectedSlotIdx;
      const targetIdx = clickedIdx;

      const firstStack = boardSlots[firstIdx];
      const targetStack = boardSlots[targetIdx];

      if (!firstStack || !targetStack) {
        selectedSlotIdx = null;
        renderStackBoard();
        return;
      }

      // ПРОВЕРКА НА СОВПАДЕНИЕ
      if (firstStack.wordId === targetStack.wordId) {
        targetStack.items.push(...firstStack.items);
        boardSlots[firstIdx] = null;
        selectedSlotIdx = null;

        if (targetStack.wordId) speakKyoko(targetStack.wordId);

        if (targetStack.items.length >= targetStack.totalNeeded) {
          const p = getWordData(targetStack.wordId);
          p.stacked = true;
          saveState();
          stackDoneWords++;
          updateStackProgress();

          renderStackBoard();
          const targetEl = document.querySelector(`.stack-tile[data-slot="${targetIdx}"]`);
          if (targetEl) targetEl.classList.add('completed-burst');

          setTimeout(() => {
            boardSlots[targetIdx] = null;
            renderStackBoard();

            const isWaveCleared = boardSlots.every(s => s === null);
            if (isWaveCleared) {
              if (currentWaveIndex + 1 < stackWaves.length) {
                setTimeout(() => {
                  loadWave(currentWaveIndex + 1);
                }, 200);
              } else {
                setTimeout(() => {
                  alert('🎉 Превосходно! Все стопки собраны!');
                  showMap();
                }, 300);
              }
            }
          }, 300);
        } else {
          renderStackBoard();
          const targetEl = document.querySelector(`.stack-tile[data-slot="${targetIdx}"]`);
          if (targetEl) targetEl.classList.add('merge-pulse');
        }
      } else {
        // Ошибка (карточки не подошли)
        const firstEl = document.querySelector(`.stack-tile[data-slot="${firstIdx}"]`);
        const secondEl = el;

        if (firstEl) firstEl.classList.add('error');
        if (secondEl) secondEl.classList.add('error');

        selectedSlotIdx = null;
        setTimeout(() => {
          renderStackBoard();
        }, 320);
      }
    }

// Инициализация игры
    loadState();
    renderMap();
  </script>
