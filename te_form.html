<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Тренажёр て-формы</title>
  <style>
    :root {
      --bg-page: #f4f1ea;
      --card-bg: #ffffff;
      --text-main: #2c2c2a;
      --text-sub: #6b6a63;
      --text-muted: #9a988f;
      --border: #d3d1c7;
      --border-light: #e5e2d8;
      --accent: #d97757;
      --accent-hover: #c46849;
      
      --sel-bg: #eeecf0;
      --sel-border: #7f77dd;
      --sel-text: #3c3489;
      
      --success-bg: #eaf3de;
      --success-border: #97c459;
      --success-text: #3b6b19;
      
      --error-bg: #fbeae8;
      --error-border: #a32d2d;
      --error-text: #a32d2d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 14px 12px;
    }

    #app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Кнопка возврата в главное меню */
    .back-to-menu {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 6px;
      text-decoration: none;
      color: #6b6a63;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      background: #fff;
      border: 1px solid #d3d1c7;
      border-radius: 20px;
      margin-bottom: 2px;
      transition: all 0.2s ease;
    }
    .back-to-menu:hover, .back-to-menu:active {
      background: #2c2c2a;
      color: #fff;
      border-color: #2c2c2a;
    }

    /* Шапка */
    .header {
      text-align: center;
      padding: 2px 0 4px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    .header p {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* Меню блоков: ровно 3 ряда по 2 кнопки */
    .block-selector {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 8px !important;
      width: 100% !important;
    }

    .pill-btn {
      display: block !important;
      width: 100% !important;
      padding: 10px 6px !important;
      border-radius: 10px !important;
      border: 1px solid var(--border) !important;
      background-color: var(--card-bg) !important;
      color: var(--text-main) !important;
      font-size: 14px !important;
      font-weight: 600 !important;
      cursor: pointer !important;
      outline: none !important;
      text-align: center !important;
      transition: all 0.15s ease;
    }

    .pill-btn:hover {
      border-color: var(--text-muted) !important;
    }

    .pill-btn.active {
      background-color: var(--text-main) !important;
      color: var(--bg-page) !important;
      border-color: var(--text-main) !important;
    }

    .pill-btn.pill-errors {
      border-color: var(--error-border) !important;
      color: var(--error-text) !important;
    }

    .pill-btn.pill-errors.active {
      background-color: var(--error-border) !important;
      color: #ffffff !important;
    }

    /* Прогресс-бар */
    .progress-container {
      width: 100%;
      height: 6px;
      background: var(--border-light);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--success-border);
      border-radius: 3px;
      transition: width 0.25s ease;
    }

    /* Карточка вопроса */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .audio-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      background: var(--bg-page);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-sub);
      outline: none;
      transition: transform 0.1s;
    }
    .audio-btn:hover { background: #eae6dc; }
    .audio-btn:active { transform: scale(0.92); }

    .kanji {
      font-size: 34px;
      font-weight: 600;
      color: var(--text-main);
      margin-top: 2px;
    }

    .kana {
      font-size: 15px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .meaning {
      font-size: 15px;
      color: var(--sel-text);
      margin-top: 8px;
      font-weight: 500;
    }

    .stem-display {
      font-size: 26px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 16px;
      letter-spacing: 2px;
      background: var(--bg-page);
      padding: 6px 20px;
      border-radius: 8px;
      border: 1px dashed var(--border);
    }

    /* 6 кнопок ответов */
    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .choice-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 0;
      font-size: 20px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      outline: none;
      transition: background 0.1s, transform 0.1s, border-color 0.1s;
    }

    .choice-btn:hover {
      background: var(--sel-bg);
      border-color: var(--sel-border);
    }

    .choice-btn:active {
      transform: scale(0.96);
    }

    /* Блок пояснения */
    .feedback-box {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px;
      border: 1px solid transparent;
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .feedback-box.correct {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: var(--success-text);
    }

    .feedback-box.wrong {
      background: var(--error-bg);
      border-color: var(--error-border);
      color: var(--error-text);
    }

    .fb-title {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .fb-form {
      font-size: 24px;
      font-weight: bold;
      color: var(--text-main);
    }

    .fb-rule {
      font-size: 14px;
      line-height: 1.4;
      color: var(--text-sub);
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      outline: none;
      margin-top: 6px;
      transition: background 0.15s ease;
    }
    .btn-action:hover { background: var(--accent-hover); }

    /* Окончание блока */
    .dialog-view {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .dialog-view h2 { font-size: 22px; color: var(--text-main); }
    .dialog-view p { font-size: 14px; color: var(--text-sub); line-height: 1.5; }
  </style>
</head>
<body>
<div id="app">
  <a href="index.html" class="back-to-menu">← Меню</a>

  <!-- Шапка -->
  <div class="header">
    <h1>Тренажёр て-формы</h1>
    <p>Японские глаголы N5</p>
  </div>

  <!-- Меню выбора блоков: 3 ряда по 2 кнопки -->
  <div class="block-selector">
    <button type="button" class="pill-btn active" id="btnBlock0" onclick="switchBlock(0)">Блок 1</button>
    <button type="button" class="pill-btn" id="btnBlock1" onclick="switchBlock(1)">Блок 2</button>
    <button type="button" class="pill-btn" id="btnBlock2" onclick="switchBlock(2)">Блок 3</button>
    <button type="button" class="pill-btn" id="btnBlock3" onclick="switchBlock(3)">Блок 4</button>
    <button type="button" class="pill-btn" id="btnBlock4" onclick="switchBlock(4)">Блок 5</button>
    <button type="button" class="pill-btn pill-errors" id="btnBlock5" onclick="switchBlock(5)">Ошибки (0)</button>
  </div>

  <!-- Прогресс -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <!-- Игровая панель -->
  <div id="gamePanel" style="display: flex; flex-direction: column; gap: 12px;">
    <div class="card">
      <button type="button" class="audio-btn" id="btnReplayAudio" title="Прослушать">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
      <div class="kanji" id="qKanji">飲む</div>
      <div class="kana" id="qKana">のむ</div>
      <div class="meaning" id="qMeaning">пить</div>
      <div class="stem-display" id="qStem">飲＿＿</div>
    </div>

    <!-- 6 кнопок вариантов -->
    <div class="buttons-grid" id="choicesGrid">
      <button type="button" class="choice-btn" data-end="て">て</button>
      <button type="button" class="choice-btn" data-end="って">って</button>
      <button type="button" class="choice-btn" data-end="んで">んで</button>
      <button type="button" class="choice-btn" data-end="いて">いて</button>
      <button type="button" class="choice-btn" data-end="いで">いで</button>
      <button type="button" class="choice-btn" data-end="して">して</button>
    </div>

    <!-- Пояснение ответа -->
    <div class="feedback-box" id="feedbackBox">
      <div class="fb-title">
        <span id="fbVerdict">Верно!</span>
        <span id="fbGroup" style="font-size:12px; font-weight:normal; opacity:0.85;"></span>
      </div>
      <div class="fb-form" id="fbFullForm">飲んで</div>
      <div class="fb-rule" id="fbRule">1 спр.: む, ぶ, ぬ → んで</div>
      <button type="button" class="btn-action" id="btnNextWord">Продолжить</button>
    </div>
  </div>

  <!-- Экран окончания блока -->
  <div class="dialog-view" id="emptyScreen">
    <h2 id="emptyTitle">Блок завершён!</h2>
    <p id="emptyDesc">Все слова блока пройдены.</p>
    <button type="button" class="btn-action" id="btnRestartBlock">Пройти ещё раз</button>
  </div>
</div>

var currentBlock = 0;
var currentIndex = 0;
var currentList = [];
var errorList = [];
var isAnswered = false;

// Озвучивание
function speak(text) {
  try {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      var msg = new SpeechSynthesisUtterance(text);
      msg.lang = 'ja-JP';
      msg.rate = 0.9;

      var voices = window.speechSynthesis.getVoices();
      if (voices && voices.length > 0) {
        var kyoko = voices.find(function(v) { return v.name.toLowerCase().indexOf('kyoko') !== -1; }) || 
                    voices.find(function(v) { return v.lang && v.lang.indexOf('ja') === 0; });
        if (kyoko) msg.voice = kyoko;
      }

      window.speechSynthesis.speak(msg);
    }
  } catch (err) {
    console.warn("Audio unavailable:", err);
  }
}

// Обновление стилей кнопок меню
function updateNav() {
  for (var i = 0; i < 6; i++) {
    var btn = document.getElementById('btnBlock' + i);
    if (!btn) continue;
    if (currentBlock === i) {
      btn.classList.add('active');
    } else {
      btn.classList.remove('active');
    }
  }
  var errBtn = document.getElementById('btnBlock5');
  if (errBtn) {
    errBtn.textContent = 'Ошибки (' + errorList.length + ')';
  }
}

function switchBlock(idx) {
  currentBlock = idx;
  currentIndex = 0;

  if (idx < 5) {
    currentList = verbsData.slice(idx * 25, (idx + 1) * 25);
  } else {
    currentList = errorList.slice();
  }

  updateNav();
  renderCard();
}

function renderCard() {
  isAnswered = false;
  document.getElementById('feedbackBox').style.display = 'none';
  document.getElementById('choicesGrid').style.display = 'grid';

  if (currentList.length === 0 || currentIndex >= currentList.length) {
    showEmpty();
    return;
  }

  document.getElementById('emptyScreen').style.display = 'none';
  document.getElementById('gamePanel').style.display = 'flex';

  var item = currentList[currentIndex];
  document.getElementById('qKanji').textContent = item.kanji;
  document.getElementById('qKana').textContent = item.kana;
  document.getElementById('qMeaning').textContent = item.mean;
  document.getElementById('qStem').textContent = item.stem + '＿＿';

  var progress = (currentIndex / currentList.length) * 100;
  document.getElementById('progressBar').style.width = progress + '%';

  speak(item.kana);
}

function handleAnswer(chosenEnd) {
  if (isAnswered) return;
  isAnswered = true;

  var item = currentList[currentIndex];
  var isCorrect = (chosenEnd === item.end);
  var fbBox = document.getElementById('feedbackBox');
  var fbVerdict = document.getElementById('fbVerdict');

  document.getElementById('choicesGrid').style.display = 'none';
  fbBox.style.display = 'flex';

  if (isCorrect) {
    fbBox.className = 'feedback-box correct';
    fbVerdict.textContent = 'Правильно! ✨';
    if (currentBlock === 5) {
      errorList = errorList.filter(function(e) { return e.id !== item.id; });
    }
  } else {
    fbBox.className = 'feedback-box wrong';
    fbVerdict.textContent = 'Ошибка ✕';
    var exists = errorList.some(function(e) { return e.id === item.id; });
    if (!exists) {
      errorList.push(item);
    }
  }

  document.getElementById('fbGroup').textContent = item.gr + '-е спряжение';
  document.getElementById('fbFullForm').textContent = item.te;
  document.getElementById('fbRule').textContent = item.rule;

  speak(item.teKana);
  updateNav();
}

function showEmpty() {
  document.getElementById('gamePanel').style.display = 'none';
  document.getElementById('emptyScreen').style.display = 'flex';
  document.getElementById('progressBar').style.width = '100%';

  var title = document.getElementById('emptyTitle');
  var desc = document.getElementById('emptyDesc');

  if (currentBlock === 5) {
    if (errorList.length === 0) {
      title.textContent = 'Ошибок нет!';
      desc.textContent = 'Вы исправили все неверные ответы.';
    } else {
      title.textContent = 'Круг ошибок пройден';
      desc.textContent = 'Осталось исправить: ' + errorList.length;
    }
  } else {
    title.textContent = 'Блок ' + (currentBlock + 1) + ' пройден!';
    desc.textContent = 'Можете повторить этот блок или выбрать следующий в меню вверху.';
  }
}

// Нажатия на 6 вариантов ответов
var choiceButtons = document.querySelectorAll('.choice-btn');
choiceButtons.forEach(function(btn) {
  btn.onclick = function() {
    handleAnswer(btn.getAttribute('data-end'));
  };
});

document.getElementById('btnNextWord').onclick = function() {
  currentIndex++;
  renderCard();
};

document.getElementById('btnReplayAudio').onclick = function() {
  if (currentList[currentIndex]) {
    speak(currentList[currentIndex].kana);
  }
};

document.getElementById('btnRestartBlock').onclick = function() {
  switchBlock(currentBlock);
};

// Запуск
switchBlock(0);
