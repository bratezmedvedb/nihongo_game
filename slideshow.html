<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JLPT N5 — Слайд-шоу</title>
  
  <!-- Подключение Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Отступ шапки под кнопки Telegram -->
  <style>
    header {
      padding-top: calc(56px + env(safe-area-inset-top, 0px)) !important;
    }
  </style>

  <style>
    :root {
      --bg: #f4f1ea;
      --card-bg: #ffffff;
      --text: #2c2c2a;
      --sub-text: #6b6a63;
      --kana: #858379;
      --border: #d3d1c7;
      --border-light: #e5e2d8;
      --accent: #d97757;
      --accent-hover: #c46445;
      --ink: #3c3489;
      --success-bg: #eaf3de;
      --success-border: #97c459;
      --star-color: #d97706;
      --star-bg: #fef3c7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Верхнее меню */
    header {
      width: 100%;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-light);
      background: var(--bg);
      z-index: 10;
      gap: 12px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .back-to-menu {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--sub-text);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .back-to-menu:hover, .back-to-menu:active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .badge-n5 {
      background: var(--accent);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .nav-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-btn {
      background: transparent;
      color: var(--sub-text);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .nav-btn.active {
      background: var(--text);
      color: #fff;
      border-color: var(--text);
    }

    /* Главная область */
    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      position: relative;
      min-height: 0;
    }

    .tab-content {
      display: none;
      width: 100%;
      height: 100%;
      animation: fadeIn 0.25s ease;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Карточка с абсолютным центром */
    .presentation-card {
      width: 100%;
      max-width: 1400px;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .card-top {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 5;
      pointer-events: none;
    }

    .card-top * {
      pointer-events: auto;
    }

    .deck-indicator {
      font-size: 0.85rem;
      color: var(--sub-text);
      font-weight: 600;
    }

    .corner-actions {
      display: flex;
      gap: 8px;
    }

    .action-circle-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .action-circle-btn:active {
      transform: scale(0.92);
    }

    .action-circle-btn.btn-voice:hover {
      background: #eef2ff;
      border-color: var(--ink);
    }

    .action-circle-btn.btn-star.starred {
      background: var(--star-bg);
      border-color: var(--star-color);
      color: var(--star-color);
    }

    .action-circle-btn.btn-check:hover {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: #3b7c1e;
    }

    .action-circle-btn.btn-esc {
      display: none;
      font-weight: bold;
      color: var(--sub-text);
    }

    /* Блок текста по центру */
    .card-center {
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0 10px;
    }

    /* Автомасштаб шрифтов под экраны */
    .kanji-display {
      font-size: clamp(4.8rem, 18vw, 13rem);
      font-weight: 800;
      color: var(--text);
      line-height: 1.05;
      letter-spacing: 0 !important;
      margin: 0 0 12px 0;
      text-align: center;
      white-space: nowrap;
      max-width: 95vw;
    }

    .reading-display {
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      color: var(--kana);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: 0 !important;
      margin: 0 0 14px 0;
      text-align: center;
      white-space: nowrap;
      max-width: 95vw;
    }

    .kanji-display.len-4 {
      font-size: clamp(3.8rem, 13vw, 9.5rem);
    }

    .kanji-display.len-5 {
      font-size: clamp(3.2rem, 11vw, 7.8rem);
    }

    .kanji-display.len-long {
      font-size: clamp(2.6rem, 8.5vw, 6rem);
    }

    .reading-display.len-long {
      font-size: clamp(1.6rem, 5vw, 3.2rem);
    }

    .meaning-display {
      font-size: clamp(1.1rem, 3.8vw, 1.6rem);
      color: var(--ink);
      font-weight: 600;
      display: inline-block;
      border: none !important;
      background: transparent !important;
      padding: 4px 12px;
      margin: 0;
      text-align: center;
      transition: filter 0.25s ease, opacity 0.25s ease;
      max-width: 90vw;
    }

    .meaning-display.hidden-answer {
      filter: blur(8px);
      opacity: 0.15;
    }

    /* Нижняя панель управления */
    .bottom-bar {
      width: 100%;
      background: var(--card-bg);
      border-top: 1px solid var(--border-light);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      position: relative;
      flex-shrink: 0;
    }

    .ctrl-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .ctrl-btn.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .ctrl-btn.active-toggle {
      background: #eef2ff;
      border-color: var(--ink);
      color: var(--ink);
    }

    .select-custom {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 10px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .progress-line-container {
      position: absolute;
      top: -3px;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--border-light);
    }

    .progress-line {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.05s linear;
    }

    /* ПОЛНОЭКРАННЫЙ РЕЖИМ (И ДЛЯ БРАУЗЕРА, И ДЛЯ TELEGRAM) */
    body.app-fullscreen header,
    body.app-fullscreen .bottom-bar,
    body.app-fullscreen .deck-indicator,
    :fullscreen header,
    :fullscreen .bottom-bar,
    :fullscreen .deck-indicator {
      display: none !important;
    }

    body.app-fullscreen,
    :fullscreen body {
      background: var(--bg);
    }

    body.app-fullscreen main,
    :fullscreen main {
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
    }

    body.app-fullscreen .presentation-card,
    :fullscreen .presentation-card {
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-width: none !important;
      border: none !important;
      border-radius: 0 !important;
      background: var(--bg) !important;
      padding: 0 !important;
    }

    body.app-fullscreen .card-top,
    :fullscreen .card-top {
      top: 20px;
      left: 20px;
      right: 20px;
    }

    body.app-fullscreen .action-circle-btn.btn-esc,
    :fullscreen .action-circle-btn.btn-esc {
      display: flex !important;
    }

    body.app-fullscreen .kanji-display,
    :fullscreen .kanji-display {
      font-size: clamp(6.5rem, 24vw, 22rem);
    }
    body.app-fullscreen .reading-display,
    :fullscreen .reading-display {
      font-size: clamp(3rem, 10vw, 8rem);
    }
    body.app-fullscreen .meaning-display,
    :fullscreen .meaning-display {
      font-size: clamp(1.4rem, 4.5vw, 2.4rem);
    }

    /* Мобильная адаптация интерфейса */
    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: stretch;
        padding: 8px 10px;
        gap: 6px;
      }
      .header-left {
        justify-content: space-between;
      }
      .nav-tabs {
        width: 100%;
        justify-content: flex-start;
      }
      main {
        padding: 6px;
      }
      .presentation-card {
        border-radius: 18px;
        padding: 12px;
      }
      .card-top {
        top: 10px;
        left: 12px;
        right: 12px;
      }
      .action-circle-btn {
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
      }
      .bottom-bar {
        padding: 6px 8px calc(8px + env(safe-area-inset-bottom, 0px));
        gap: 5px;
      }
      .ctrl-btn, .select-custom {
        padding: 6px 8px;
        font-size: 0.8rem;
      }
    }

    /* Списки во вкладках */
    .list-wrapper {
      width: 100%;
      max-width: 1400px;
      height: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .search-input {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      font-size: 0.9rem;
      width: 100%;
      max-width: 300px;
    }

    .words-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
      overflow-y: auto;
      padding-right: 4px;
      flex: 1;
    }

    .word-item {
      background: var(--bg);
      border: 1px solid var(--border-light);
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .word-item .main-info .w-kanji {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--text);
    }

    .word-item .main-info .w-reading {
      font-size: 0.9rem;
      color: var(--sub-text);
      margin-left: 6px;
    }

    .word-item .main-info .w-meaning {
      font-size: 0.88rem;
      color: var(--ink);
      margin-top: 2px;
      font-weight: 500;
    }

    .item-actions {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .mini-btn.starred {
      background: var(--star-bg);
      border-color: var(--star-color);
      color: var(--star-color);
    }

    .mini-btn.learned {
      background: var(--success-bg);
      border-color: var(--success-border);
      color: #2b6814;
    }

    .empty-state {
      text-align: center;
      padding: 40px 10px;
      color: var(--sub-text);
      font-size: 1rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .fade-content {
      animation: fadeIn 0.2s ease forwards;
    }
  </style>
</head>
<body>

  <!-- Меню -->
  <header>
    <div class="header-left">
      <a href="index.html" class="back-to-menu">← Меню</a>
      <div class="brand">
        <span>JLPT N5</span>
        <span class="badge-n5">710 Слов</span>
      </div>
    </div>

    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab('presentation')">📺 Показ</button>
      <button class="nav-btn" id="favTabBtn" onclick="switchTab('favorites')">⭐ Избранные (0)</button>
      <button class="nav-btn" id="learnedTabBtn" onclick="switchTab('learned')">✔️ Изученные (0)</button>
      <button class="nav-btn" onclick="switchTab('all')">📚 Все слова</button>
    </div>
  </header>

  <!-- Экран -->
  <main>
    <div id="tab-presentation" class="tab-content active">
      <div class="presentation-card">
        
        <div class="card-top">
          <div class="deck-indicator" id="deckIndicator">Слово 1 из 710</div>
          
          <div class="corner-actions">
            <button class="action-circle-btn btn-star" id="starActionBtn" onclick="toggleCurrentFavorite()" title="В избранное">⭐</button>
            <button class="action-circle-btn btn-voice" onclick="speakCurrentWord(true)" title="Озвучить">🔊</button>
            <button class="action-circle-btn btn-check" onclick="markCurrentAsLearned()" title="Знаю слово">✔️</button>
            <button class="action-circle-btn btn-esc" onclick="toggleFullScreen()" title="Выйти из полного экрана">✕</button>
          </div>
        </div>

        <div class="card-center" onclick="toggleHideAnswer()">
          <div class="kanji-display" id="dispKanji">ああ</div>
          <div class="reading-display" id="dispReading">ああ</div>
          <div>
            <div class="meaning-display" id="dispMeaning">А! (восклицание)</div>
          </div>
        </div>

      </div>
    </div>

    <!-- Вкладка: Избранные -->
    <div id="tab-favorites" class="tab-content">
      <div class="list-wrapper">
        <div class="list-header">
          <div>
            <h2>⭐ Избранные слова</h2>
            <p style="color:var(--sub-text); font-size:0.85rem;">Слова для повторения</p>
          </div>
          <button class="ctrl-btn primary" onclick="startDeckMode('favorites')">▶ Запустить презентацию</button>
        </div>
        <div class="words-grid" id="favoritesGrid"></div>
      </div>
    </div>

    <!-- Вкладка: Изученные -->
    <div id="tab-learned" class="tab-content">
      <div class="list-wrapper">
        <div class="list-header">
          <div>
            <h2>✔️ Изученные слова</h2>
            <p style="color:var(--sub-text); font-size:0.85rem;">Исключены из основного показа</p>
          </div>
          <button class="ctrl-btn" onclick="resetAllLearned()">Вернуть все</button>
        </div>
        <div class="words-grid" id="learnedGrid"></div>
      </div>
    </div>

    <!-- Вкладка: Все слова -->
    <div id="tab-all" class="tab-content">
      <div class="list-wrapper">
        <div class="list-header">
          <div>
            <h2>📚 Полный словарь (710)</h2>
            <p style="color:var(--sub-text); font-size:0.85rem;" id="allWordsCount">Всего: 710 слов</p>
          </div>
          <input type="text" class="search-input" id="searchAllInput" placeholder="Поиск..." oninput="filterAllWords()">
        </div>
        <div class="words-grid" id="allWordsGrid"></div>
      </div>
    </div>
  </main>

  <!-- Панель управления -->
  <div class="bottom-bar">
    <div class="progress-line-container">
      <div class="progress-line" id="progressLine"></div>
    </div>

    <button class="ctrl-btn" onclick="prevSlide()">◀</button>
    <button class="ctrl-btn primary" id="playBtn" onclick="togglePlay()">⏸ Пауза</button>
    <button class="ctrl-btn" onclick="nextSlide()">▶</button>
    
    <select class="select-custom" id="timerSelect" onchange="changeInterval()">
      <option value="3000">3с</option>
      <option value="5000" selected>5с</option>
      <option value="8000">8с</option>
      <option value="10000">10с</option>
      <option value="15000">15с</option>
      <option value="30000">30с</option>
    </select>

    <button class="ctrl-btn active-toggle" id="autoVoiceBtn" onclick="toggleAutoVoice()">
      🔊 Звук
    </button>

    <button class="ctrl-btn" onclick="toggleHideAnswer()">👁 Скрыть</button>
    <button class="ctrl-btn" onclick="shuffleCurrentDeck()">🔀 Микс</button>
    <button class="ctrl-btn" onclick="toggleFullScreen()">⛶ Экран</button>
  </div>

  <script>

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();

    let starredSet = new Set(JSON.parse(localStorage.getItem('kanji_starred_710') || '[]'));

    function saveStorage() {
      localStorage.setItem('kanji_starred_710', JSON.stringify([...starredSet]));
      localStorage.setItem('kanji_learned_710', JSON.stringify([...learnedSet]));
      updateTabCounters();
    }

    function updateTabCounters() {
      favTabBtn.textContent = `⭐ Избранные (${starredSet.size})`;
      learnedTabBtn.textContent = `✔️ Изученные (${learnedSet.size})`;
    }

    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function rebuildDeck() {
      if (currentDeckMode === 'favorites') {
        activeDeck = RAW_VOCABULARY.filter(item => starredSet.has(item.id));
      } else {
        activeDeck = RAW_VOCABULARY.filter(item => !learnedSet.has(item.id));
      }

      if (activeDeck.length === 0) {
        dispKanji.textContent = "Пусто 🎉";
        dispReading.textContent = "";
        dispMeaning.textContent = "Все слова пройдены";
        deckIndicator.textContent = "0 / 0";
        stopTimer();
        return;
      }

      if (currentIndex >= activeDeck.length) currentIndex = 0;
      updateCard();
    }

    function updateCard() {
      if (activeDeck.length === 0) return;
      const item = activeDeck[currentIndex];
      
      dispKanji.classList.remove('fade-content');
      void dispKanji.offsetWidth;
      dispKanji.classList.add('fade-content');

      dispKanji.textContent = item.k;
      dispReading.textContent = item.r;
      dispMeaning.textContent = item.m;

      const kLen = item.k.length;
      const rLen = item.r.length;

      dispKanji.classList.remove('len-4', 'len-5', 'len-long');
      dispReading.classList.remove('len-long');

      if (kLen === 4) {
        dispKanji.classList.add('len-4');
      } else if (kLen === 5) {
        dispKanji.classList.add('len-5');
      } else if (kLen >= 6) {
        dispKanji.classList.add('len-long');
      }

      if (rLen >= 8) {
        dispReading.classList.add('len-long');
      }

      deckIndicator.textContent = `Слово ${currentIndex + 1} из ${activeDeck.length}`;

      if (starredSet.has(item.id)) {
        starActionBtn.classList.add('starred');
      } else {
        starActionBtn.classList.remove('starred');
      }

      if (isAutoVoice) {
        speakCurrentWord(false);
      }

      resetProgress();
    }

    function getKyokoVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      
      let voice = voices.find(v => 
        v.name.toLowerCase().includes('kyoko') || 
        v.name.includes('キョウコ') ||
        v.name.includes('Kyoko')
      );
      
      if (!voice) {
        voice = voices.find(v => v.lang.startsWith('ja') || v.lang === 'ja_JP');
      }
      return voice;
    }

    function speakCurrentWord(userTriggered = false) {
      if (activeDeck.length === 0 || !('speechSynthesis' in window)) return;
      const item = activeDeck[currentIndex];

      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(item.r || item.k);
      ut.lang = 'ja-JP';

      const voice = getKyokoVoice();
      if (voice) ut.voice = voice;
      ut.rate = 0.9;

      window.speechSynthesis.speak(ut);
    }

    function toggleAutoVoice() {
      isAutoVoice = !isAutoVoice;
      if (isAutoVoice) {
        autoVoiceBtn.textContent = '🔊 Звук: ВКЛ';
        autoVoiceBtn.classList.add('active-toggle');
        speakCurrentWord(true);
      } else {
        autoVoiceBtn.textContent = '🔇 Звук: ВЫКЛ';
        autoVoiceBtn.classList.remove('active-toggle');
        window.speechSynthesis.cancel();
      }
    }

    function toggleCurrentFavorite() {
      if (activeDeck.length === 0) return;
      const item = activeDeck[currentIndex];
      toggleFavById(item.id);
    }

    function toggleFavById(id) {
      if (starredSet.has(id)) {
        starredSet.delete(id);
      } else {
        starredSet.add(id);
      }
      saveStorage();
      
      if (activeDeck[currentIndex] && activeDeck[currentIndex].id === id) {
        if (starredSet.has(id)) {
          starActionBtn.classList.add('starred');
        } else {
          starActionBtn.classList.remove('starred');
        }
      }

      renderFavoritesList();
      renderAllWordsList(document.getElementById('searchAllInput').value);

      if (currentDeckMode === 'favorites') {
        rebuildDeck();
      }
    }

    function toggleLearnedById(id) {
      if (learnedSet.has(id)) {
        learnedSet.delete(id);
      } else {
        learnedSet.add(id);
      }
      saveStorage();
      renderLearnedList();
      renderAllWordsList(document.getElementById('searchAllInput').value);

      if (currentDeckMode === 'normal') {
        rebuildDeck();
      }
    }

    function markCurrentAsLearned() {
      if (activeDeck.length === 0) return;
      const item = activeDeck[currentIndex];
      
      learnedSet.add(item.id);
      saveStorage();
      renderLearnedList();
      
      activeDeck.splice(currentIndex, 1);

      if (activeDeck.length === 0) {
        dispKanji.textContent = "Пусто 🎉";
        dispReading.textContent = "";
        dispMeaning.textContent = "Все слова пройдены";
        deckIndicator.textContent = "0 / 0";
        stopTimer();
        return;
      }

      if (currentIndex >= activeDeck.length) {
        currentIndex = 0;
      }
      updateCard();
    }

    function nextSlide() {
      if (activeDeck.length === 0) return;
      currentIndex = (currentIndex + 1) % activeDeck.length;
      updateCard();
    }

    function prevSlide() {
      if (activeDeck.length === 0) return;
      currentIndex = (currentIndex - 1 + activeDeck.length) % activeDeck.length;
      updateCard();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      if (isPlaying) {
        playBtn.textContent = '⏸ Пауза';
        playBtn.classList.add('primary');
        startTimer();
      } else {
        playBtn.textContent = '▶ Старт';
        playBtn.classList.remove('primary');
        stopTimer();
      }
    }

    function startTimer() {
      stopTimer();
      if (!isPlaying || activeDeck.length === 0) return;

      let start = performance.now();
      progressTimer = setInterval(() => {
        let elapsed = performance.now() - start;
        let p = Math.min((elapsed / slideInterval) * 100, 100);
        progressLine.style.width = p + '%';
      }, 50);

      timer = setTimeout(() => {
        nextSlide();
        startTimer();
      }, slideInterval);
    }

    function stopTimer() {
      clearTimeout(timer);
      clearInterval(progressTimer);
      progressLine.style.width = '0%';
    }

    function resetProgress() {
      if (isPlaying) startTimer();
    }

    function changeInterval() {
      slideInterval = parseInt(document.getElementById('timerSelect').value);
      if (isPlaying) startTimer();
    }

    function toggleHideAnswer() {
      isAnswerHidden = !isAnswerHidden;
      dispMeaning.classList.toggle('hidden-answer', isAnswerHidden);
    }

    function shuffleCurrentDeck() {
      if (activeDeck.length <= 1) return;
      shuffleArray(activeDeck);
      currentIndex = 0;
      updateCard();
    }

    // Полноэкранный режим: инициирует как нативный, так и программный Telegram/CSS режим
    function toggleFullScreen() {
      const isFull = document.body.classList.toggle('app-fullscreen');
      
      // Полноэкранный режим в новых версиях Telegram
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.requestFullscreen) {
        try {
          if (isFull) window.Telegram.WebApp.requestFullscreen();
          else window.Telegram.WebApp.exitFullscreen();
        } catch (e) {}
      }

      // Обычный браузерный Fullscreen (на ПК/ТВ)
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

      const target = document.getElementById('tab-' + tabId);
      if (target) target.classList.add('active');

      const btnMap = {
        'presentation': 0,
        'favorites': 1,
        'learned': 2,
        'all': 3
      };
      document.querySelectorAll('.nav-btn')[btnMap[tabId]]?.classList.add('active');

      if (tabId === 'favorites') renderFavoritesList();
      if (tabId === 'learned') renderLearnedList();
      if (tabId === 'all') renderAllWordsList(document.getElementById('searchAllInput').value);
    }

    function startDeckMode(mode) {
      currentDeckMode = mode;
      currentIndex = 0;
      switchTab('presentation');
      rebuildDeck();
    }

        const div = document.createElement('div');
        div.className = 'word-item';
        div.innerHTML = `
          <div class="main-info">

          <div class="item-actions">
            <button class="mini-btn" onclick="speakWordText('${w.r}')">🔊</button>
            <button class="mini-btn starred" onclick="toggleFavById(${w.id})" title="Убрать из избранного">⭐</button>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function renderLearnedList() {
      const grid = document.getElementById('learnedGrid');
      grid.innerHTML = '';
      const learnedWords = RAW_VOCABULARY.filter(w => learnedSet.has(w.id));

      if (learnedWords.length === 0) {
        grid.innerHTML = '<div class="empty-state">Нет изученных слов.</div>';
        return;
      }

      learnedWords.forEach(w => {
        const div = document.createElement('div');
        div.className = 'word-item';
        div.innerHTML = `
          <div class="main-info">
            <div><span class="w-kanji">${w.k}</span><span class="w-reading">${w.r}</span></div>
            <div class="w-meaning">${w.m}</div>
          </div>
          <div class="item-actions">
            <button class="mini-btn learned" onclick="toggleLearnedById(${w.id})" title="Вернуть в колоду">✔️</button>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function resetAllLearned() {
      if (confirm('Вернуть все изученные слова обратно в колоду?')) {
        learnedSet.clear();
        saveStorage();
        renderLearnedList();
        rebuildDeck();
      }
    }

    function renderAllWordsList(query = '') {
      const grid = document.getElementById('allWordsGrid');
      grid.innerHTML = '';
      document.getElementById('allWordsCount').textContent = `Всего: ${RAW_VOCABULARY.length} слов`;

      const filtered = RAW_VOCABULARY.filter(w => {
        const q = query.toLowerCase();
        return w.k.toLowerCase().includes(q) || w.r.toLowerCase().includes(q) || w.m.toLowerCase().includes(q);
      });

      filtered.forEach(w => {
        const isFav = starredSet.has(w.id);
        const isLrn = learnedSet.has(w.id);

        const div = document.createElement('div');
        div.className = 'word-item';
        div.innerHTML = `
          <div class="main-info">
            <div>
              <span class="w-kanji">${w.k}</span>
              <span class="w-reading">${w.r}</span>
            </div>
            <div class="w-meaning">${w.m}</div>
          </div>
          <div class="item-actions">
            <button class="mini-btn ${isFav ? 'starred' : ''}" onclick="toggleFavById(${w.id})" title="${isFav ? 'В избранном' : 'Добавить в избранное'}">⭐</button>
            <button class="mini-btn" onclick="speakWordText('${w.r}')" title="Озвучить">🔊</button>
            <button class="mini-btn ${isLrn ? 'learned' : ''}" onclick="toggleLearnedById(${w.id})" title="${isLrn ? 'Изучено' : 'Пометить как изученное'}">✔️</button>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function filterAllWords() {
      renderAllWordsList(document.getElementById('searchAllInput').value);
    }

    function speakWordText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const ut = new SpeechSynthesisUtterance(text);
      ut.lang = 'ja-JP';
      const voice = getKyokoVoice();
      if (voice) ut.voice = voice;
      window.speechSynthesis.speak(ut);
    }

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowRight') {
        nextSlide();
      } else if (e.code === 'ArrowLeft') {
        prevSlide();
      } else if (e.code === 'KeyS') {
        toggleCurrentFavorite();
      } else if (e.code === 'KeyV') {
        speakCurrentWord(true);
      } else if (e.code === 'KeyA') {
        toggleAutoVoice();
      } else if (e.code === 'Enter' || e.code === 'KeyK') {
        markCurrentAsLearned();
      } else if (e.code === 'KeyH') {
        toggleHideAnswer();
      } else if (e.code === 'KeyF') {
        toggleFullScreen();
      }
    });

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    saveStorage();
    rebuildDeck();
    startTimer();
  </script>
</body>
</html>
