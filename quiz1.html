<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Квиз 1</title>

  <!-- Отступ под кнопки Telegram -->
  <style>
    body {
      padding-top: calc(56px + env(safe-area-inset-top, 0px)) !important;
    }
  </style>

  <style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background: #f4f1ea;
    color: #2c2c2a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1 { font-size: 22px; font-weight: 600; text-align: center; margin: 0 0 4px; }
  .sub { text-align: center; font-size: 14px; color: #6b6a63; margin: 0 0 18px; }
  .blocks { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .block-btn {
    border: 1px solid #d3d1c7; background: #fff; padding: 8px 12px;
    border-radius: 20px; font-size: 12px; cursor: pointer; color: #2c2c2a;
    text-align: center; line-height: 1.3;
  }
  .block-btn.active { background: #2c2c2a; color: #fff; border-color: #2c2c2a; }
  .block-btn.mistakes-btn { border-color: #d97757; color: #d97757; }
  .block-btn.mistakes-btn.active { background: #d97757; color: #fff; border-color: #d97757; }
  .status-bar { display: flex; justify-content: space-between; font-size: 13px; color: #6b6a63; margin-bottom: 6px; }
  .status-bar b { color: #2c2c2a; }
  .progress-track { height: 6px; background: #e5e2d8; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { height: 100%; background: #d97757; border-radius: 3px; transition: width 0.3s; }

  .sentence-card {
    background: #fff; border: 1px solid #d3d1c7; border-radius: 16px;
    padding: 28px 20px; text-align: center; margin-bottom: 18px;
    position: relative;
  }
  .sentence-jp { font-size: 24px; line-height: 1.6; word-break: break-word; }
  .blank { display: inline-block; min-width: 34px; border-bottom: 2px solid #d97757; color: #d97757; font-weight: 700; }

  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
  .option-btn {
    border: 1px solid #d3d1c7; background: #fff; border-radius: 12px;
    padding: 16px 8px; font-size: 22px; cursor: pointer; color: #2c2c2a;
  }
  .option-btn:active { transform: scale(0.97); }
  .option-btn.correct { background: #eaf3de; border-color: #97c459; color: #2c5b0e; }
  .option-btn.wrong { background: #fcebeb; border-color: #f09595; color: #8f2c2c; }
  .option-btn.disabled { pointer-events: none; opacity: 0.6; }
  .option-btn.disabled.correct, .option-btn.disabled.wrong { opacity: 1; }

  .feedback-panel {
    background: #eeedfe; border: 1px solid #afa9ec; border-radius: 14px;
    padding: 16px; margin-bottom: 16px; display: none;
  }
  .feedback-panel.show { display: block; }
  .feedback-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .feedback-title { font-size: 14px; font-weight: 700; }
  .feedback-title.ok { color: #2c5b0e; }
  .feedback-title.bad { color: #8f2c2c; }
  .replay-btn {
    flex: 0 0 auto; border: 1px solid #afa9ec; background: #fff; color: #3c3489;
    border-radius: 10px; padding: 6px 10px; font-size: 15px; cursor: pointer; line-height: 1;
  }
  .replay-btn:active { transform: scale(0.95); }
  .feedback-rule { font-size: 14px; color: #3c3489; line-height: 1.5; margin-bottom: 12px; font-weight: 600; }
  
  .fb-kana { font-size: 22px; font-weight: 700; color: #2c2c2a; margin-bottom: 6px; line-height: 1.4; }
  .fb-translation { font-size: 18px; font-weight: 600; color: #3c3489; margin-bottom: 12px; line-height: 1.4; }
  .fb-vocab { font-size: 14px; color: #4a4a45; line-height: 1.6; margin-bottom: 12px; }
  .fb-grammar { font-size: 14px; color: #4a4a45; line-height: 1.6; border-top: 1px dashed #cfc9f0; padding-top: 10px; }

  .next-btn {
    display: none; width: 100%; background: #d97757; color: #fff; border: none;
    padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
  }
  .next-btn.show { display: block; }

  .summary { text-align: center; padding: 30px 10px; }
  .summary h2 { font-size: 20px; margin-bottom: 8px; }
  .summary p { color: #6b6a63; font-size: 14px; margin-bottom: 20px; }
  .restart-btn {
    background: #2c2c2a; color: #fff; border: none; padding: 12px 24px;
    border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    margin: 0 6px 10px;
  }

  .empty-mistakes { text-align: center; padding: 40px 10px; color: #6b6a63; font-size: 14px; line-height: 1.6; }

  /* Кнопка возврата в главное меню */
  .back-to-menu {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: #6b6a63;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    background: #fff;
    border: 1px solid #d3d1c7;
    border-radius: 20px;
    margin-bottom: 14px;
    transition: all 0.2s ease;
  }
  .back-to-menu:hover, .back-to-menu:active {
    background: #2c2c2a;
    color: #fff;
    border-color: #2c2c2a;
  }

</style>
</head>

<script>
const RAW_QUIZ_DATA = [{"front":"名前は何ですか。","blanked":"名前___何ですか。","particle":"は","explanation":"Грамматика: [тема] は 何ですか = «что такое [тема]?»","back":"なまえは なんですか。\nКак тебя зовут?\n• 名前は (なまえは) — имя (тема)\n• 何ですか (なんですか) — что? (вопрос)Грамматика: [тема] は 何ですか = «что такое [тема]?»."},{"front":"私の名前はアントンです。","blanked":"私___名前はアントンです。","particle":"の","explanation":"Грамматика: [сущ.] の [сущ.] は [имя] です = «[чье-то] [что-то] — это [имя]»","back":"わたしの なまえは アントンです。\nМеня зовут Антон.\n• 私の名前は (わたしのなまえは) — моё имя\n• アントンです — АнтонГрамматика: [сущ.] の [сущ.] は [имя] です = «[чье-то] [что-то] — это [имя]»."},{"front":"ロシアから来ました。","blanked":"ロシア___来ました。","particle":"から","explanation":"Грамматика: [место] から 来ました = «приехал из [места]»","back":"ロシアから きました。\nЯ приехал из России.\n• ロシアから — из России (сущ. + から)\n• 来ました (きました) — приехал (прош. от 来る)Грамматика: [место] から 来ました = «приехал из [места]»."},{"front":"ヤルツェボから来ました。","blanked":"ヤルツェボ___来ました。","particle":"から","explanation":"из (исходная точка)","back":"ヤルツェボから きました。\nЯ приехал из Ярцева.\n• ヤルツェボ — Ярцево (город)\n• から — из (исходная точка)\n• 来ました (きました) — приехал (прош. от 来る)Грамматика: [место] から 来ました = «приехал из [места]».\nから — частица, указывающая на исходную точку движения."},{"front":"今どこに住んでいますか。","blanked":"今どこ___住んでいますか。","particle":"に","explanation":"указывает место нахождения","back":"いま どこに すんでいますか。\nГде ты сейчас живёшь?\n• 今 (いま) — сейчас\n• どこに — где (место)\n• 住んでいますか (すんでいますか) — живёшь? (длит. от 住む)Грамматика: [время] [вопрос. слово] に [гл. в длит. форме] か = «[время] где [делаешь]?».\n住んでいます — живу (текущее состояние). に указывает место нахождения."},{"front":"今、モスクワに住んでいます。","blanked":"今、モスクワ___住んでいます。","particle":"に","explanation":"место постоянного нахождения","back":"いま、モスクワに すんでいます。\nСейчас я живу в Москве.\n• 今 (いま) — сейчас\n• モスクワに — в Москве (место)\n• 住んでいます (すんでいます) — живу (длит. от 住む)Грамматика: [время] [место] に 住んでいます = «в [время] живу в [месте]».\nに — место постоянного нахождения.\n住んでいます — текущее состояние (длительная форма)."},{"front":"前はエンジニアでした。","blanked":"前___エンジニアでした。","particle":"は","explanation":"Грамматика: [время] は [сущ.] でした = «в [время] был [сущ.]»","back":"まえは エンジニアでした。\nРаньше я работал инженером.\n• 前は (まえは) — раньше, прежде (тема)\n• エンジニアでした — был инженером (сущ. + でした)Грамматика: [время] は [сущ.] でした = «в [время] был [сущ.]».\n前は — часто используется для противопоставления прошлого и настоящего (в паре с 今は).\nでした — прош. от です."},{"front":"しごとは何ですか。","blanked":"しごと___何ですか。","particle":"は","explanation":"Грамматика: [тема] は 何ですか = «что такое [тема]?»","back":"しごとは なんですか。\nКем ты работаешь?\n• しごとは — работа\n• 何ですか (なんですか) — что?Грамматика: [тема] は 何ですか = «что такое [тема]?».\nДословно: «Что твоя работа?» → «Кем ты работаешь?»"},{"front":"きのうは休みでした。","blanked":"きのう___休みでした。","particle":"は","explanation":"Грамматика: [время] は [сущ.] でした = «в [время] был [сущ.]»","back":"きのうは やすみでした。\nВчера был выходной.\n• きのうは — вчера\n• やすみでした — был выходной (сущ. + でした)Грамматика: [время] は [сущ.] でした = «в [время] был [сущ.]».\nでした — прош. от です."},{"front":"あしたはしごとです。","blanked":"あした___しごとです。","particle":"は","explanation":"Грамматика: [время] は [сущ.] です = «в [время] — [сущ.]»","back":"あしたは しごとです。\nЗавтра я работаю.\n• あしたは — завтра\n• しごとです — работа (сущ. + です)Грамматика: [время] は [сущ.] です = «в [время] — [сущ.]»."},{"front":"二時から六時まで働きます。","blanked":"二時___六時まで働きます。","particle":"から","explanation":"начальная точка времени","back":"にじから ろくじまで はたらきます。\nЯ буду работать с 2 до 6.\n• 二時から (にじから) — с 2 часов\n• 六時まで (ろくじまで) — до 6 часов\n• 働きます (はたらきます) — работаюГрамматика: [время1] から [время2] まで [гл.] = «делаю [гл.] с [время1] до [время2]».\nから — начальная точка времени.\nまで — конечная точка времени."},{"front":"十時に起きました。","blanked":"十時___起きました。","particle":"に","explanation":"част. конкретного момента времени","back":"じゅうじに おきました。\nЯ проснулся в 10 часов.\n• 十時に (じゅうじに) — в 10 часов\n• 起きました (おきました) — проснулся (прош. от 起きる)Грамматика: [время] に [гл. в прош.] = «сделал [гл.] в [время]».\nに — част. конкретного момента времени."},{"front":"十二時に寝ました。","blanked":"十二時___寝ました。","particle":"に","explanation":"Грамматика: [время] に [гл. в прош.] = «сделал [гл.] в [время]»","back":"じゅうにじに ねました。\nЯ лёг спать в 12 часов.\n• 十二時に (じゅうにじに) — в 12 часов\n• 寝ました (ねました) — лёг спать (прош. от 寝る)Грамматика: [время] に [гл. в прош.] = «сделал [гл.] в [время]»."},{"front":"八時に朝ごはんを食べます。","blanked":"八時___朝ごはんを食べます。","particle":"に","explanation":"Грамматика: [время] に [еда] を [гл.] = «в [время] ем [еду]»","back":"はちじに あさごはんを たべます。\nВ 8 я завтракаю.\n• 八時に (はちじに) — в 8 часов\n• 朝ごはんを (あさごはんを) — завтрак (объект)\n• 食べます (たべます) — емГрамматика: [время] に [еда] を [гл.] = «в [время] ем [еду]»."},{"front":"七時から働きます。","blanked":"七時___働きます。","particle":"から","explanation":"начальная точка времени","back":"しちじから はたらきます。\nРаботаю с 7 часов.\n• 七時から (しちじから) — с 7 часов\n• 働きます (はたらきます) — работаюГрамматика: [время] から [гл.] = «делаю [гл.] с [времени]».\nから — начальная точка времени."},{"front":"五時まで働きます。","blanked":"五時___働きます。","particle":"まで","explanation":"конечная точка времени (действие длится до этого момента)","back":"ごじまで はたらきます。\nРаботаю до 5 часов.\n• 五時まで (ごじまで) — до 5 часов\n• 働きます (はたらきます) — работаюГрамматика: [время] まで [гл.] = «делаю [гл.] до [времени]».\nまで — конечная точка времени (действие длится до этого момента)."},{"front":"毎日日本語をべんきょうします。","blanked":"毎日日本語___べんきょうします。","particle":"を","explanation":"Грамматика: [нареч. частоты] [объект] を [гл.] = «делаю [действие] с [объектом] с [частотой]»","back":"まいにち にほんごを べんきょうします。\nКаждый день изучаю японский.\n• 毎日 (まいにち) — каждый день\n• 日本語を (にほんごを) — японский язык (объект)\n• べんきょうします — учу / занимаюсьГрамматика: [нареч. частоты] [объект] を [гл.] = «делаю [действие] с [объектом] с [частотой]»."},{"front":"私は豚肉が好きです。","blanked":"私___豚肉が好きです。","particle":"は","explanation":"Грамматика: [тема] は [объект] が 好きです = «[тема] любит [объект]»","back":"わたしは ぶたにくが すきです。\nЯ люблю свинину.\n• 豚肉が (ぶたにくが) — свинина (объект любви)\n• 好きです (すきです) — нравится / люблюГрамматика: [тема] は [объект] が 好きです = «[тема] любит [объект]».\n豚肉 — свинина (豚 — свинья, 肉 — мясо)."},{"front":"私は肉を食べません。","blanked":"私は肉___食べません。","particle":"を","explanation":"частица объекта","back":"わたしは にくを たべません。\nЯ не ем мясо.\n• 肉を (にくを) — мясо (объект)\n• 食べません (たべません) — не ем (отриц. от 食べる)Грамматика: [тема] は [объект] を [гл. в отриц.] = «[тема] не делает [действие] с [объектом]».\nを — частица объекта.\n食べません — вежливое отрицание глагола 食べる."},{"front":"昼ごはんを食べます。","blanked":"昼ごはん___食べます。","particle":"を","explanation":"Грамматика: [еда] を 食べます = «ем [еду]»","back":"ひるごはんを たべます。\nЯ обедаю.\n• 昼ごはんを (ひるごはんを) — обед (дневной прием пищи)\n• 食べます (たべます) — емГрамматика: [еда] を 食べます = «ем [еду]»."},{"front":"ばんごはんを食べます。","blanked":"ばんごはん___食べます。","particle":"を","explanation":"Грамматика: [еда] を 食べます","back":"ばんごはんを たべます。\nЯ ужинаю.\n• ばんごはんを — ужин (вечерний прием пищи)\n• 食べます (たべます) — емГрамматика: [еда] を 食べます"},{"front":"ごはんを食べました。","blanked":"ごはん___食べました。","particle":"を","explanation":"Грамматика: [объект] を [гл. в прош.] = «сделал что-то с объектом»","back":"ごはんを たべました。\nЯ поел.\n• ごはんを — еду\n• 食べました — поел (прош. время от 食べる)Грамматика: [объект] を [гл. в прош.] = «сделал что-то с объектом»."},{"front":"コーヒーを飲みません。","blanked":"コーヒー___飲みません。","particle":"を","explanation":"Грамматика: [объект] を [гл. в отриц.] = «не делаю [действие] с [объектом]»","back":"コーヒーをのみません。\nЯ не пью кофе.\n• コーヒーを (こーひーを) — кофе (объект)\n• 飲みません (のみません) — не пьюГрамматика: [объект] を [гл. в отриц.] = «не делаю [действие] с [объектом]»."},{"front":"何を食べたいですか。","blanked":"何___食べたいですか。","particle":"を","explanation":"Грамматика: [объект] を [гл. в желательной форме] か = «хочешь сделать [действие] с [объектом]?»","back":"なにを たべたいですか。\nЧто ты хочешь поесть?\n• 何を (なにを) — что (объект)\n• 食べたいですか (たべたいですか) — хочешь поесть? (желание)Грамматика: [объект] を [гл. в желательной форме] か = «хочешь сделать [действие] с [объектом]?»."},{"front":"ラーメンを食べたいです。","blanked":"ラーメン___食べたいです。","particle":"を","explanation":"Грамматика: [объект] を [гл. в желательной форме] = «хочу сделать [действие] с [объектом]»","back":"ラーメンを たべたいです。\nЯ хочу поесть рамэн.\n• ラーメンを — рамэн (объект)\n• 食べたいです (たべたいです) — хочу поесть (желание)Грамматика: [объект] を [гл. в желательной форме] = «хочу сделать [действие] с [объектом]».\n食べたい — основа 食べ + たい.\nたい выражает желание, присоединяется к основе глагола (без ます)."},{"front":"今日は寒いです。","blanked":"今日___寒いです。","particle":"は","explanation":"Грамматика: [тема] は [прил.] です = «[тема] — [прил.]»","back":"きょうは さむいです。\nСегодня холодно.\n• 今日は (きょうは) — сегодня\n• 寒いです (さむいです) — холодноГрамматика: [тема] は [прил.] です = «[тема] — [прил.]».\n寒い — прилагательное «холодный» (о погоде / температуре)."},{"front":"雨がふっています。","blanked":"雨___ふっています。","particle":"が","explanation":"перед природными явлениями (дождь, снег, град)","back":"あめが ふっています。\nИдёт дождь.\n• 雨が (あめが) — дождь\n• ふっています — идёт / падает (длит. от 降る)Грамматика: [природное явление] が 降っています = «идёт [явление]».\nが — перед природными явлениями (дождь, снег, град).\n降る — глагол для осадков.\n～ています — показывает, что действие происходит прямо сейчас."},{"front":"雪がふっています。","blanked":"雪___ふっています。","particle":"が","explanation":"перед природными явлениями","back":"ゆきが ふっています。\nИдёт снег.\n• 雪 (ゆき) — снег\n• ふっています — идёт / падает (длит. от 降る)Грамматика: [природное явление] が 降っています = «идёт [явление]».\nが — перед природными явлениями"},{"front":"これはいくらですか。","blanked":"これ___いくらですか。","particle":"は","explanation":"Грамматика: [сущ.] は いくらですか = «сколько стоит [сущ.]?»","back":"これは いくらですか。\nСколько это стоит?\n• 这是 (これは) — это (тема)\n• いくらですか — сколько стоит? (вопрос о цене)Грамматика: [сущ.] は いくらですか = «сколько стоит [сущ.]?».\nいくら — вопросительное слово для цены."},{"front":"そのかばんはいくらですか。","blanked":"そのかばん___いくらですか。","particle":"は","explanation":"Грамматика: [сущ.] は いくらですか = «сколько стоит [сущ.]?»","back":"その かばんは いくらですか。\nСколько стоит та сумка?\n• そのかばんは — та сумка\n• いくらですか — сколько стоит?Грамматика: [сущ.] は いくらですか = «сколько стоит [сущ.]?».\nいくら — вопросительное слово для цены."},{"front":"電車で行きます。","blanked":"電車___行きます。","particle":"で","explanation":"частица, указывающая на средство передвижения или способ действия","back":"でんしゃで いきます。\nЕду на поезде.\n• 電車で (でんしゃで) — на поезде (средство передвижения)\n• 行きます (いきます) — еду / идуГрамматика: [средство] で [гл.] = «еду на [средстве]».\nで — частица, указывающая на средство передвижения или способ действия."},{"front":"自転車に乗るのが好きです。","blanked":"自転車に乗る___が好きです。","particle":"の","explanation":"превращает глагол в существительное","back":"じてんしゃに のるのが すきです。\nЯ люблю кататься на велосипеде.\n• 自転車に (じてんしゃに) — на велосипед (направление для 乗る)\n• 乗るのが (のるのが) — садиться / кататься (словар. ф. + の + が)\n• 好きです (すきです) — нравится / люблюГрамматика: [гл. в словар. ф.] のが 好きです = «люблю делать [действие]».\n乗る — садиться на транспорт / кататься.\nС 乗る используется частица に (на транспорт), а не を.\nの — превращает глагол в существительное."},{"front":"自転車で学校へ行きます。","blanked":"自転車___学校へ行きます。","particle":"で","explanation":"Грамматика: [средство] で [место] へ [гл.] = «еду на [средстве] в [место]»","back":"じてんしゃで がっこうへ いきます。\nЯ езжу в школу на велосипеде.\n• 自転車で (じてんしゃで) — на велосипеде (средство передвижения)\n• 学校へ (がっこうへ) — в школу (направление)\n• 行きます (いきます) — еду / хожуГрамматика: [средство] で [место] へ [гл.] = «еду на [средстве] в [место]»."},{"front":"家に帰ります。","blanked":"家___帰ります。","particle":"に","explanation":"Грамматика: [место] に 帰ります = «возвращаться в [место]». 帰る специально означает «возвращаться домой/к себе», а не просто «идти»","back":"いえに かえります。\nВозвращаюсь домой.\n• 家に (いえに) — домой\n• 帰ります (かえります) — возвращаюсьГрамматика: [место] に 帰ります = «возвращаться в [место]». 帰る специально означает «возвращаться домой/к себе», а не просто «идти»"},{"front":"駅まで歩きます。","blanked":"駅___歩きます。","particle":"まで","explanation":"Грамматика: [место] まで 歩きます = «иду пешком до [места]»","back":"えきまで あるきます。\nИду пешком до станции.\n• 駅まで — до станции (сущ. + まで = до)\n• 歩きます — иду пешкомГрамматика: [место] まで 歩きます = «иду пешком до [места]»."},{"front":"いっしょにえいがを見に行きます。","blanked":"いっしょにえいが___見に行きます。","particle":"を","explanation":"Грамматика: [объект] を [основа гл.] に 行きます = «идём, чтобы сделать [действие]»","back":"いっしょに えいがを みに いきます。\nМы вместе идём в кино.\n• いっしょに — вместе\n• えいがを — фильм (объект)\n• 見に行きます (みにいきます) — идём смотреть (цель)Грамматика: [объект] を [основа гл.] に 行きます = «идём, чтобы сделать [действие]»."},{"front":"友達と車で行きます。","blanked":"友達___車で行きます。","particle":"と","explanation":"Грамматика: [кто] と [средство] で [гл.] = «еду с [кем] на [чём]»","back":"ともだちと くるまで いきます。\nЯ еду на машине вместе с другом.\n• 友達と (ともだちと) — с другом (сущ. + と = вместе с)\n• 車で (くるまで) — на машине (сущ. + で = средство передвижения)\n• 行きます (いきます) — еду / идуГрамматика: [кто] と [средство] で [гл.] = «еду с [кем] на [чём]»."},{"front":"水曜日に自転車で店へ行きます。","blanked":"水曜日___自転車で店へ行きます。","particle":"に","explanation":"Грамматика: [время] に [средство] で [место] へ [гл.] = «в [время] еду на [средстве] в [место]»","back":"すいようびに じてんしゃで みせへ いきます。\nВ среду я поеду на велосипеде в магазин.\n• 水曜日に (すいようびに) — в среду\n• 自転車で (じてんしゃで) — на велосипеде (средство передвижения)\n• 店へ (みせへ) — в магазин (направление)\n• 行きます (いきます) — поедуГрамматика: [время] に [средство] で [место] へ [гл.] = «в [время] еду на [средстве] в [место]»."},{"front":"タクシーをよびたいです。","blanked":"タクシー___よびたいです。","particle":"を","explanation":"Грамматика: [объект] を [основа гл.] たいです = «хочу сделать [действие]»","back":"タクシーを よびたいです。\nЯ хочу вызвать такси.\n• タクシーを — такси (объект)\n• よびたいです — хочу вызвать (гл. よぶ + たい)Грамматика: [объект] を [основа гл.] たいです = «хочу сделать [действие]».\nよびたい — от よぶ (вызывать). Основа よび + たい."},{"front":"日本語をべんきょうしています。","blanked":"日本語___べんきょうしています。","particle":"を","explanation":"Грамматика: [объект] を [гл. в длит. форме] = «делаю [действие] (в процессе / как текущее состояние)»","back":"にほんごを べんきょうしています。\nЯ изучаю японский.\n• 日本語を (にほんごを) — японский\n• べんきょうしています — изучаю (длит. форма от 勉強する)Грамматика: [объект] を [гл. в длит. форме] = «делаю [действие] (в процессе / как текущее состояние)».\n勉強しています — показывает, что действие происходит в настоящем или является текущим состоянием."},{"front":"日本語はすこし話せます。","blanked":"日本語___すこし話せます。","particle":"は","explanation":"Грамматика: [сущ.] は [нареч.] [гл. в потенц. форме] = «[сущ.] могу сделать [нареч.]»","back":"にほんごは すこし はなせます。\nЯ немного говорю по-японски.\n• 日本語は (にほんごは) — японский (тема)\n• すこし — немного\n• 話せます (はなせます) — могу говорить (потенц. форма от 話す)Грамматика: [сущ.] は [нареч.] [гл. в потенц. форме] = «[сущ.] могу сделать [нареч.]».\n話せます — возможностная форма (умею / могу говорить)."},{"front":"日本語はまだ上手じゃありません。","blanked":"日本語___まだ上手じゃありません。","particle":"は","explanation":"Грамматика: [сущ.] は まだ [прил. в отриц.] = «[сущ.] пока ещё не [прил.]»","back":"にほんごは まだ じょうずじゃありません。\nЯ пока не очень хорошо говорю по-японски.\n• 日本語は (にほんごは) — японский (тема)\n• まだ — пока (ещё не)\n• 上手じゃありません (じょうずじゃありません) — не хорошо / не умело (отриц. от 上手です)Грамматика: [сущ.] は まだ [прил. в отриц.] = «[сущ.] пока ещё не [прил.]».\nまだ — «ещё не», всегда работает с отрицанием.\n上手じゃありません — вежливое отрицание от 上手です."},{"front":"このしごとは20分かかります。","blanked":"このしごと___20分かかります。","particle":"は","explanation":"Грамматика: [сущ.] は [время] かかります = «[сущ.] занимает [время]»","back":"このしごとは にじゅっぷん かかります。\nЭта работа займёт 20 минут.\n• このしごとは — эта работа\n• 20分 (にじゅっぷん) — 20 минут\n• かかります — занимает (время / деньги / усилия)Грамматика: [сущ.] は [время] かかります = «[сущ.] занимает [время]»."},{"front":"東京まで電車で1時間かかります。","blanked":"東京___電車で1時間かかります。","particle":"まで","explanation":"= до","back":"とうきょうまで でんしゃで いちじかん かかります。\nДо Токио на поезде час.\n• 東京まで — до Токио (сущ. + まで = до)\nまで = до\n• 電車で — на поезде (сущ. + で = на)\n• 1時間 — 1 час\n• かかります — занимает (время / деньги / усилия)Грамматика: [место] まで [средство] で [время] かかります = «до [места] на [средстве] занимает [время]»."},{"front":"しごとの前にごはんを食べます。","blanked":"しごと___前にごはんを食べます。","particle":"の","explanation":"Грамматика: [сущ.] の 前に [гл.] = «перед [сущ.] делаю [гл.]»","back":"しごとの まえに ごはんを たべます。\nПеред работой я ем.\n• しごとの前に (しごとのまえに) — перед работой\n• ごはんを — еду\n• たべます — емГрамматика: [сущ.] の 前に [гл.] = «перед [сущ.] делаю [гл.]».\n前に — «перед» (во времени), требует の после существительного."},{"front":"しごとの後で家に帰ります。","blanked":"しごと___後で家に帰ります。","particle":"の","explanation":"Грамматика:","back":"しごとの あとで いえに かえります。\nПосле работы я иду домой.\n• しごとの — работы (принадлежность)\n• 後で (あとで) — после (указывает на время)\n• 家に (いえに) — домой (направление)\n• 帰ります (かえります) — возвращаюсь \n[сущ] + の + 後で = «после [чего-то]»."},{"front":"しゃしんをとってもいいですか。","blanked":"しゃしん___とってもいいですか。","particle":"を","explanation":"Грамматика: [объект] を [гл. в て-форме] も いいですか = «можно ли сделать [действие]?»","back":"しゃしんを とっても いいですか。\nМожно сфотографировать?\n• しゃしんを — фото (объект)\n• とっても — снять (форма て от とる)\n• いいですか — можно? / хорошо?Грамматика: [объект] を [гл. в て-форме] も いいですか = «можно ли сделать [действие]?»."},{"front":"こうえんにこどもがたくさんいます。","blanked":"こうえん___こどもがたくさんいます。","particle":"に","explanation":"Грамматика: [место] に [одуш.] が [количество] います = «в [месте] есть [одуш.] в [количестве]»","back":"こうえんに こどもが たくさん います。\nВ парке много детей.\n• こうえんに — в парке\n• こどもが — дети\n• たくさん — много\n• います — находятся (для одуш.)Грамматика: [место] に [одуш.] が [количество] います = «в [месте] есть [одуш.] в [количестве]»."},{"front":"よくえいがを見ます。","blanked":"よくえいが___見ます。","particle":"を","explanation":"Грамматика: [нареч. частоты] [объект] を [гл.] = «[гл.] [объект] с [частотой]»","back":"よく えいがを みます。\nЯ часто смотрю фильмы.\n• よく — часто\n• えいがを — фильмы (объект)\n• 見ます (みます) — смотрюГрамматика: [нареч. частоты] [объект] を [гл.] = «[гл.] [объект] с [частотой]»."},{"front":"たまに魚を食べます。","blanked":"たまに魚___食べます。","particle":"を","explanation":"Грамматика: [нареч. частоты] [объект] を [гл.] = «[гл.] [объект] с [частотой]»","back":"たまに さかなを たべます。\nИногда я ем рыбу.\n• たまに — иногда\n• 魚を (さかなを) — рыбу\n• 食べます (たべます) — емГрамматика: [нареч. частоты] [объект] を [гл.] = «[гл.] [объект] с [частотой]»."},{"front":"雨だから家にいます。","blanked":"雨だ___家にいます。","particle":"から","explanation":"после существительного требует","back":"あめだから いえに います。\nЯ сижу дома, потому что дождь.\n• あめだから — потому что дождь (сущ. + だ + から)\n• いえに — дома\n• います — нахожусь (для одуш.)Грамматика: [сущ.] + だから + [результат] = «потому что [сущ.], …».\nから после существительного требует だ."},{"front":"今本を読んでいます。","blanked":"今本___読んでいます。","particle":"を","explanation":"Грамматика: [время] [объект] を [гл. в длит. форме] = «в [время] делаю [действие] (в процессе)»","back":"いま ほんを よんでいます。\nСейчас я читаю книгу.\n• 今 (いま) — сейчас\n• 本を (ほんを) — книгу (объект)\n• 読んでいます (よんでいます) — читаю (длит. от 読む)Грамматика: [время] [объект] を [гл. в длит. форме] = «в [время] делаю [действие] (в процессе)»."},{"front":"田中さんを知っています。","blanked":"田中さん___知っています。","particle":"を","explanation":"Грамматика: [кого-то] を 知っています = «знаю [кого-то]»","back":"たなかさんを しっています。\nЯ знаю господина Танаку.\n• 知っています (しっています) — знаю (длит. от 知る)Грамматика: [кого-то] を 知っています = «знаю [кого-то]»."},{"front":"あしたは雨だと思います。","blanked":"あしたは雨だ___思います。","particle":"と","explanation":"цитатная частица (как кавычки для мысли)","back":"あしたは あめだと おもいます。\nДумаю, завтра будет дождь.\n• あしたは — завтра\n• 雨だ (あめだ) — дождь (сущ. + だ)\n• と思います (とおもいます) — я думаю (цитата + 思う)Грамматика: [предложение] と 思います = «я думаю, что [предложение]»."},{"front":"どこかへ行きたいです。","blanked":"どこか___行きたいです。","particle":"へ","explanation":"частица направления (в сторону)","back":"どこかへ いきたいです。\nХочу куда-нибудь съездить.\n• どこか — «куда-то, куда-нибудь»\n• へ — частица направления (в сторону).\n• 行きたい — желательная форма от 行く."},{"front":"かみを二まいください。","blanked":"かみ___二まいください。","particle":"を","explanation":"Грамматика: [объект] を [число + счёт. суфф.] ください = «дайте, пожалуйста, [число] [объектов]»","back":"かみを にまい ください。\nДайте, пожалуйста, 2 листа бумаги.\n• かみを — бумагу (объект)\n• 二まい (にまい) — два (число + счёт. суфф. для плоских предметов)\n• ください — дайте, пожалуйста."},{"front":"ねこが二ひきいます。","blanked":"ねこ___二ひきいます。","particle":"が","explanation":"Грамматика: [сущ.] が [число + счёт. суфф.] います = «есть [число] [сущ.]» (для одушевлённых)","back":"ねこが にひき います。\nЕсть 2 кошки.\n• ねこが — кошки (подлежащее)\n• 二ひき (にひき) — две (для мелких животных)\n• います — есть (для одуш.)."},{"front":"車が一だいあります。","blanked":"車___一だいあります。","particle":"が","explanation":"Грамматика: [сущ.] が [число + счёт. суфф.] あります = «есть [число] [сущ.]»","back":"くるまが いちだい あります。\nЕсть 1 машина.\n• 車が (くるまが) — машина\n• 一だい (いちだい) — одна (для техники/транспорта)\n• あります — есть (для неодуш.)."},{"front":"くだものの中でりんごがいちばん好きです。","blanked":"くだものの中でりんご___いちばん好きです。","particle":"が","explanation":"Грамматика: [группа] の中で [сущ.] が いちばん [прил.] = «среди [группы] [сущ.] самый [прил.]»","back":"くだものの なかで りんごが いちばん すきです。\nИз фруктов яблоки я люблю больше всего.\n• くだものの中で (くだもののなかで) — среди фруктов\n• りんごが — яблоки\n• いちばん — самый / больше всего\n• 好きです — нравятся / люблю."},{"front":"友達は私に本をくれました。","blanked":"友達___私に本をくれました。","particle":"は","explanation":"Грамматика: [кто-то] は [мне] に [что] を くれました = «кто-то дал мне что-то»","back":"ともだちは わたしに ほんを くれました。\nДруг подарил мне книгу.\n• 友達は (ともだちは) — друг\n• 私に (わたしに) — мне\n• 本を (ほんを) — книгу\n• くれました — дал мне."},{"front":"私は友達にお金をもらいました。","blanked":"私___友達にお金をもらいました。","particle":"は","explanation":"Грамматика: [я] は [источник] に [объект] を もらいました = «я получил [объект] от [источника]»","back":"わたしは ともだちに おかねを もらいました。\nЯ получил деньги от друга.\n• 友達に (ともだちに) — от друга\n• お金を (おかねを) — деньги\n• もらいました — получил."},{"front":"母は妹にケーキをあげました。","blanked":"母___妹にケーキをあげました。","particle":"は","explanation":"Грамматика: [кто] は [кому] に [что] を あげました = «[кто] дал [что] [кому]»","back":"ははは いもうとに ケーキを あげました。\nМама подарила торт младшей сестре.\n• 母は (ははは) — мама\n• 妹に (いもうとに) — младшей сестре\n• ケーキを — торт\n• あげました — дала."},{"front":"先生は私に本をくれました。","blanked":"先生___私に本をくれました。","particle":"は","explanation":"Частица «は»","back":"せんせいは わたしに ほんを くれました。\nУчитель дал мне книгу.\n• 先生は — учитель\n• くれました — дал мне."},{"front":"すみません、駅はどこですか。","blanked":"すみません、駅___どこですか。","particle":"は","explanation":"Грамматика: [сущ.] は どこですか = «где [сущ.]?».вежливый вопрос о местоположении","back":"すみません、えきは どこですか。\nИзвините, где станция?\n• すみません — извините\n• 駅は (えきは) — станция\n• どこですか — где?"},{"front":"店へどうやって行きますか。","blanked":"店___どうやって行きますか。","particle":"へ","explanation":"частица направления","back":"みせへ どうやって いきますか。\nКак пройти в магазин?\n• 店へ (みせへ) — в магазин (направление)\n• どうやって — как? каким образом?\n• 行きますか (いきますか) — идти?"},{"front":"つぎのかどを右にまがってください。","blanked":"つぎのかど___右にまがってください。","particle":"を","explanation":"Грамматика: [место] を [направление] に まがってください = «поверните [направление] на [месте]»","back":"つぎの かどを みぎに まがってください。\nНа следующем углу поверните направо пожалуйста.\n• つぎのかどを — следующий угол\n• 右に (みぎに) — направо\n• まがってください — поверните, пожалуйста."},{"front":"コンビニは何時にしまりますか。","blanked":"コンビニは何時___しまりますか。","particle":"に","explanation":"частица конкретного момента времени","back":"コンビニは なんじに しまりますか。\nВо сколько закроется комбини?\n• コンビニは — комбини\n• 何時に (なんじに) — во сколько\n• しまりますか — закроется?"},{"front":"このちかくにトイレがありますか。","blanked":"このちかく___トイレがありますか。","particle":"に","explanation":"Грамматика: [место] に [сущ.] が ありますか = «есть ли [сущ.] в [месте]?»","back":"この ちかくに トイレが ありますか。\nЕсть поблизости туалет?\n• このちかくに — поблизости (место)\n• トイレが — туалет\n• ありますか — есть?"},{"front":"パソコンで日本語を勉強します。","blanked":"パソコン___日本語を勉強します。","particle":"で","explanation":"указывает на средство или способ действия","back":"パソコンで にほんごを べんきょうします。\nЯ учу японский на компьютере.\n• パソコンで — на компьютере (средство)\n• 日本語を (にほんごを) — японский\n• 勉強します — учу."},{"front":"毎朝ニュースを見ます。","blanked":"毎朝ニュース___見ます。","particle":"を","explanation":"Грамматика: [нареч. частоты] [объект] を [гл.] = «с [частотой] делаю [действие] с [объектом]»","back":"まいあさ ニュースを みます。\nКаждое утро смотрю новости.\n• 毎朝 (まいあさ) — каждое утро\n• ニュースを — новости\n• 見ます (みます) — смотрю."},{"front":"デパートで服を買いました。","blanked":"デパート___服を買いました。","particle":"で","explanation":"Грамматика: [место] で [объект] を [гл. в прош.] = «сделал(а) [действие] с [объектом] в [месте]»","back":"デパートで ふくを かいました。\nЯ купил одежду в универмаге.\n• デパートで — в универмаге\n• 服を (ふくを) — одежду\n• 買いました — купил(а)."},{"front":"スーパーは駅の近くにあります。","blanked":"スーパーは駅___近くにあります。","particle":"の","explanation":"связывает","back":"スーパーは えきの ちかくに あります。\nСупермаркет рядом со станцией.\n• スーパーは — супермаркет\n• 駅の近くに (えきのちかくに) — рядом со станцией\n• あります — находится."},{"front":"このレストランはおいしいです。","blanked":"このレストラン___おいしいです。","particle":"は","explanation":"Грамматика: [сущ.] は [прил.] です = «[сущ.] — [прил.]»","back":"この レストランは おいしいです。\nЭтот ресторан вкусный (готовят вкусно).\n• このレストランは — этот ресторан\n• おいしいです — вкусный."},{"front":"ホテルに二はくとまります。","blanked":"ホテル___二はくとまります。","particle":"に","explanation":"Грамматика: [место] に [число + はく] とまります = «остановлюсь в [месте] на [число] ночей»","back":"ホテルに にはく とまります。\nЯ остановлюсь в отеле на 2 ночи.\n• ホテルに — в отеле\n• 二はく (にはく) — 2 ночи\n• とまります — остановлюсь."},{"front":"エレベーターで五かいへ行きます。","blanked":"エレベーター___五かいへ行きます。","particle":"で","explanation":"Грамматика: [средство] で [место] へ 行きます = «еду на [средстве] в [место]»","back":"エレベーターで ごかいへ いきます。\nНа лифте поднимаюсь на 5 этаж.\n• エレベーターで — на лифте\n• 五かいへ (ごかいへ) — на пятый этаж\n• 行きます — еду."},{"front":"トイレはどこですか。","blanked":"トイレ___どこですか。","particle":"は","explanation":"Грамматика: [сущ.] は どこですか = «где [сущ.]?»","back":"トイレは どこですか。\nГде туалет?\n• トイレは — туалет\n• どこですか — где?"},{"front":"毎朝シャワーをあびます。","blanked":"毎朝シャワー___あびます。","particle":"を","explanation":"Грамматика: [нареч. частоты] [объект] を [гл.] = «[гл.] [объект] с [частотой]»","back":"まいあさ シャワーを あびます。\nКаждое утро принимаю душ.\n• 毎朝 (まいあさ) — каждое утро\n• シャワーを — душ\n• あびます — принимаю."},{"front":"私はアパートに住んでいます。","blanked":"私はアパート___住んでいます。","particle":"に","explanation":"Грамматика: [место] に 住んでいます = «живу в [месте]»","back":"わたしは アパートに すんでいます。\nЯ живу в квартире.\n• アパートに — в квартире\n• 住んでいます (すんでいます) — живу."},{"front":"ノートに名前を書いてください。","blanked":"ノート___名前を書いてください。","particle":"に","explanation":"место, куда направлено действие","back":"ノートに なまえを かいてください。\nНапишите своё имя в тетради.\n• ノートに — в тетрадь\n• 名前を (なまえを) — имя\n• 書いてください — напишите, пожалуйста."},{"front":"ボールペンで書いてください。","blanked":"ボールペン___書いてください。","particle":"で","explanation":"Грамматика: [инструмент] で [гл. в て-форме] ください = «пожалуйста, сделайте [действие] с помощью [инструмента]»","back":"ボールペンで かいてください。\nПишите шариковой ручкой.\n• ボールペンで — шариковой ручкой\n• 書いてください — напишите, пожалуйста."},{"front":"きのう新しいTシャツを買いました。","blanked":"きのう新しいTシャツ___買いました。","particle":"を","explanation":"Грамматика: [время] [прил.] [сущ.] を [гл. в прош.] = «в [время] сделал [действие] с [прил.] [сущ.]»","back":"きのう あたらしい Tシャツを かいました。\nВчера я купил новую футболку.\n• きのう — вчера\n• 新しい (あたらしい) — новый\n• Tシャツを — футболку\n• 買いました — купил."},{"front":"今日は白いネクタイをしています。","blanked":"今日は白いネクタイ___しています。","particle":"を","explanation":"Грамматика: [цвет] + い + [одежда/аксессуар] を しています = «на мне [одежда/аксессуар] [цвета]»","back":"きょうは しろい ネクタイを しています。\nСегодня я в белом галстуке.\n• 今日は (きょうは) — сегодня\n• 白い (しろい) — белый\n• ネクタイを — галстук\n• しています — ношу."},{"front":"コップに水を入れてください。","blanked":"コップ___水を入れてください。","particle":"に","explanation":"Грамматика: [место] に [объект] を [гл. в て-форме] ください = «пожалуйста, [действие] [объект] в [место]»","back":"コップに みずを いれてください。\nНалейте воду в стакан пожалуйста.\n• コップに — в стакан\n• 水を (みずを) — воду\n• 入れて(いれて) — налейте."},{"front":"フォークとスプーンを使います。","blanked":"フォーク___スプーンを使います。","particle":"と","explanation":"Грамматика: [сущ.] と [сущ.] を + 使います = «использую [это] и [это]»","back":"フォークと スプーンを つかいます。\nЯ пользуюсь вилкой и ложкой.\n• フォークと — вилка и\n• スプーン — ложка\n• を使います — использую."},{"front":"駅まで100メートルぐらいです。","blanked":"駅___100メートルぐらいです。","particle":"まで","explanation":"до (частица предела)","back":"えきまで ひゃくメートル ぐらいです。\nДо станции около 100 метров.\n• 駅 (えき) — станция\n• まで — до\n• 100メートル — 100 метров\n• ぐらい — около, примерно."},{"front":"いつもコーヒーを飲みます。","blanked":"いつもコーヒー___飲みます。","particle":"を","explanation":"Грамматика: [нареч. частоты] [объект] を [гл.] = «[гл.] [объект] с [частотой]»","back":"いつも コーヒーを のみます。\nЯ всегда пью кофе.\n• いつも — всегда\n• コーヒーを — кофе\n• 飲みます — пью."},{"front":"コーヒーか紅茶を飲みます。","blanked":"コーヒーか紅茶___飲みます。","particle":"を","explanation":"частица объекта, относится ко всему выбору","back":"コーヒーか こうちゃを のみます。\nЯ выпью кофе или чай.\n• コーヒーか — кофе или\n• 紅茶を (こうちゃを) — черный чай\n• 飲みます — выпью."},{"front":"作り方がわかりません。","blanked":"作り方___わかりません。","particle":"が","explanation":"частица, выделяет тему","back":"つくりかたが わかりません。\nЯ не знаю, как это делается.\n• 作り方 (つくりかた) — способ приготовления\n• が — частица темы\n• わかりません — не понимаю."},{"front":"宿題をしなくちゃ。","blanked":"宿題___しなくちゃ。","particle":"を","explanation":"Грамматика: [объект] を [гл. в отриц. форме + くちゃ] = «надо сделать [действие]» (разговорное долженствование)","back":"しゅくだいを しなくちゃ。\nНадо сделать домашку.\n• 宿題を (しゅくだいを) — домашнее задание\n• しなくちゃ — надо сделать."},{"front":"私はこれにします。","blanked":"私はこれ___します。","particle":"に","explanation":"указывает на выбор. Часто используется в кафе / ресторане при заказе","back":"わたしは これに します。\nЯ выберу это.\n• これに — на этом (выбор)\n• します — делаю / выбираю."},{"front":"コーヒーにします。","blanked":"コーヒー___します。","particle":"に","explanation":"указывает на выбранный вариант","back":"コーヒーに します。\nЯ закажу кофе.\n• コーヒーに — на кофе (выбор)\n• します — выбираю / решаю."},{"front":"歌を歌うのが下手です。","blanked":"歌を歌う___が下手です。","particle":"の","explanation":"превращает глагол в существительное","back":"うたを うたうのが へたです。\nУ меня плохо получается петь.\n• 歌を (うたを) — песню\n• 歌うのが (うたうのが) — петь\n• 下手です (へたです) — плохо / неумело."},{"front":"ドアが閉めてあります。","blanked":"ドア___閉めてあります。","particle":"が","explanation":"Грамматика: [объект] が [他動詞 て-form] あります = «[объект] находится в состоянии результата действия»","back":"ドアが しめてあります。\nДверь закрыта (кто-то заранее закрыл).\n• ドアが — дверь\n• 閉めてあります (しめてあります) — закрыта."},{"front":"窓が開けてあります。","blanked":"窓___開けてあります。","particle":"が","explanation":"Грамматика: [объект] が [他動詞 て-форма] あります = «[объект] находится в состоянии результата действия»","back":"まどが あけてあります。\nОкно открыто (заранее кто-то открыл).\n• 窓が (まどが) — окно\n• 開けてあります (あけてあります) — открыто."},{"front":"今日はとても暑いです。","blanked":"今日___とても暑いです。","particle":"は","explanation":"Грамматика: [сущ.] は [нареч.] [прил.] です = «[сущ.] [нареч.] [прил.]»","back":"きょうは とても あついです。\nСегодня очень жарко.\n• 今日は — сегодня\n• とても — очень\n• 暑いです — жарко."},{"front":"明日はどうですか。","blanked":"明日___どうですか。","particle":"は","explanation":"Грамматика: [время] は どうですか = «как насчёт [времени]?»","back":"あしたは どうですか。\nА как насчёт завтра?\n• 明日は (あしたは) — завтра\n• どうですか — как?"},{"front":"机の上に本やペンがあります。","blanked":"机の上に本___ペンがあります。","particle":"や","explanation":"неполный список (в отличие от と)","back":"つくえの うえに ほんや ペンが あります。\nНа столе есть книга, ручка и (что-то ещё).\n• 机の上に (つくえのうえに) — на столе\n• 本やペン — книга, ручка и др.\n• があります — есть."},{"front":"冷蔵庫に卵や牛乳があります。","blanked":"冷蔵庫___卵や牛乳があります。","particle":"に","explanation":"Грамматика: [место] に [сущ.] や [сущ.] が あります = «в [месте] есть [сущ.], [сущ.] и т.д.»","back":"れいぞうこに たまごや ぎゅうにゅうが あります。\nВ холодильнике есть яйца, молоко и т.д.\n• 冷蔵庫に (れいぞうこに) — в холодильнике\n• 卵や牛乳 — яйца, молоко\n• があります — есть."},{"front":"北海道は日本の北にあります。","blanked":"北海道___日本の北にあります。","particle":"は","explanation":"Грамматика: [место А] は [место Б] の [сторона] に あります = «А находится к [стороне] от Б»","back":"ほっかいどうは にほんの きたに あります。\nХоккайдо находится на севере Японии.\n• 北海道は (ほっかいどうは) — Хоккайдо\n• 日本の北に (にほんのきたに) — к северу от Японии\n• あります — находится."},{"front":"沖縄は日本の南にあります。","blanked":"沖縄___日本の南にあります。","particle":"は","explanation":"Грамматика: [место А] は [место Б] の [сторона] に あります = «А находится к [стороне] от Б»","back":"おきなわは にほんの みなみに あります。\nОкинава находится на юге Японии.\n• おきなわは — Окинава\n• にほんの — Японии\n• みなみに — на юге\n• あります — находится."},{"front":"東京は日本の東にあります。","blanked":"東京___日本の東にあります。","particle":"は","explanation":"Грамматика: [место А] は [место Б] の [сторона] に あります = «А находится к [стороне] от Б»","back":"とうきょうは にほんの ひがしに あります。\nТокио находится на востоке Японии.\n• 東京は (とうきょうは) — Токио\n• 日本の東に (にほんのひがしに) — на востоке Японии\n• あります — находится."},{"front":"大阪は東京の西にあります。","blanked":"大阪___東京の西にあります。","particle":"は","explanation":"Грамматика: [место А] は [место Б] の [сторона] に あります = «А находится к [стороне] от Б»","back":"おおさかは とうきょうの にしに あります。\nОсака находится к западу от Токио.\n• 大阪は (おおさかは) — Осака\n• 東京の西に (とうきょうのにしに) — к западу от Токио\n• あります — находится."},{"front":"銀行はスーパーの東にあります。","blanked":"銀行はスーパー___東にあります。","particle":"の","explanation":"связывает объект и сторону света","back":"ぎんこうは スーパーの ひがしに あります。\nБанк находится к востоку от супермаркета.\n• ぎんこうは — банк\n• スーパーの — супермаркета\n• ひがしに — к востоку\n• あります — находится."},{"front":"猫は机の下にいます。","blanked":"猫___机の下にいます。","particle":"は","explanation":"Грамматика: [тема] は [место] に います = «[тема] находится в [месте]» (для одушевлённых)","back":"ねこは つくえの したに います。\nКот сидит под столом.\n• 猫は (ねこは) — кот\n• 机の下に (つくえのしたに) — под столом\n• います — находится."},{"front":"机の上にジュースがあります。","blanked":"机の上___ジュースがあります。","particle":"に","explanation":"Грамматика: [место] に [неодуш.] が あります = «в [месте] находится [неодуш.]»","back":"つくえの うえに ジュースが あります。\nНа столе стоит сок.\n• つくえの うえに — на столе\n• ジュースが — сок\n• あります — находится."},{"front":"犬は木の前にいます。","blanked":"犬___木の前にいます。","particle":"は","explanation":"Грамматика: [тема] は [место] に います = «[тема] находится в [месте]» (для одушевлённых)","back":"いぬは きの まえに います。\nСобака сидит перед деревом.\n• 犬は (いぬは) — собака\n• 木の前に (きのまえに) — перед деревом\n• います — находится."},{"front":"車は家の後ろにあります。","blanked":"車___家の後ろにあります。","particle":"は","explanation":"Грамматика: [тема] は [место] に あります = «[тема] находится в [месте]» (для неодушевлённых)","back":"くるまは いえの うしろに あります。\nМашина стоит за домом.\n• 車は (くるまは) — машина\n• 家の後ろに (いえのうしろに) — за домом\n• あります — находится."},{"front":"銀行は病院の隣にあります。","blanked":"銀行___病院の隣にあります。","particle":"は","explanation":"Грамматика: [место А] は [место Б] の 隣に あります = «А находится рядом с Б»","back":"ぎんこうは びょういんの となりに あります。\nБанк находится рядом с больницей.\n• 銀行は (ぎんこうは) — банк\n• 病院の隣に (びょういんのとなりに) — рядом с больницей\n• あります — находится."},{"front":"猫はいすの横にいます。","blanked":"猫___いすの横にいます。","particle":"は","explanation":"Грамматика: [тема] は [место] に います = «[тема] находится в [месте]» (для одушевлённых)","back":"ねこは いすの よこに います。\nКот сидит сбоку от стула.\n• 猫は (ねこは) — кошка\n• いすの横に (いすのよこに) — рядом со стулом\n• います — находится."},{"front":"テーブルの上にコーヒーとジュースがあります。","blanked":"テーブルの上にコーヒー___ジュースがあります。","particle":"と","explanation":"полный список (в отличие от や)","back":"テーブルの うえに コーヒーと ジュースが あります。\nНа столе стоят кофе и сок.\n• テーブルの上に — на столе\n• コーヒーとジュースが — кофе и сок\n• あります — есть."},{"front":"私はレストランでピザを食べました。","blanked":"私___レストランでピザを食べました。","particle":"は","explanation":"Грамматика: [тема] は [место] で [объект] を [гл. в прош.] = «[тема] сделал [действие] с [объектом] в [месте]»","back":"わたしは レストランで ピザを たべました。\nЯ поел пиццу в ресторане.\n• レストランで — в ресторане\n• ピザを — пиццу\n• 食べました (たべました) — поел."},{"front":"デパートでシャツを買いました。","blanked":"デパート___シャツを買いました。","particle":"で","explanation":"Грамматика: [место] で [объект] を [гл. в прош.] = «сделал [действие] с [объектом] в [месте]»","back":"デパートで シャツを かいました。\nЯ купил рубашку в универмаге.\n• デパートで — в универмаге\n• シャツを — рубашку\n• 買いました — купил."},{"front":"ホテルはとても静かです。","blanked":"ホテル___とても静かです。","particle":"は","explanation":"Грамматика: [сущ.] は [нареч.] [な-прил.] です = «[сущ.] [нареч.] [прил.]»","back":"ホテルは とても しずかです。\nОтель очень тихий.\n• ホテルは — отель\n• とても — очень\n• 静かです (しずかです) — тихий."},{"front":"私はコンピューターゲームが好きです。","blanked":"私___コンピューターゲームが好きです。","particle":"は","explanation":"Грамматика: [тема] は [объект] が 好きです = «[тема] любит [объект]»","back":"わたしは コンピューターゲームが すきです。\nМне нравятся компьютерные игры.\n• コンピューターゲームが — компьютерные игры\n• 好きです (すきです) — нравятся."},{"front":"猫は足が黒いです。","blanked":"猫___足が黒いです。","particle":"は","explanation":"целое (кошка)","back":"ねこは あしが くろいです。\nУ кошки чёрные лапы.\n• 猫は (ねこは) — кошка\n• 足が (あしが) — лапы\n• 黒いです (くろいです) — чёрные."},{"front":"象は鼻が長いです。","blanked":"象___鼻が長いです。","particle":"は","explanation":"целое (слон)","back":"ぞうは はなが ながいです。\nУ слона длинный хобот.\n• 象は (ぞうは) — слон\n• 鼻 (はな) — хобот\n• 長いです (ながいです) — длинный."},{"front":"キリンは首が長いです。","blanked":"キリン___首が長いです。","particle":"は","explanation":"= целое","back":"キリンは くびが ながいです。\nУ жирафа длинная шея.\n• キリンは — жираф\n• くびが — шея\n• ながいです — длинная."},{"front":"私は目が大きいです。","blanked":"私___目が大きいです。","particle":"は","explanation":"Частица «は»","back":"わたしは めが おおきいです。\nУ меня большие глаза.\n• 私は — я\n• 目が (めが) — глаза\n• 大きいです — большие."},{"front":"彼女はかみが長いです。","blanked":"彼女___かみが長いです。","particle":"は","explanation":"тема (она)","back":"かのじょは かみが ながいです。\nУ неё длинные волосы.\n• 彼女は (かのじょは) — она\n• かみ — волосы\n• 長いです — длинные."},{"front":"日本語はぶんぽうが むずかしいです。","blanked":"日本語___ぶんぽうが むずかしいです。","particle":"は","explanation":"целое (японский язык)","back":"にほんごは ぶんぽうが むずかしいです。\nВ японском языке сложная грамматика.\n• 日本語は (にほんごは) — японский\n• ぶんぽうが — грамматика\n• むずかしいです — сложная."},{"front":"お名前は何ですか。","blanked":"お名前___何ですか。","particle":"は","explanation":"Грамматика: お+[сущ.] は 何ですか = «вежливо «что такое ваше [сущ.]?»»","back":"おなまえは なんですか。\nКак вас зовут? (вежливо)\n• お名前は (おなまえは) — ваше имя\n• 何ですか (なんですか) — что?"},{"front":"今は3Dキャラクターアーティストです。","blanked":"今___3Dキャラクターアーティストです。","particle":"は","explanation":"Грамматика: [время] は [сущ.] です = «в [время] я — [сущ.]»","back":"いまは スリーディー キャラクター アーティストです。\nСейчас я 3D-художник по персонажам.\n• 今は (いまは) — сейчас\n• 3Dキャラクターアーティストです — я 3D-художник."},{"front":"今は3Dキャラクターを作っています。","blanked":"今___3Dキャラクターを作っています。","particle":"は","explanation":"Грамматика: [тема] は [объект] を [гл. в длит. форме] = «[тема] сейчас делает [объект]»","back":"いまは スリーディー キャラクターを つくっています。\nСейчас я создаю 3D-персонажей.\n• 今は (いまは) — сейчас\n• 3Dキャラクターを — 3D-персонажей\n• 作っています — создаю."},{"front":"今日は休みです。","blanked":"今日___休みです。","particle":"は","explanation":"Грамматика: [время] は [сущ.] です = «в [время] — [сущ.]»","back":"きょうは やすみです。\nСегодня у меня выходной.\n• 今日は (きょうは) — сегодня\n• 休みです (やすみです) — выходной."},{"front":"毎朝コーヒーを飲みます。","blanked":"毎朝コーヒー___飲みます。","particle":"を","explanation":"отмечает то, что пьют или едят","back":"まいあさ コーヒーを のみます。\nКаждое утро пью кофе.\n• 毎朝 (まいあさ) — каждое утро\n• コーヒーを — кофе\n• 飲みます (のみます) — пью."},{"front":"今日は働きません。","blanked":"今日___働きません。","particle":"は","explanation":"Грамматика: [тема] は 働きません = «[тема] сегодня не работает»","back":"きょうは はたらきません。\nСегодня не работаю.\n• 今日は (きょうは) — сегодня\n• 働きません (はたらきません) — не работаю."},{"front":"私は魚が好きです。","blanked":"私___魚が好きです。","particle":"は","explanation":"Грамматика: [тема] は [объект] が 好きです = «[тема] любит [объект]»","back":"わたしは さかなが すきです。\nЯ люблю рыбу.\n• 私は (わたしは) — я\n• 魚が (さかなが) — рыбу\n• 好きです (すきです) — люблю."},{"front":"朝ごはんを食べます。","blanked":"朝ごはん___食べます。","particle":"を","explanation":"отмечает то, что едят","back":"あさごはんを たべます。\nЯ завтракаю.\n• 朝ごはんを (あさごはんを) — завтрак\n• 食べます (たべます) — ем."},{"front":"たまごを二つ食べました。","blanked":"たまご___二つ食べました。","particle":"を","explanation":"Грамматика: [объект] を [число]つ [гл. в прош.] = «сделал [действие] с [числом] штук [объекта]»","back":"たまごを ふたつ たべました。\nЯ съел два яйца.\n• たまごを — яйца\n• 二つ (ふたつ) — два (шт.)\n• 食べました (たべました) — съе function loadMistakes(){
  try{
    const raw = localStorage.getItem(MISTAKES_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function saveMistakes(ids){
  try{ localStorage.setItem(MISTAKES_KEY, JSON.stringify(ids)); }catch(e){}
}
let mistakeIds = loadMistakes();
function addMistake(id){
  if(!mistakeIds.includes(id)){
    mistakeIds.push(id);
    saveMistakes(mistakeIds);
  }
}
function removeMistake(id){
  const idx = mistakeIds.indexOf(id);
  if(idx !== -1){
    mistakeIds.splice(idx,1);
    saveMistakes(mistakeIds);
  }
}

const BLOCKS = [
  { id: 'b1', label: 'Блок 1\nは・が・を・の・も', particles: ['は','が','を','の','も'] },
  { id: 'b2', label: 'Блок 2\nに・で・へ・から・まで', particles: ['に','で','へ','から','まで'] },
  { id: 'b3', label: 'Блок 3\nと・や', particles: ['と','や'] },
  { id: 'b4', label: 'Блок 4\nвсе вместе', particles: ['は','が','を','の','も','に','で','へ','から','まで','と','や'] },
  { id: 'b5', label: 'Блок 5\nОшибки', mistakes: true }
];
const ALL_PARTICLES = ['は','が','を','の','も','に','で','へ','から','まで','と','や'];

let currentBlock = BLOCKS[0];
let questions = [];
let qIndex = 0;
let score = 0;
let answered = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let cachedVoices = [];
function loadVoices(){
  cachedVoices = window.speechSynthesis.getVoices();
}
loadVoices();
if(typeof window.speechSynthesis.onvoiceschanged !== 'undefined'){
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 0.85;
    const voices = cachedVoices.length ? cachedVoices : window.speechSynthesis.getVoices();
    const kyoko = voices.find(v => v.name.toLowerCase().includes('kyoko'));
    if(kyoko){
      u.voice = kyoko;
    }
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function buildOptions(item, blockParticles){
  const correct = item.particle;
  const pool = blockParticles.filter(p=>p!==correct);
  let distractors;
  if(pool.length >= 3){
    distractors = shuffle(pool).slice(0,3);
  } else {
    distractors = shuffle(pool);
    const extra = shuffle(ALL_PARTICLES.filter(p=>p!==correct && !distractors.includes(p)));
    while(distractors.length < 3 && extra.length){
      distractors.push(extra.pop());
    }
  }
  return shuffle([correct, ...distractors]);
}

function renderBlockTabs(){
  const container = document.getElementById('blocks');
  container.innerHTML = '';
  BLOCKS.forEach(b=>{
    const btn = document.createElement('button');
    btn.className = 'block-btn' + (b.id===currentBlock.id ? ' active' : '') + (b.mistakes ? ' mistakes-btn' : '');
    let label = b.label;
    if(b.mistakes){ label = label + ' (' + mistakeIds.length + ')'; }
    btn.innerHTML = label.split('\n').join('<br>');
    btn.addEventListener('click', ()=>{
      currentBlock = b;
      startBlock();
    });
    container.appendChild(btn);
  });
}

function startBlock(){
  renderBlockTabs();
  let pool;
  if(currentBlock.mistakes){
    pool = QUIZ_DATA.filter(d => mistakeIds.includes(d.id));
  } else {
    pool = QUIZ_DATA.filter(d => currentBlock.particles.includes(d.particle));
  }
  questions = shuffle(pool);
  qIndex = 0;
  score = 0;
  document.getElementById('qTotal').textContent = questions.length;
  document.getElementById('qScore').textContent = '0';
  renderQuestion();
}

function parseBack(raw) {
  if (!raw) return { kana: '', translation: '', vocab: [], grammar: '' };
  const lines = raw.split('\n');
  const kana = (lines[0] || '').trim();
  const translation = (lines[1] || '').trim();
  const rest = lines.slice(2).join('\n');
  
  let vocabText = rest;
  let grammarText = '';
  const gIdx = rest.indexOf('Грамматика');
  if (gIdx !== -1) {
    vocabText = rest.slice(0, gIdx);
    grammarText = rest.slice(gIdx).trim();
  }
  
  const vocab = vocabText
    .split('\n')
    .map(s => s.trim())
    .filter(s => s.length > 0);
    
  return { kana, translation, vocab, grammar: grammarText };
}

function renderExplanationHtml(item) {
  const parsed = parseBack(item.back);
  let html = '';
  if (parsed.kana) {
    html += '<div class="fb-kana">' + escapeHtml(parsed.kana) + '</div>';
  }
  if (parsed.translation) {
    html += '<div class="fb-translation">' + escapeHtml(parsed.translation) + '</div>';
  }
  if (parsed.vocab && parsed.vocab.length > 0) {
    html += '<div class="fb-vocab">' + parsed.vocab.map(escapeHtml).join('<br>') + '</div>';
  }
  if (parsed.grammar) {
    html += '<div class="fb-grammar">' + escapeHtml(parsed.grammar) + '</div>';
  }
  return html;
}

function renderQuestion(){
  answered = false;
  document.getElementById('qNum').textContent = Math.min(qIndex+1, questions.length || 1);
  document.getElementById('progressFill').style.width = (questions.length ? Math.round((qIndex)/questions.length*100) : 0) + '%';

  const area = document.getElementById('quizArea');

  if(questions.length === 0 && currentBlock.mistakes){
    area.innerHTML = '<div class="empty-mistakes">Пока нет ошибок 🎉<br>Проходите блоки 1–4, и сюда будут попадать вопросы, где вы ошиблись — для отдельной тренировки.</div>';
    document.getElementById('qTotal').textContent = 0;
    document.getElementById('qNum').textContent = 0;
    return;
  }

  if(qIndex >= questions.length){
    renderSummary();
    return;
  }

  const item = questions[qIndex];
  const blockParticles = currentBlock.mistakes ? ALL_PARTICLES : currentBlock.particles;
  const options = buildOptions(item, blockParticles);

  area.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'sentence-card';
  card.innerHTML = '<div class="sentence-jp">' + escapeHtml(item.blanked).replace('___', '<span class="blank">___</span>') + '</div>';
  area.appendChild(card);

  const optionsWrap = document.createElement('div');
  optionsWrap.className = 'options';
  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.addEventListener('click', ()=> onAnswer(opt, item, optionsWrap));
    optionsWrap.appendChild(btn);
  });
  area.appendChild(optionsWrap);

  const feedback = document.createElement('div');
  feedback.className = 'feedback-panel';
  feedback.id = 'feedbackPanel';
  area.appendChild(feedback);

  const nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.id = 'nextBtn';
  nextBtn.textContent = 'Дальше →';
  nextBtn.addEventListener('click', ()=>{
    qIndex++;
    renderQuestion();
  });
  area.appendChild(nextBtn);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function onAnswer(chosen, item, optionsWrap){
  if(answered) return;
  answered = true;

  const isCorrect = chosen === item.particle;
  if(isCorrect){
    score++;
    removeMistake(item.id);
  } else {
    addMistake(item.id);
  }
  document.getElementById('qScore').textContent = score;
  renderBlockTabs();

  Array.from(optionsWrap.children).forEach(btn=>{
    btn.classList.add('disabled');
    if(btn.textContent === item.particle) btn.classList.add('correct');
    else if(btn.textContent === chosen) btn.classList.add('wrong');
  });

  const feedback = document.getElementById('feedbackPanel');
  feedback.classList.add('show');

  feedback.innerHTML =
    '<div class="feedback-head">' +
      '<div class="feedback-title ' + (isCorrect ? 'ok' : 'bad') + '">' + (isCorrect ? 'Верно!' : 'Неверно') + ' Правильная частица — «' + item.particle + '»</div>' +
      '<button class="replay-btn" id="replayBtn" title="Прослушать ещё раз">🔊</button>' +
    '</div>' +
    (item.explanation ? '<div class="feedback-rule">' + escapeHtml(item.explanation) + '</div>' : '') +
    renderExplanationHtml(item);

  document.getElementById('replayBtn').addEventListener('click', ()=> speak(item.front));
  document.getElementById('nextBtn').classList.add('show');
  speak(item.front);
}

function renderSummary(){
  document.getElementById('progressFill').style.width = '100%';
  const area = document.getElementById('quizArea');
  const pct = questions.length ? Math.round(score/questions.length*100) : 0;
  area.innerHTML =
    '<div class="summary">' +
      '<h2>Блок пройден!</h2>' +
      '<p>Правильных ответов: ' + score + ' из ' + questions.length + ' (' + pct + '%)</p>' +
      '<button class="restart-btn" id="restartBtn">Пройти ещё раз</button>' +
    '</div>';
  document.getElementById('restartBtn').addEventListener('click', startBlock);
}

startBlock();
</script>
