<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Тренажёр Японских Прилагательных (N5)</title>

  <!-- Отступ под кнопки Telegram WebApp -->
  <style>
    body {
      padding-top: calc(80px + env(safe-area-inset-top, 0px)) !important;
    }
  </style>

  <style>
    :root {
      --bg-page: #f4f1ea;
      --card-bg: #ffffff;
      --text-main: #2c2c2a;
      --text-sub: #6b6a63;
      --text-muted: #9a988f;
      --border: #d3d1c7;
      --border-light: #e5e2d8;
      --accent: #d97757;
      --accent-hover: #c46849;
      
      --sel-bg: #eeecf0;
      --sel-border: #7f77dd;
      --sel-text: #3c3489;
      
      --success-bg: #eaf3de;
      --success-border: #97c459;
      --success-text: #3b6b19;
      
      --error-bg: #fbeae8;
      --error-border: #a32d2d;
      --error-text: #a32d2d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    #app {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .back-to-menu {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 6px;
      text-decoration: none;
      color: #6b6a63;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      background: #fff;
      border: 1px solid #d3d1c7;
      border-radius: 20px;
      margin-bottom: 2px;
    }

    /* Навигация по Уровням */
    .level-nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr) 1.2fr;
      gap: 4px;
    }

    .lvl-btn {
      padding: 10px 1px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .lvl-btn.active {
      background: var(--text-main);
      color: #ffffff;
      border-color: var(--text-main);
    }

    .lvl-btn.errors-btn {
      color: var(--error-border);
      border-color: var(--error-border);
    }
    .lvl-btn.errors-btn.active {
      background: var(--error-border);
      color: #ffffff;
    }

    /* Баннер правил */
    .theory-banner {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .theory-banner:active {
      background: var(--border-light);
    }

    /* Прогресс-бар */
    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .progress-container {
      width: 100%;
      height: 6px;
      background: var(--border-light);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.2s ease;
    }

    /* Игровая карточка */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 22px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }

    .target-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
    }

    .target-phrase {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: 1px;
    }

    .target-reading {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-sub);
      min-height: 20px;
    }

    .target-blank {
      color: var(--accent);
      border-bottom: 2px dashed var(--accent);
      padding: 0 4px;
    }

    .target-ru {
      font-size: 16px;
      font-weight: 600;
      color: var(--sel-text);
      line-height: 1.35;
    }

    /* Кнопка озвучки */
    .btn-sound {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-main);
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-sound:hover, .btn-sound:active {
      background: var(--border-light);
      transform: scale(0.95);
    }

    /* Сетка кнопок */
    .buttons-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .choice-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 13px 4px;
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .choice-btn:active {
      transform: scale(0.97);
      background: var(--sel-bg);
    }

    /* Блок пояснения */
    .feedback-box {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .feedback-box.correct {
      background: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success-text);
    }
    .feedback-box.wrong {
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      color: var(--error-text);
    }

    .fb-title {
      font-size: 14px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
    }

    .fb-body-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .fb-full {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-main);
    }
    .fb-kana {
      font-size: 14px;
      color: var(--text-sub);
    }
    .fb-rule {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.35;
    }

    .btn-action {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    /* Модалка теории */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(44, 44, 42, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }
    .modal-overlay.open { display: flex; }
    .modal-content {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 20px;
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 85vh;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.5;
    }
    .modal-close {
      align-self: flex-end;
      padding: 8px 16px;
      background: var(--text-main);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .dialog-view {
      background: var(--card-bg);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 36px 16px;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
  </style>
</head>
<body>
<div id="app">
  <a href="index.html" class="back-to-menu">← Меню</a>

  <!-- 1. Навигация по Уровням -->
  <div class="level-nav">
    <button type="button" class="lvl-btn active" id="lvlBtn1" onclick="switchLevel(1)">Ур 1</button>
    <button type="button" class="lvl-btn" id="lvlBtn2" onclick="switchLevel(2)">Ур 2</button>
    <button type="button" class="lvl-btn" id="lvlBtn3" onclick="switchLevel(3)">Ур 3</button>
    <button type="button" class="lvl-btn" id="lvlBtn4" onclick="switchLevel(4)">Ур 4</button>
    <button type="button" class="lvl-btn" id="lvlBtn5" onclick="switchLevel(5)">Ур 5</button>
    <button type="button" class="lvl-btn errors-btn" id="lvlBtnErr" onclick="switchLevel('errors')">Ошибки (0)</button>
  </div>

  <!-- 2. Баннер правил -->
  <div class="theory-banner" onclick="openTheory()">
    <span>📖 Правила</span>
  </div>

  <!-- 3. Прогресс -->
  <div class="progress-wrap">
    <div class="progress-labels">
      <span id="progCountLabel">Вопрос 1</span>
      <span id="progPctLabel">0%</span>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- 4. Игровая панель -->
  <div id="gamePanel" style="display: flex; flex-direction: column; gap: 8px;">
    <div class="card">
      <div class="target-header">
        <div class="target-phrase" id="qPhrase">大きい</div>
        <button type="button" class="btn-sound" onclick="replayQuestionAudio()" title="Послушать задание">🔊</button>
      </div>
      <div class="target-reading" id="qReading">おおきい</div>
      <div class="target-ru" id="qRu">Большой</div>
    </div>

    <!-- Кнопки вариантов ответов -->
    <div class="buttons-grid" id="choicesGrid"></div>

    <!-- Пояснение ответа -->
    <div class="feedback-box" id="feedbackBox">
      <div class="fb-title">
        <span id="fbVerdict">Верно!</span>
        <span id="fbTypeTag">い-прилагательное</span>
      </div>
      <div class="fb-body-wrap">
        <div>
          <div class="fb-full" id="fbFull">大きい</div>
          <div class="fb-kana" id="fbKana">おおきい</div>
        </div>
        <button type="button" class="btn-sound" onclick="replayAnswerAudio()" title="Послушать правильный ответ">🔊</button>
      </div>
      <div class="fb-rule" id="fbRule"></div>
      <button type="button" class="btn-action" id="btnNext" onclick="nextQuestion()">Дальше</button>
    </div>
  </div>

  <!-- Экран окончания списка -->
  <div class="dialog-view" id="emptyScreen">
    <h3 id="emptyTitle" style="font-size: 20px;">Уровень завершён!</h3>
    <p id="emptyDesc" style="font-size: 14px; color: var(--text-sub);">Все задания уровня пройдены. Отличная работа!</p>
    <button type="button" class="btn-action" onclick="restartLevel()">Пройти заново</button>
  </div>
</div>

<!-- Модалка теории -->
<div class="modal-overlay" id="theoryModal" onclick="closeTheory()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h3 id="modalTitle" style="font-size: 16px; font-weight: 700;">Правила</h3>
    <div id="modalBody"></div>
    <button type="button" class="modal-close" onclick="closeTheory()">Понятно</button>
  </div>
</div>

<script>

var jaVoice = null;
function initVoices() {
  if (!('speechSynthesis' in window)) return;
  var voices = window.speechSynthesis.getVoices();
  jaVoice = voices.find(function(v) { 
    return (v.lang === 'ja-JP' || v.lang === 'ja_JP' || v.lang.indexOf('ja') === 0) && 
           (v.name.toLowerCase().indexOf('kyoko') !== -1 || v.name.indexOf('Google 日本語') !== -1 || v.name.indexOf('Siri') !== -1);
  }) || voices.find(function(v) { 
    return v.lang === 'ja-JP' || v.lang === 'ja_JP' || v.lang.indexOf('ja') === 0; 
  }) || null;
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = initVoices;
  initVoices();
}
function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  try {
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'ja-JP';
    msg.rate = 0.88;
    if (jaVoice) msg.voice = jaVoice;
    window.speechSynthesis.speak(msg);
  } catch (e) {}
}

/* ==========================================================================
   АЛГОРИТМ ПЕРЕМЕШИВАНИЯ (FISHER-YATES SHUFFLE)
   ========================================================================== */
function shuffleArray(arr) {
  var copy = arr.slice();
  for (var i = copy.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var temp = copy[i];
    copy[i] = copy[j];
    copy[j] = temp;
  }
  return copy;
}

        reading: item.nr + "は " + (isIi ? "" : stemKana) + "＿＿",
        ru: item.ru_pred[3],
        correct: isI ? (isIi ? "よくなかったです" : "くなかったです") : "じゃなかったです",
        choices: choices1,
        full: item.nk + "は" + (isIi ? "よくなかったです" : (isI ? item.stem + "くなかったです" : item.stem + "じゃなかったです")),
        kana: item.nr + "は" + (isIi ? "よくなかったです" : (isI ? stemKana + "くなかったです" : stemKana + "じゃなかったです")),
        rule: isI ? "い-прил. прош. отриц.: 〜くなかったです" : "на-прил. прош. отриц.: 〜じゃなかったです",
        typeTag: isI ? "い-прилагательное" : "на-прилагательное"
      });
    }

    // -------------------------------------------------------------
    // УРОВЕНЬ 3: Перед существительным
    // -------------------------------------------------------------
    if (level === 3) {
      var choices2 = isIi
        ? ["いい", "な", "よくない", "じゃない", "よかった", "だった", "よくなかった", "じゃなかった"]
        : ["い", "な", "くない", "じゃない", "かった", "だった", "くなかった", "じゃなかった"];

      // Форма 0: Наст (+)
      deck.push({
        rawId: item.id,
        rawKana: item.r,
        phrase: item.stem + "＿＿ " + item.nk,
        reading: stemKana + "＿＿ " + item.nr,
        ru: item.ru_attr[0],
        correct: isI ? "い" : "な",
        choices: choices2,
        full: item.k + item.nk,
        kana: item.r + item.nr,
        rule: isI ? "い-прил. перед сущ.: 〜い + N" : "на-прил. перед сущ.: 〜な + N",
        typeTag: isI ? "い-прилагательное" : "на-прилагательное"
      });

      // Форма 1: Наст (-)
      deck.push({
        rawId: item.id,
        rawKana: item.r,
        phrase: (isIi ? "" : item.stem) + "＿＿ " + item.nk,
        reading: (isIi ? "" : stemKana) + "＿＿ " + item.nr,
        ru: item.ru_attr[1],
        correct: isI ? (isIi ? "よくない" : "くない") : "じゃない",
        choices: choices2,
        full: (isIi ? "よくない" : (isI ? item.stem + "くない" : item.stem + "じゃない")) + item.nk,
        kana: (isIi ? "よくない" : (isI ? stemKana + "くない" : stemKana + "じゃない")) + item.nr,
        rule: isI ? "い-прил. отриц. перед сущ.: 〜くない + N" : "на-прил. отриц. перед сущ.: 〜じゃない + N",
        typeTag: isI ? "い-прилагательное" : "на-прилагательное"
      });

      // Форма 2: Прош (+)
      deck.push({
        rawId: item.id,
        rawKana: item.r,
        phrase: (isIi ? "" : item.stem) + "＿＿ " + item.nk,
        reading: (isIi ? "" : stemKana) + "＿＿ " + item.nr,
        ru: item.ru_attr[2],
        correct: isI ? (isIi ? "よかった" : "かった") : "だった",
        choices: choices2,
        full: (isIi ? "よかった" : (isI ? item.stem + "かった" : item.stem + "だった")) + item.nk,
        kana: (isIi ? "よかった" : (isI ? stemKana + "かった" : stemKana + "だった")) + item.nr,
        rule: isI ? "い-прил. прошлое перед сущ.: 〜かった + N" : "на-прил. прошлое перед сущ.: 〜だった + N",
        typeTag: isI ? "い-прилагательное" : "на-прилагательное"
      });

      // Форма 3: Прош (-)
      deck.push({
        rawId: item.id,
        rawKana: item.r,
        phrase: (isIi ? "" : item.stem) + "＿＿ " + item.nk,
        reading: (isIi ? "" : stemKana) + "＿＿ " + item.nr,
        ru: item.ru_attr[3],
        correct: isI ? (isIi ? "よくなかった" : "くなかった") : "じゃなかった",
        choices: choices2,
        full: (isIi ? "よくなかった" : (isI ? item.stem + "くなかった" : item.stem + "じゃなかった")) + item.nk,
        kana: (isIi ? "よくなかった" : (isI ? stemKana + "くなかった" : stemKana + "じゃなかった")) + item.nr,
        rule: isI ? "い-прил. прош. отриц. перед сущ.: 〜くなかった + N" : "на-прил. прош. отриц. перед сущ.: 〜じゃなかった + N",
        typeTag: isI ? "い-прилагательное" : "на-прилагательное"
      });
    }

    // -------------------------------------------------------------
    // УРОВЕНЬ 4: Соединение
    // -------------------------------------------------------------
    if (level === 4) {
      var choices3 = isIi 
        ? ["よくて", "で", "よくなくて", "じゃなくて"] 
        : ["くて", "で", "くなくて", "じゃなくて"];

      // Соединение (+)
      var ans3 = isI ? (isIi ? "よくて" : "くて") : "で";
      var full3 = (isIi ? "よくて" : (isI ? item.stem + "くて" : item.stem + "で")) + "、いいです";
      var full3Kana = (isIi ? "よくて" : (isI ? stemKana + "くて" : stemKana + "で")) + "、いいです";
      deck.push({
        rawId: item.id,
        rawKana: item.r,
        phrase: (isIi ? "" : item.stem) + "＿＿ ...",
        reading: (isIi ? "" : stemKana) + "＿＿ ...",
        ru: item.ru_te[0],
        correct: ans3,
        choices: choices3,
        full: full3,
        kana: full3Kana,
        rule: isI ? "い-прил. соединение: 〜くて (いい → よくて)" : "на-прил. соединение: 〜で",
        typeTag: isI ? "い-прилагательное" : "на-прилагательное"
      });

      // Соединение (-)
      var ans3n = isI ? (isIi ? "よくなくて" : "くなくて") : "じゃなくて";
      var full3n = (isIi ? "よくなくて" : (isI ? item.stem + "くなくて" : item.stem + "じゃなくて")) + "、ダメです";
      var full3nKana = (isIi ? "よくなくて" : (isI ? stemKana + "くなくて" : stemKana + "じゃなくて")) + "、だめです";
      deck.push({
        rawId: item.id,
        rawKana: item.r,
        phrase: (isIi ? "" : item.stem) + "＿＿ ...",
        reading: (isIi ? "" : stemKana) + "＿＿ ...",
        ru: item.ru_te[1],
        correct: ans3n,
        choices: choices3,
        full: full3n,
        kana: full3nKana,
        rule: isI ? "い-прил. отриц. соединение: 〜くなくて" : "на-прил. отриц. соединение: 〜じゃなくて",
        typeTag: isI ? "い-прилагательное" : "на-прилагательное"
      });
    }

    // -------------------------------------------------------------
    // УРОВЕНЬ 5: Наречия
    // -------------------------------------------------------------
    if (level === 5) {
      var choices4 = isIi ? ["よく", "に", "よくて", "な"] : ["く", "に", "くて", "な"];
      var ans4 = isI ? (isIi ? "よく" : "く") : "に";
      var full4K = (isIi ? "よく" : (isI ? item.stem + "く" : item.stem + "に")) + " なります";
      var full4Kana = (isIi ? "よく" : (isI ? stemKana + "く" : stemKana + "に")) + " なります";
      deck.push({
        rawId: item.id,
        rawKana: item.r,
        phrase: (isIi ? "" : item.stem) + "＿＿ なります",
        reading: (isIi ? "" : stemKana) + "＿＿ なります",
        ru: item.ru_adv,
        correct: ans4,
        choices: choices4,
        full: full4K,
        kana: full4Kana,
        rule: isI ? "い-прил. в наречие: 〜い меняется на 〜く (いい → よく)" : "на-прил. в наречие: добавляется 〜に",
        typeTag: isI ? "い-прилагательное" : "на-прилагательное"
      });
    }
  });

  return shuffleArray(deck);
}

/* ==========================================================================
   УПРАВЛЕНИЕ ИГРОЙ
   ========================================================================== */
var currentLevel = 1;
var currentIndex = 0;
var currentList = [];
var errorList = [];
var isAnswered = false;

function initLevel() {
  if (currentLevel === 'errors') {
    currentList = errorList.slice();
  } else {
    currentList = generateLevelDeck(currentLevel);
  }
  currentIndex = 0;
  renderCard();
}

function renderCard() {
  isAnswered = false;
  document.getElementById('feedbackBox').style.display = 'none';
  document.getElementById('emptyScreen').style.display = 'none';
  document.getElementById('gamePanel').style.display = 'flex';

  if (currentList.length === 0 || currentIndex >= currentList.length) {
    showEmpty();
    return;
  }

  var currentTask = currentList[currentIndex];

  // Отрисовка фразы, чтения на хирагане и перевода
  document.getElementById('qPhrase').innerHTML = currentTask.phrase.replace("＿＿", "<span class='target-blank'>＿＿</span>");
  document.getElementById('qReading').textContent = currentTask.reading || currentTask.rawKana;
  document.getElementById('qRu').textContent = currentTask.ru;

  // Отрисовка кнопок ответов
  var grid = document.getElementById('choicesGrid');
  grid.innerHTML = '';
  grid.style.display = 'grid';

  currentTask.choices.forEach(function(ch) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice-btn';
    btn.textContent = ch;
    btn.onclick = function() { handleAnswer(ch); };
    grid.appendChild(btn);
  });

  // Прогресс
  var currentNum = currentIndex + 1;
  var total = currentList.length;
  var pct = Math.round((currentIndex / total) * 100);

  document.getElementById('progCountLabel').textContent = "Вопрос " + currentNum + " из " + total;
  document.getElementById('progPctLabel').textContent = pct + "%";
  document.getElementById('progressBar').style.width = pct + '%';

  speak(currentTask.rawKana);
}

function replayQuestionAudio() {
  if (currentList.length === 0 || currentIndex >= currentList.length) return;
  speak(currentList[currentIndex].rawKana);
}

function replayAnswerAudio() {
  if (currentList.length === 0 || currentIndex >= currentList.length) return;
  speak(currentList[currentIndex].kana);
}

function handleAnswer(chosen) {
  if (isAnswered) return;
  isAnswered = true;

  var currentTask = currentList[currentIndex];
  var isCorrect = (chosen === currentTask.correct);
  var fbBox = document.getElementById('feedbackBox');
  document.getElementById('choicesGrid').style.display = 'none';
  fbBox.style.display = 'flex';

  if (isCorrect) {
    fbBox.className = 'feedback-box correct';
    document.getElementById('fbVerdict').textContent = 'Правильно! ✨';
    if (currentLevel === 'errors') {
      errorList = errorList.filter(function(e) { return e.full !== currentTask.full; });
    }
  } else {
    fbBox.className = 'feedback-box wrong';
    document.getElementById('fbVerdict').textContent = 'Ошибка ✕';
    var exists = errorList.some(function(e) { return e.full === currentTask.full; });
    if (!exists) {
      errorList.push(currentTask);
    }
  }

  document.getElementById('fbTypeTag').textContent = currentTask.typeTag;
  document.getElementById('fbFull').textContent = currentTask.full;
  document.getElementById('fbKana').textContent = currentTask.kana;
  
  var ruleElem = document.getElementById('fbRule');
  if (currentTask.rule && currentTask.rule.trim().length > 0) {
    ruleElem.textContent = currentTask.rule;
    ruleElem.style.display = 'block';
  } else {
    ruleElem.textContent = '';
    ruleElem.style.display = 'none';
  }

  speak(currentTask.kana);
  updateUI();
}

function nextQuestion() {
  currentIndex++;
  renderCard();
}

function showEmpty() {
  document.getElementById('gamePanel').style.display = 'none';
  document.getElementById('emptyScreen').style.display = 'flex';
  document.getElementById('progCountLabel').textContent = "Завершено";
  document.getElementById('progPctLabel').textContent = "100%";
  document.getElementById('progressBar').style.width = '100%';

  if (currentLevel === 'errors') {
    document.getElementById('emptyTitle').textContent = errorList.length === 0 ? 'Ошибок нет!' : 'Круг ошибок завершен';
    document.getElementById('emptyDesc').textContent = errorList.length === 0 ? 'Все ошибки успешно исправлены!' : 'Осталось ошибок: ' + errorList.length;
  } else {
    document.getElementById('emptyTitle').textContent = 'Уровень ' + currentLevel + ' завершён!';
    document.getElementById('emptyDesc').textContent = 'Все задания уровня успешно пройдены. Отличная работа!';
  }
}

function restartLevel() {
  initLevel();
}

/* ==========================================================================
   НАВИГАЦИЯ
   ========================================================================== */
function switchLevel(lvl) {
  currentLevel = lvl;
  updateUI();
  initLevel();
}

function updateUI() {
  for (var i = 1; i <= 5; i++) {
    var btn = document.getElementById('lvlBtn' + i);
    if (btn) btn.className = (currentLevel === i) ? 'lvl-btn active' : 'lvl-btn';
  }
  var errBtn = document.getElementById('lvlBtnErr');
  if (errBtn) {
    errBtn.className = (currentLevel === 'errors') ? 'lvl-btn errors-btn active' : 'lvl-btn errors-btn';
    errBtn.textContent = 'Ошибки (' + errorList.length + ')';
  }
}

/* ==========================================================================
   ПРАВИЛА
   ========================================================================== */
function openTheory() {
  var modal = document.getElementById('theoryModal');
  var mTitle = document.getElementById('modalTitle');
  var mBody = document.getElementById('modalBody');

  if (currentLevel === 1) {
    mTitle.textContent = "Правила: Группы прилагательных";
    mBody.innerHTML = `
      <p>В японском языке есть 2 группы прилагательных:</p><br>
      <p><strong>1. い-прилагательные:</strong><br>Всегда оканчиваются на слог <code>い</code> (в хирагане):<br>
      <em>大きい, 小さい, 新しい, 暑い</em> и т.д.</p><br>
      <p><strong>2. な-прилагательные:</strong><br>В словарной форме не имеют суффикса <code>い</code> (требуют <code>な</code> только перед существительными):<br>
      <em>静か, 元気, 便利, 親切</em> и т.д.</p><br>
      <p><strong>⚠️ Ловушки (выглядят как い, но это な!):</strong><br>
      • <strong>綺麗</strong> (きれい) — Красивый/Чистый<br>
      • <strong>嫌い</strong> (きらい) — Нелюбимый<br>
      • <strong>有名</strong> (ゆうめい) — Известный</p>
    `;
  } else if (currentLevel === 2) {
    mTitle.textContent = "Правила: В конце предложения";
    mBody.innerHTML = `
      <p><strong>い-прилагательные:</strong></p>
      <p>• Наст. (+): <code>〜いです</code></p>
      <p>• Наст. (-): <code>〜くないです</code></p>
      <p>• Прош. (+): <code>〜かったです</code></p>
      <p>• Прош. (-): <code>〜くなかったです</code></p>
      <p><em>*Исключение 良い (いい): よくないです, よかったです, よくなかったです</em></p>
      <br>
      <p><strong>な-прилагательные:</strong></p>
      <p>• Наст. (+): <code>〜です</code> <em>(без な)</em></p>
      <p>• Наст. (-): <code>〜じゃないです</code></p>
      <p>• Прош. (+): <code>〜でした</code></p>
      <p>• Прош. (-): <code>〜じゃなかったです</code></p>
    `;
  } else if (currentLevel === 3) {
    mTitle.textContent = "Правила: Перед существительным";
    mBody.innerHTML = `
      <p><strong>い-прилагательные:</strong></p>
      <p>• Наст. (+): <code>〜い + Сущ</code></p>
      <p>• Прош. (+): <code>〜かった + Сущ</code></p>
      <p>• Наст. (-): <code>〜くない + Сущ</code></p>
      <p>• Прош. (-): <code>〜くなかった + Сущ</code></p>
      <br>
      <p><strong>な-прилагательные:</strong></p>
      <p>• Наст. (+): <code>〜な + Сущ</code></p>
      <p>• Прош. (+): <code>〜だった + Сущ</code> <em>(НЕ でした)</em></p>
      <p>• Наст. (-): <code>〜じゃない + Сущ</code></p>
      <p>• Прош. (-): <code>〜じゃなかった + Сущ</code></p>
    `;
  } else if (currentLevel === 4) {
    mTitle.textContent = "Правила: Соединение";
    mBody.innerHTML = `
      <p><strong>い-прилагательные:</strong></p>
      <p>• Утвердительное: <code>〜くて</code></p>
      <p>• Отрицательное: <code>〜くなくて</code></p>
      <p><em>*Исключение 良い (いい): よくて, よくなくて</em></p>
      <br>
      <p><strong>на-прилагательные:</strong></p>
      <p>• Утвердительное: <code>〜で</code></p>
      <p>• Отрицательное: <code>〜じゃなくて</code></p>
    `;
  } else if (currentLevel === 5) {
    mTitle.textContent = "Правила: Наречия";
    mBody.innerHTML = `
      <p><strong>い-прилагательные:</strong></p>
      <p>• Окончание <code>〜い</code> меняется на <code>〜く</code></p>
      <p><em>*Исключение 良い (いい): よく</em></p>
      <br>
      <p><strong>な-прилагательные:</strong></p>
      <p>• Добавляется суффикс <code>〜に</code></p>
    `;
  } else {
    mTitle.textContent = "Правила: Работа над ошибками";
    mBody.innerHTML = "<p>Здесь собраны конкретные карточки, в которых вы ошиблись. Ответьте на них правильно, чтобы убрать из списка!</p>";
  }

  modal.classList.add('open');
}

function closeTheory() {
  document.getElementById('theoryModal').classList.remove('open');
}

// Горячие клавиши (1-8 для вариантов, Enter для перехода)
document.addEventListener('keydown', function(e) {
  if (e.key >= '1' && e.key <= '8') {
    var idx = parseInt(e.key) - 1;
    var btns = document.querySelectorAll('.choice-btn');
    if (btns && btns[idx] && document.getElementById('choicesGrid').style.display !== 'none') {
      btns[idx].click();
    }
  } else if (e.key === 'Enter') {
    var nextBtn = document.getElementById('btnNext');
    if (document.getElementById('feedbackBox').style.display === 'flex') {
      nextBtn.click();
    }
  }
});

// Старт
updateUI();
initLevel();
</script>
